                            <div id="arch-select-container">
                                <label class="text-sm text-muted uppercase font-semibold mb-2 block">Target Architecture</label>
                                <select id="select-arch" class="input" style="width: 100%; background: var(--bg-body); color: white; border: 1px solid var(--color-border); border-radius: 6px; padding: 8px;">
                                    <option value="ResNet">ResNet</option>
                                    <option value="DenseNet">DenseNet</option>
                                    <option value="U-Net">U-Net</option>
                                    <option value="Transformer">Transformer</option>
                                    <option value="ViT">ViT</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-sm text-muted uppercase font-semibold mb-2 block">Difficulty Level</label>
                                <select id="select-difficulty" class="input" style="width: 100%; background: var(--bg-body); color: white; border: 1px solid var(--color-border); border-radius: 6px; padding: 8px;">
                                    <option value="beginner">Beginner</option>
                                    <option value="intermediate">Intermediate</option>
                                    <option value="advanced">Advanced</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn btn-primary w-full" onclick="generateNewChallenge()"><i class="fa-solid fa-sync"></i> Generate Puzzler</button>
                    </div>

                    <!-- Challenge Display Card -->
                    <div id="challenge-card" class="card" style="display: none; border-left: 4px solid var(--accent-transformer);">
                        <div class="flex justify-between items-center mb-4">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="badge" id="challenge-badge" style="background: rgba(139, 92, 246, 0.1); color: var(--accent-transformer);">Tensor Challenge</span>
                                <span class="badge" id="challenge-level-badge" style="background: rgba(16, 185, 129, 0.1); color: var(--accent-cnn); font-size: 0.7rem;"></span>
                            </div>
                            <span class="badge" id="challenge-diff-badge" style="background: var(--bg-panel); color: var(--color-text-secondary);">Beginner</span>
                        </div>

                        <div id="challenge-question" class="text-lg font-heading mb-6" style="line-height: 1.5; white-space: pre-wrap;"></div>

                        <div id="challenge-input-area" class="mb-6">
                            <!-- Injected choices or input box -->
                        </div>

                        <div id="challenge-feedback" class="mb-6 card" style="display: none; padding: var(--space-4);">
                            <div class="flex items-center gap-2 mb-2 font-heading" id="feedback-title"></div>
                            <div id="feedback-text" class="text-sm text-muted" style="line-height: 1.6; white-space: pre-wrap;"></div>
                        </div>

                        <!-- Step-by-Step Solution (shown on correct answer) -->
                        <div id="challenge-solution" style="display: none; margin-bottom: 16px;">
                            <button onclick="toggleSolutionCollapse()" style="width: 100%; display: flex; align-items: center; justify-content: space-between; background: rgba(16,185,129,0.07); border: 1px solid rgba(16,185,129,0.25); border-radius: 8px; padding: 10px 14px; cursor: pointer; color: var(--accent-cnn); font-weight: 600; font-size: 0.875rem;">
                                <span><i class="fa-solid fa-list-ol" style="margin-right: 6px;"></i> Step-by-Step Solution</span>
                                <i class="fa-solid fa-chevron-down" id="solution-chevron"></i>
                            </button>
                            <div id="solution-body" style="background: rgba(16,185,129,0.04); border: 1px solid rgba(16,185,129,0.2); border-top: none; border-radius: 0 0 8px 8px; padding: 14px; display: none;">
                                <div id="solution-steps" style="font-size: 0.875rem; color: var(--color-text-secondary); line-height: 1.7; white-space: pre-wrap;"></div>
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <button id="challenge-submit-btn" class="btn btn-primary" style="flex: 1;" onclick="submitChallengeAnswer()">Submit Answer</button>
                            <button id="challenge-next-btn" class="btn btn-outline" style="display: none;" onclick="generateNewChallenge()"><i class="fa-solid fa-forward"></i> Next Challenge</button>
                        </div>
                    </div>
                </div>
            `;

            // State management
            let currentType = 'tensor';
            window.selectedDifficulty = 1;

            const DIFFICULTY_LEVEL_MAP = { 1: 'beginner', 2: 'beginner', 3: 'intermediate', 4: 'advanced', 5: 'advanced' };
            const DIFFICULTY_LABEL_MAP = { 1: 'L1 — Recognition', 2: 'L2 — Reasoning', 3: 'L3 — Multi-Step', 4: 'L4 — Design', 5: 'L5 — Research' };
            const DIFFICULTY_COLORS = { 1: '#10b981', 2: '#34d399', 3: '#f59e0b', 4: '#ef4444', 5: '#8b5cf6' };

            window.selectDifficultyLevel = (level) => {
                window.selectedDifficulty = level;
                document.querySelectorAll('.difficulty-pill').forEach((btn, i) => {
                    const lvl = i + 1;
                    const color = DIFFICULTY_COLORS[lvl];
                    if (lvl === level) {
                        btn.style.borderColor = color;
                        btn.style.background = `${color}22`;
                        btn.style.color = color;
                    } else {
                        btn.style.borderColor = 'var(--color-border)';
                        btn.style.background = 'transparent';
                        btn.style.color = 'var(--color-text-secondary)';
                    }
                });
                // Sync the hidden select
                const diffSelect = document.getElementById('select-difficulty');
                if (diffSelect) diffSelect.value = DIFFICULTY_LEVEL_MAP[level];
            };

            window.selectAssessmentType = (type) => {
                currentType = type;
                document.querySelectorAll('.clickable-type').forEach(el => el.classList.remove('active'));
                const targetEl = document.getElementById('type-' + type);
                if (targetEl) targetEl.classList.add('active');

                const archContainer = document.getElementById('arch-select-container');
                if (archContainer) {
                    if (type === 'comparison' || type === 'tensor' || type === 'flops' || type === 'compute') {
                        archContainer.style.opacity = '0.5';
                        document.getElementById('select-arch').disabled = true;
                    } else {
                        archContainer.style.opacity = '1';
                        document.getElementById('select-arch').disabled = false;
                    }
                }
            };

            window.toggleSolutionCollapse = () => {
                const body = document.getElementById('solution-body');
                const chevron = document.getElementById('solution-chevron');
                if (!body) return;
                const isOpen = body.style.display !== 'none';
                body.style.display = isOpen ? 'none' : 'block';
                if (chevron) {
                    chevron.className = isOpen ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-up';
                }
            };

            selectAssessmentType('tensor');
            selectDifficultyLevel(1);

            window.generateNewChallenge = async () => {
                const challengeCard = document.getElementById('challenge-card');
                const submitBtn = document.getElementById('challenge-submit-btn');
                const nextBtn = document.getElementById('challenge-next-btn');
                const feedbackDiv = document.getElementById('challenge-feedback');
                
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.display = 'block';
                }
                if (nextBtn) nextBtn.style.display = 'none';
                if (feedbackDiv) feedbackDiv.style.display = 'none';

                const arch = document.getElementById('select-arch').value;
                const difficulty = DIFFICULTY_LEVEL_MAP[window.selectedDifficulty] || document.getElementById('select-difficulty').value;

                // Also hide solution panel
                const solutionDiv = document.getElementById('challenge-solution');
                if (solutionDiv) solutionDiv.style.display = 'none';
                const solutionBody = document.getElementById('solution-body');
                if (solutionBody) solutionBody.style.display = 'none';
                const solutionChevron = document.getElementById('solution-chevron');
                if (solutionChevron) solutionChevron.className = 'fa-solid fa-chevron-down';

                if (challengeCard) {
                    challengeCard.style.display = 'block';
                    challengeCard.scrollIntoView({ behavior: 'smooth' });
                }
                
                const questionContainer = document.getElementById('challenge-question');
                const inputArea = document.getElementById('challenge-input-area');
                
                if (questionContainer) questionContainer.innerHTML = '<div class="spinner"></div>';
                if (inputArea) inputArea.innerHTML = '';

                try {
                    const res = await fetch(`/api/assessment/challenge?type=${currentType}&arch=${arch}&difficulty=${difficulty}`);
                    if (!res.ok) throw new Error("Failed to load challenge");
                    const challenge = await res.json();
                    
                    window.currentChallenge = challenge;
                    
                    const typeBadge = document.getElementById('challenge-badge');
                    if (typeBadge && challengeCard) {
                        typeBadge.innerText = currentType.toUpperCase();
                        if (currentType === 'tensor') {
                            typeBadge.style.color = 'var(--accent-cnn)';
                            typeBadge.style.background = 'rgba(16, 185, 129, 0.1)';
                            challengeCard.style.borderLeftColor = 'var(--accent-cnn)';
                        } else if (currentType === 'flops') {
                            typeBadge.style.color = 'var(--accent-unet)';
                            typeBadge.style.background = 'rgba(6, 182, 212, 0.1)';
                            challengeCard.style.borderLeftColor = 'var(--accent-unet)';
                        } else if (currentType === 'architecture') {
                            typeBadge.style.color = 'var(--accent-transformer)';
                            typeBadge.style.background = 'rgba(139, 92, 246, 0.1)';
                            challengeCard.style.borderLeftColor = 'var(--accent-transformer)';
                        } else if (currentType === 'compute') {
                            typeBadge.style.color = '#FBBF24';
                            typeBadge.style.background = 'rgba(251, 191, 36, 0.1)';
                            challengeCard.style.borderLeftColor = '#FBBF24';
                        } else if (currentType === 'design') {
                            typeBadge.style.color = '#EC4899';
                            typeBadge.style.background = 'rgba(236, 72, 153, 0.1)';
                            challengeCard.style.borderLeftColor = '#EC4899';
                        } else {
                            typeBadge.style.color = '#EF4444';
                            typeBadge.style.background = 'rgba(239, 68, 68, 0.1)';
                            challengeCard.style.borderLeftColor = '#EF4444';
                        }
                    }

                    // Show difficulty level badge
                    const levelBadge = document.getElementById('challenge-level-badge');
                    if (levelBadge) {
                        const lvl = window.selectedDifficulty || 1;
                        const color = DIFFICULTY_COLORS[lvl];
                        levelBadge.innerText = DIFFICULTY_LABEL_MAP[lvl];
                        levelBadge.style.background = `${color}22`;
                        levelBadge.style.color = color;
                        levelBadge.style.borderColor = `${color}44`;
                    }

                    const diffBadge = document.getElementById('challenge-diff-badge');
                    if (diffBadge) diffBadge.innerText = challenge.difficulty.toUpperCase();
                    
                    if (questionContainer) questionContainer.innerText = challenge.question;
                    
                    if (inputArea) {
                        if (challenge.choices && challenge.choices.length > 0) {
                            let html = '<div class="flex" style="flex-direction: column; gap: var(--space-2);">';
                            challenge.choices.forEach((choice, index) => {
                                html += `
                                    <label class="card choice-option" style="display: flex; align-items: flex-start; gap: var(--space-3); padding: var(--space-3); cursor: pointer; transition: all var(--transition-base); border: 1px solid var(--color-border); border-radius: 8px;">
                                        <input type="radio" name="challenge-answer" value="${choice}" style="margin-top: 3px;" />
                                        <span style="font-size: 0.95rem; color: var(--color-text-primary);">${choice}</span>
                                    </label>
                                `;
                            });
                            html += '</div>';
                            inputArea.innerHTML = html;
                        } else {
                            inputArea.innerHTML = `
                                <input type="text" id="challenge-answer-text" class="input" placeholder="Enter your answer..." style="width: 100%; background: var(--bg-body); color: white; border: 1px solid var(--color-border); border-radius: 8px; padding: 12px; font-size: 1rem;"/>
                            `;
                        }
                    }
                } catch (e) {
                    if (questionContainer) questionContainer.innerHTML = `<div class="text-danger">Failed to generate challenge: ${e.message}</div>`;
                }
            };

            window.submitChallengeAnswer = async () => {
                const challenge = window.currentChallenge;
                if (!challenge) return;
                
                let answer = '';
                if (challenge.choices && challenge.choices.length > 0) {
                    const checked = document.querySelector('input[name="challenge-answer"]:checked');
                    if (!checked) {
                        alert("Please select an option!");
                        return;
                    }
                    answer = checked.value;
                } else {
                    const txt = document.getElementById('challenge-answer-text');
                    if (!txt || !txt.value.trim()) {
                        alert("Please type an answer!");
                        return;
                    }
                    answer = txt.value.trim();
                }

                const submitBtn = document.getElementById('challenge-submit-btn');
                if (submitBtn) submitBtn.disabled = true;

                try {
                    const res = await fetch('/api/assessment/validate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ challenge, user_answer: answer })
                    });
                    
                    const result = await res.json();
                    
                    const feedbackDiv = document.getElementById('challenge-feedback');
                    const feedbackTitle = document.getElementById('feedback-title');
                    const feedbackText = document.getElementById('feedback-text');
                    const nextBtn = document.getElementById('challenge-next-btn');

                    if (feedbackDiv) {
                        feedbackDiv.style.display = 'block';
                        feedbackDiv.scrollIntoView({ behavior: 'smooth' });
                        
                        if (result.is_correct) {
                            feedbackDiv.style.borderColor = 'rgba(16, 185, 129, 0.4)';
                            feedbackDiv.style.background = 'rgba(16, 185, 129, 0.05)';
                            if (feedbackTitle) feedbackTitle.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--accent-cnn);"></i> <span style="color: var(--accent-cnn);">Correct!</span>`;
                        } else {
                            feedbackDiv.style.borderColor = 'rgba(239, 68, 68, 0.4)';
                            feedbackDiv.style.background = 'rgba(239, 68, 68, 0.05)';
                            if (feedbackTitle) feedbackTitle.innerHTML = `<i class="fa-solid fa-circle-xmark" style="color: #EF4444;"></i> <span style="color: #EF4444;">Incorrect</span>`;
                        }
                    }
                    
                    if (feedbackText) {
                        let text = `Your answer: ${result.user_answer}\n`;
                        if (!result.is_correct) {
                            text += `Correct answer: ${result.correct_answer}\n\n`;
                        }
                        text += `${result.explanation}`;
                        feedbackText.innerText = text;
                    }

                    // Show step-by-step solution on correct answer
                    const solutionDiv = document.getElementById('challenge-solution');
                    const solutionSteps = document.getElementById('solution-steps');
                    if (solutionDiv && result.is_correct) {
                        solutionDiv.style.display = 'block';
                        if (solutionSteps) {
                            const steps = result.step_by_step || result.steps || result.solution_steps;
                            if (steps && Array.isArray(steps) && steps.length > 0) {
                                solutionSteps.innerHTML = steps.map((s, i) =>
                                    `<div style="display:flex;gap:10px;margin-bottom:8px"><span style="flex-shrink:0;font-weight:700;color:var(--accent-cnn)">${i+1}.</span><span>${s}</span></div>`
                                ).join('');
                            } else if (typeof steps === 'string') {
                                solutionSteps.innerText = steps;
                            } else {
                                solutionSteps.innerText = result.explanation || 'Explanation shown above.';
                            }
                        }
                    } else if (solutionDiv) {
                        solutionDiv.style.display = 'none';
                    }

                    if (submitBtn) submitBtn.style.display = 'none';
                    if (nextBtn) nextBtn.style.display = 'block';
                } catch (e) {
                    alert("Validation failed: " + e.message);
                    if (submitBtn) submitBtn.disabled = false;
                }
            };
        }

        // --- Phase 8: Analytics Dashboard Page ---
        async function renderDashboardPage(params, query) {
            navActions.innerHTML = `<a href="#/" class="btn btn-outline"><i class="fa-solid fa-arrow-left mr-2"></i> Library</a>`;
            appContainer.innerHTML = `<div class="spinner"></div>`;

            // Fetch dashboard data — degrade gracefully on failure
            let data = {};
            try {
                const learnerId = localStorage.getItem('learner_id') || 'default';
                const dashRes = await fetch('/api/analytics/dashboard', {
                    headers: { 'X-Learner-ID': learnerId }
                });
                if (dashRes.ok) {
                    data = await dashRes.json();
                }
            } catch (_) {
                // network error — use empty data, show no-data state below
            }

            // Destructure with safe defaults — these are plain objects, not arrays
            const overview = data.learning_overview || {};
            const perf = data.assessment_performance || {};
            const tutor = data.tutor_usage || {};
            // learning_path is {current_position, next_recommended}, NOT an array
            const learningPath = data.learning_path || {};
            // reviews_and_recommendations may carry review list
            const revsAndRecs = data.reviews_and_recommendations || {};

            // If no data at all, show empty state
            const hasData = Object.keys(overview).length > 0 || Object.keys(perf).length > 0;
            if (!hasData) {
                appContainer.innerHTML = `
                    <div class="page-view" style="max-width: 600px; margin: 60px auto; text-align: center;">
                        <div class="card" style="padding: 48px;">
                            <i class="fa-solid fa-chart-bar" style="font-size: 3rem; color: var(--color-text-tertiary); margin-bottom: 16px;"></i>
                            <h2 class="font-heading text-xl mb-3">No Learning Data Yet</h2>
                            <p class="text-muted text-sm">Start exploring papers and completing modules to see your personalised analytics here.</p>
                            <a href="#/" class="btn btn-primary mt-4">Browse Library</a>
                        </div>
                    </div>
                `;
                return;
            }

            // --- Top stats row (3 columns) ---
            const papersStarted = overview.papers_started ?? 0;
            const totalPapers   = overview.total_papers   ?? 0;
            const modulesCompleted = overview.modules_completed ?? 0;
            const totalModules     = overview.total_modules     ?? 0;
            const completionPct    = overview.completion_percentage ?? 0;
            const accuracyPct      = perf.accuracy_percentage ?? 0;
            const totalAttempts    = perf.total_attempts ?? 0;
            const questionsAsked   = tutor.questions_asked ?? 0;

            // --- Knowledge radar data (6 axes from assessment_performance or defaults) ---
            const archScores = perf.architecture_scores || {};
            const radarValues = [
                (archScores['CNNs']          ?? archScores['cnn']          ?? 0.5) * 100,
                (archScores['ResNets']        ?? archScores['resnet']        ?? 0.5) * 100,
                (archScores['Transformers']   ?? archScores['transformer']   ?? 0.5) * 100,
                (archScores['Attention']      ?? archScores['attention']     ?? 0.5) * 100,
                (archScores['Efficiency']     ?? archScores['efficiency']    ?? 0.5) * 100,
                (archScores['Segmentation']   ?? archScores['segmentation']  ?? 0.5) * 100
            ];

            // --- Review plan: use reviews_and_recommendations.today_review or reviews array ---
            const reviewPlanItems = (revsAndRecs.today_review || revsAndRecs.review_modules || []);
            let planHtml = '';
            if (reviewPlanItems.length > 0) {
                planHtml = `<div class="card mb-4" style="border-top: 4px solid var(--accent-transformer);">
                    <h3 class="font-heading mb-3 text-xl"><i class="fa-solid fa-calendar-check" style="color: var(--accent-transformer);"></i> Today's Review Plan</h3>
                    <p class="text-xs text-muted mb-4">Targeted activities prioritised based on your active weakness areas.</p>
                    <div class="grid-cols-3 gap-4">`;
                reviewPlanItems.forEach((item, idx) => {
                    let icon = 'fa-book';
                    if (item.type === 'assessment') icon = 'fa-graduation-cap';
                    else if (item.type === 'paper') icon = 'fa-file-lines';
                    const url = item.url || (item.paper_id ? `#/papers/${item.paper_id}` : '#/');
                    const title = item.title || item.paper_title || item.layer_name || 'Review Task';
                    planHtml += `
                        <div class="metric-card flex" style="flex-direction: column; justify-content: space-between; min-height: 120px;">
                            <div>
                                <span class="badge mb-2" style="background: rgba(139,92,246,0.1); color: var(--accent-transformer); font-size: 0.65rem;">Task ${idx + 1}</span>
                                <div class="font-semibold text-sm mb-2" style="color: var(--color-text-primary); line-height: 1.4;"><i class="fa-solid ${icon} mr-1"></i> ${title}</div>
                            </div>
                            <a href="${url}" class="btn btn-primary btn-sm w-full text-center" style="font-size: 0.75rem; padding: 6px 12px; margin-top: auto; border-radius: 6px;">Launch</a>
                        </div>`;
                });
                planHtml += `</div></div>`;
            }

            // --- Learning path (object, not array) ---
            const currentPos     = learningPath.current_position   || 'Not started';
            const nextRecommended = learningPath.next_recommended   || 'Explore the library';
            const pathHtml = `
                <div class="metric-card mb-3" style="border-left: 4px solid var(--accent-cnn);">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="badge badge-cnn mr-2">Current Position</span>
                    </div>
                    <p class="text-sm font-semibold" style="color: var(--color-text-primary);">${currentPos}</p>
                </div>
                <div class="metric-card" style="border-left: 4px solid var(--accent-transformer);">
                    <div class="flex items-center gap-2 mb-2">
                        <span class="badge badge-transformer mr-2">Next Recommended</span>
                    </div>
                    <p class="text-sm font-semibold" style="color: var(--color-text-primary);">${nextRecommended}</p>
                </div>`;

            appContainer.innerHTML = `
                <div class="page-view" style="display: flex; flex-direction: column; gap: 24px;">

                    <!-- Top stats row: 3 columns -->
                    <div class="grid-cols-3 gap-4">
                        <div class="metric-card text-center reveal">
                            <div class="metric-label">Papers Progress</div>
                            <div class="metric-value" style="color: var(--color-text-primary); font-size: 2rem;"><span class="count-up" data-to="${papersStarted}" data-decimals="0">0</span> <span style="font-size:1rem; color:var(--color-text-tertiary);">/ ${totalPapers}</span></div>
                            <div class="text-xs text-muted mt-1">papers started</div>
                        </div>
                        <div class="metric-card text-center reveal">
                            <div class="metric-label">Assessment Accuracy</div>
                            <div class="metric-value" style="color: var(--accent-unet); font-size: 2rem;"><span class="count-up" data-to="${accuracyPct}" data-decimals="0" data-suffix="%">0%</span></div>
                            <div class="text-xs text-muted mt-1">${totalAttempts} attempts total</div>
                        </div>
                        <div class="metric-card text-center reveal">
                            <div class="metric-label">Tutor Questions</div>
                            <div class="metric-value" style="color: var(--accent-transformer); font-size: 2rem;"><span class="count-up" data-to="${questionsAsked}" data-decimals="0">0</span></div>
                            <div class="text-xs text-muted mt-1">${tutor.most_asked_context || 'No context yet'}</div>
                        </div>
                    </div>

                    <!-- Middle row: 2 columns -->
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">

                        <!-- Learning Overview -->
                        <div class="card">
                            <h3 class="font-heading mb-4 text-xl"><i class="fa-solid fa-chart-pie" style="color: var(--accent-cnn);"></i> Learning Overview</h3>
                            <div class="grid-cols-2 gap-4 mb-4">
                                <div class="metric-card text-center">
                                    <div class="metric-label">Papers Completed</div>
                                    <div class="metric-value" style="color: var(--accent-cnn); font-size: 1.75rem;">${overview.papers_completed ?? 0}</div>
                                </div>
                                <div class="metric-card text-center">
                                    <div class="metric-label">Modules Done</div>
                                    <div class="metric-value" style="color: var(--accent-unet); font-size: 1.75rem;">${modulesCompleted} <span style="font-size:0.9rem;color:var(--color-text-tertiary);">/ ${totalModules}</span></div>
                                </div>
                            </div>
                            <!-- Modules progress bar -->
                            <div style="background: var(--color-border-subtle); border-radius: 8px; height: 14px; width: 100%; overflow: hidden;">
                                <div style="background: linear-gradient(90deg, var(--accent-cnn), var(--accent-unet)); height: 100%; width: ${completionPct}%; border-radius: 8px; transition: width 0.5s ease-in-out;"></div>
                            </div>
                            <div class="text-right text-xs text-muted mt-1 font-semibold">${completionPct}% Course Completed</div>
                        </div>

                        <!-- Assessment Performance -->
                        <div class="card">
                            <h3 class="font-heading mb-4 text-xl"><i class="fa-solid fa-clipboard-question" style="color: var(--accent-unet);"></i> Assessment Performance</h3>
                            <div class="grid-cols-2 gap-4">

        const HP_TRAIN_PY = `
import json
import numpy as np

def _make_data(kind, n, noise, seed):
    rng = np.random.RandomState(seed)
    n2 = n // 2
    if kind == 'circles':
        t = rng.uniform(0, 2*np.pi, n2)
        inner = np.stack([0.4*np.cos(t), 0.4*np.sin(t)], 1)
        t2 = rng.uniform(0, 2*np.pi, n2)
        outer = np.stack([1.0*np.cos(t2), 1.0*np.sin(t2)], 1)
        X = np.vstack([inner, outer]); y = np.array([0]*n2 + [1]*n2)
    elif kind == 'spiral':
        i = np.arange(n2).astype(float)
        r = i / n2
        ta = 1.5 * i / n2 * 2*np.pi
        a = np.stack([r*np.sin(ta), r*np.cos(ta)], 1)
        tb = 1.5 * i / n2 * 2*np.pi + np.pi
        b = np.stack([r*np.sin(tb), r*np.cos(tb)], 1)
        X = np.vstack([a, b]); y = np.array([0]*n2 + [1]*n2)
    else:  # moons
        t = np.linspace(0, np.pi, n2)
        a = np.stack([np.cos(t), np.sin(t)], 1)
        b = np.stack([1 - np.cos(t), 1 - np.sin(t) - 0.5], 1)
        X = np.vstack([a, b]); y = np.array([0]*n2 + [1]*n2)
    X = X + noise * rng.randn(*X.shape)
    X = (X - X.mean(0)) / (X.std(0) + 1e-8)
    return X, y.astype(int)

def _act_f(z, act):
    return np.maximum(0, z) if act == 'relu' else np.tanh(z)

def _act_d(z, a, act):
    return (z > 0).astype(float) if act == 'relu' else (1 - a*a)

def train_mlp(kind, lr, hidden, act, opt, epochs, noise, seed=0):
    X, y = _make_data(kind, 240, noise, seed)
    n, d = X.shape; C = 2
    rng = np.random.RandomState(seed + 1)
    P = {'W1': rng.randn(d, hidden)*0.7, 'b1': np.zeros(hidden),
         'W2': rng.randn(hidden, C)*0.7, 'b2': np.zeros(C)}
    M = {k: np.zeros_like(v) for k, v in P.items()}
    V = {k: np.zeros_like(v) for k, v in P.items()}
    Y = np.eye(C)[y]
    losses = []; diverged = False; t = 0
    for ep in range(epochs):
        z1 = X @ P['W1'] + P['b1']; a1 = _act_f(z1, act)
        z2 = a1 @ P['W2'] + P['b2']
        z2 = z2 - z2.max(1, keepdims=True)
        e = np.exp(z2); prob = e / e.sum(1, keepdims=True)
        loss = float(-np.mean(np.sum(Y*np.log(prob+1e-12), 1)))
        if (not np.isfinite(loss)) or loss > 50:
            diverged = True
            losses.append(min(loss, 50.0) if np.isfinite(loss) else 50.0)
            break
        losses.append(loss)
        dz2 = (prob - Y) / n
        G = {}
        G['W2'] = a1.T @ dz2; G['b2'] = dz2.sum(0)
        da1 = dz2 @ P['W2'].T; dz1 = da1 * _act_d(z1, a1, act)
        G['W1'] = X.T @ dz1; G['b1'] = dz1.sum(0)
        t += 1
        for k in P:
            g = G[k]
            if opt == 'sgd':
                P[k] = P[k] - lr * g
            elif opt == 'momentum':
                M[k] = 0.9 * M[k] + g
                P[k] = P[k] - lr * M[k]
            else:  # adam
                M[k] = 0.9 * M[k] + 0.1 * g
                V[k] = 0.999 * V[k] + 0.001 * (g*g)
                mh = M[k] / (1 - 0.9**t); vh = V[k] / (1 - 0.999**t)
                P[k] = P[k] - lr * mh / (np.sqrt(vh) + 1e-8)

    a1 = _act_f(X @ P['W1'] + P['b1'], act)
    logits = a1 @ P['W2'] + P['b2']
    acc = float((logits.argmax(1) == y).mean())

    GRID = 44
    pad = 0.4
    xs = np.linspace(X[:,0].min()-pad, X[:,0].max()+pad, GRID)
    ys = np.linspace(X[:,1].min()-pad, X[:,1].max()+pad, GRID)
    gx, gy = np.meshgrid(xs, ys)
    Gpts = np.stack([gx.ravel(), gy.ravel()], 1)
    ga = _act_f(Gpts @ P['W1'] + P['b1'], act)
    gl = ga @ P['W2'] + P['b2']
    gl = gl - gl.max(1, keepdims=True)
    ge = np.exp(gl); gp = (ge / ge.sum(1, keepdims=True))[:, 1]
    grid = gp.reshape(GRID, GRID)

    return json.dumps({
        'losses': [round(float(x), 5) for x in losses],
        'acc': round(acc, 4),
        'diverged': bool(diverged),
        'grid': [[round(float(v), 4) for v in row] for row in grid.tolist()],
        'xs': [round(float(v), 4) for v in xs.tolist()],
        'ys': [round(float(v), 4) for v in ys.tolist()],
        'points': [[round(float(a), 4), round(float(b), 4)] for a, b in X.tolist()],
        'labels': [int(v) for v in y.tolist()],
    })
`;

        function hpInitSandbox() {
            const bind = (id, valId, fmt) => {
                const el = document.getElementById(id), out = document.getElementById(valId);
                if (!el || !out) return;
                const upd = () => { out.textContent = fmt(parseFloat(el.value)); };
                el.addEventListener('input', upd); upd();
            };
            bind('hp-lr', 'hp-lr-val', v => Math.pow(10, v).toFixed(v < -1 ? 3 : 2));
            bind('hp-hid', 'hp-hid-val', v => String(Math.round(v)));
            bind('hp-ep', 'hp-ep-val', v => String(Math.round(v)));
            bind('hp-noise', 'hp-noise-val', v => v.toFixed(2));
            // Draw an empty boundary placeholder
            const c = document.getElementById('hp-boundary');
            if (c) { const ctx = c.getContext('2d'); ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = '#64748b'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Press Train to begin', c.width/2, c.height/2); }
        }

        function hpReadParams() {
            return {
                kind: document.getElementById('hp-data').value,
                opt: document.getElementById('hp-opt').value,
                act: document.getElementById('hp-act').value,
                lr: Math.pow(10, parseFloat(document.getElementById('hp-lr').value)),
                hidden: Math.round(parseFloat(document.getElementById('hp-hid').value)),
                epochs: Math.round(parseFloat(document.getElementById('hp-ep').value)),
                noise: parseFloat(document.getElementById('hp-noise').value),
            };
        }

        async function hpRunTrain(p) {
            const py = await ensurePyodide();
            if (!window.__hpPyLoaded) { await py.runPythonAsync(HP_TRAIN_PY); window.__hpPyLoaded = true; }
            py.globals.set('__kind', p.kind); py.globals.set('__lr', p.lr);
            py.globals.set('__hidden', p.hidden); py.globals.set('__act', p.act);
            py.globals.set('__opt', p.opt); py.globals.set('__epochs', p.epochs);
            py.globals.set('__noise', p.noise);
            const raw = await py.runPythonAsync('train_mlp(__kind, __lr, __hidden, __act, __opt, __epochs, __noise)');
            return JSON.parse(raw);
        }

        async function hpTrainSandbox() {
            const btn = document.getElementById('hp-train-btn');
            const msg = document.getElementById('hp-sandbox-msg');
            const prev = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Training…';
            msg.innerHTML = `<span class="text-muted"><i class="fa-solid fa-circle-notch fa-spin"></i> Booting Python (first run downloads NumPy)…</span>`;
            try {
                const p = hpReadParams();
                const r = await hpRunTrain(p);
                hpDrawBoundary('hp-boundary', r);
                hpRenderLoss([{ label: p.opt.toUpperCase(), data: r.losses, color: '#8b5cf6' }]);
                document.getElementById('hp-acc').textContent = `acc ${(r.acc*100).toFixed(0)}%`;
                if (r.diverged) {
                    msg.innerHTML = `<div class="hp-callout danger"><i class="fa-solid fa-triangle-exclamation"></i> <strong>Training diverged.</strong> The loss exploded — your <strong>learning rate (${p.lr.toFixed(3)})</strong> is too high for this setup. Slide it left and retry.</div>`;
                } else if (r.acc > 0.9) {
                    msg.innerHTML = `<div class="hp-callout ok"><i class="fa-solid fa-circle-check"></i> Converged to <strong>${(r.acc*100).toFixed(0)}%</strong> accuracy in ${r.losses.length} epochs.</div>`;
                } else {
                    msg.innerHTML = `<div class="hp-callout warn"><i class="fa-solid fa-circle-info"></i> Reached ${(r.acc*100).toFixed(0)}% — try more epochs, more hidden units, or a higher learning rate.</div>`;
                }
            } catch (e) {
                msg.innerHTML = `<div class="hp-callout danger">Runtime error: ${dojoEsc(e.message || String(e))}</div>`;
            } finally {
                btn.disabled = false; btn.innerHTML = prev;
            }
        }

        async function hpCompareOptimizers() {
            const btn = document.getElementById('hp-race-btn');
            const msg = document.getElementById('hp-sandbox-msg');
            const prev = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Racing…';
            msg.innerHTML = `<span class="text-muted"><i class="fa-solid fa-circle-notch fa-spin"></i> Training three optimizers on identical data…</span>`;
            try {
                const base = hpReadParams();
                const colors = { sgd: '#ef4444', momentum: '#f59e0b', adam: '#10b981' };
                const series = [];
                let lastR = null;
                for (const opt of ['sgd', 'momentum', 'adam']) {
                    const r = await hpRunTrain({ ...base, opt });
                    series.push({ label: opt.toUpperCase(), data: r.losses, color: colors[opt] });
                    lastR = r;
                }
                hpRenderLoss(series);
                if (lastR) hpDrawBoundary('hp-boundary', lastR);
                document.getElementById('hp-acc').textContent = '';
                msg.innerHTML = `<div class="hp-callout ok"><i class="fa-solid fa-flag-checkered"></i> Same data, same learning rate (${base.lr.toFixed(3)}). Notice how <span style="color:#10b981">Adam</span> and <span style="color:#f59e0b">Momentum</span> usually drop faster than plain <span style="color:#ef4444">SGD</span>.</div>`;
            } catch (e) {
                msg.innerHTML = `<div class="hp-callout danger">Runtime error: ${dojoEsc(e.message || String(e))}</div>`;
            } finally {
                btn.disabled = false; btn.innerHTML = prev;
            }
        }

        function hpRenderLoss(series) {
            const ctx = document.getElementById('hp-loss');
            if (!ctx || typeof Chart === 'undefined') return;
            const maxLen = Math.max(...series.map(s => s.data.length));
            const labels = Array.from({ length: maxLen }, (_, i) => i + 1);
            if (hpLossChart) hpLossChart.destroy();
            hpLossChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: series.map(s => ({
                        label: s.label, data: s.data, borderColor: s.color,
                        backgroundColor: s.color + '22', borderWidth: 2, pointRadius: 0, tension: 0.2
                    }))
                },
                options: {
                    responsive: true, maintainAspectRatio: false, animation: false,
                    scales: {
                        x: { title: { display: true, text: 'epoch', color: '#94a3b8' }, ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { title: { display: true, text: 'cross-entropy loss', color: '#94a3b8' }, ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' }, beginAtZero: true }
                    },
                    plugins: { legend: { labels: { color: '#cbd5e1' } } }
                }
            });
        }

        function hpDrawBoundary(canvasId, r) {
            const c = document.getElementById(canvasId);
            if (!c) return;
            const ctx = c.getContext('2d');
            const W = c.width, H = c.height;
            const G = r.grid.length;
            const cw = W / G, ch = H / G;
            // Heatmap of P(class=1): blue (0) -> red (1)
            for (let i = 0; i < G; i++) {
                for (let j = 0; j < G; j++) {
                    const p = r.grid[i][j];
                    const rC = Math.round(60 + 195 * p), bC = Math.round(60 + 195 * (1 - p));
                    ctx.fillStyle = `rgb(${rC},70,${bC})`;
                    // grid row i = ys index (low y at row 0) -> draw from bottom up
                    ctx.fillRect(j * cw, H - (i + 1) * ch, Math.ceil(cw), Math.ceil(ch));
                }
            }
            // Map data point coords -> pixel using xs/ys ranges
            const x0 = r.xs[0], x1 = r.xs[r.xs.length - 1];
            const y0 = r.ys[0], y1 = r.ys[r.ys.length - 1];
            const px = x => ((x - x0) / (x1 - x0)) * W;
            const py = y => H - ((y - y0) / (y1 - y0)) * H;
            r.points.forEach((pt, idx) => {
                ctx.beginPath();
                ctx.arc(px(pt[0]), py(pt[1]), 3.2, 0, 2 * Math.PI);
                ctx.fillStyle = r.labels[idx] === 1 ? '#fca5a5' : '#93c5fd';
                ctx.fill();
                ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.stroke();
            });
        }

        async function renderHyperparametersPage(params, query) {
            navActions.innerHTML = `<a href="#/" class="btn btn-outline"><i class="fa-solid fa-arrow-left mr-2"></i> Library</a>`;

            try {
                const response = await fetch('/api/hyperparameters');
                if (!response.ok) throw new Error('Hyperparameters not found');
                const data = await response.json();
                const hp = data.hyperparameters;

                // Group definitions. Keys are lowercase substrings matched
                // case-insensitively against the API's title-case keys
                // (e.g. "learning rate" matches "Learning Rate").
                const GROUPS = {
                    'OPTIMIZATION': {
                        keys: ['learning rate', 'weight decay', 'batch size', 'momentum', 'adam'],
                        icon: 'fa-rocket',
                        color: 'var(--accent-transformer)',
                        colorRgb: '139, 92, 246'

                    'REGULARIZATION': {
                        keys: ['dropout', 'label smoothing'],
                        icon: 'fa-shield-halved',
                        color: 'var(--accent-cnn)',
                        colorRgb: '59, 130, 246'
                    },
                    'TRAINING STABILITY': {
                        keys: ['warmup', 'gradient clipping', 'normalization'],
                        icon: 'fa-scale-balanced',
                        color: '#fbbf24',
                        colorRgb: '251, 191, 36'
                    },
                    'ARCHITECTURE-SPECIFIC': {
                        keys: ['attention heads', 'hidden dimension', 'num_attention_heads', 'hidden_size', 'num_heads', 'hidden_dim'],
                        icon: 'fa-microchip',

                function buildFailureTip(key, val) {
                    const increaseText = (val.increase_effect || '').toLowerCase();
                    const decreaseText = (val.decrease_effect || '').toLowerCase();
                    let tip = '';
                    if (increaseText.includes('diverge') || increaseText.includes('unstable') || increaseText.includes('explod')) {
                        tip = 'Too high can cause training divergence or gradient explosion.';
                    } else if (decreaseText.includes('underfit') || decreaseText.includes('slow') || decreaseText.includes('never converge')) {
                        tip = 'Too low risks underfitting or extremely slow convergence.';
                    } else if (increaseText.includes('overfit')) {
                        tip = 'Increasing too much can lead to overfitting on training data.';
                    } else if (key.toLowerCase().includes('dropout')) {
                        tip = 'Too high drops too many neurons, hurting expressivity; too low fails to regularize.';
                    } else if (key.toLowerCase().includes('batch')) {
                        tip = 'Very large batches can reduce gradient noise to the point of sharp minima and poor generalization.';
                    } else {
                        tip = 'Extreme values in either direction typically degrade model stability or generalization.';
                    }
                    return tip;
                }

                function buildArchPills(val) {
                    const notes = val.architecture_notes;
                    if (!notes || (Array.isArray(notes) && notes.length === 0)) return '';
                    const items = Array.isArray(notes) ? notes : Object.entries(notes).map(([k, v]) => `${k}: ${v}`);
                    const pills = items.map(n => `<span style="display:inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; color: var(--color-text-secondary); margin: 2px;">${n}</span>`).join('');
                    return `

                            <div style="display: flex; flex-wrap: wrap; gap: 4px;">${pills}</div>
                        </div>`;
                }

                function buildCard(key, val, accentColor, accentRgb) {
                    const typicalRange = val.typical_range || '';
                    const failureTip = buildFailureTip(key, val);
                    const archPills = buildArchPills(val);
                    return `
                        <div class="card" style="border-top: 4px solid ${accentColor}; display: flex; flex-direction: column; gap: var(--space-3);">
                            <div class="flex justify-between items-center">
                                <h3 class="font-heading" style="font-size: 1.2rem; margin: 0; font-family: var(--font-mono);">${key}</h3>

                            </div>
                            <p class="text-sm text-muted" style="line-height: 1.55; margin: 0;">${val.what_it_does || ''}</p>
                            ${typicalRange ? `<div style="font-size: 0.78rem; color: ${accentColor}; background: rgba(${accentRgb}, 0.07); border-radius: 6px; padding: 6px 10px;"><i class="fa-solid fa-ruler-horizontal" style="margin-right: 5px;"></i><strong>Typical range:</strong> ${typicalRange}</div>` : ''}
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                                <div style="background: rgba(239, 68, 68, 0.05); border: 1px solid rgba(239, 68, 68, 0.22); border-radius: 8px; padding: 11px;">
                                    <div style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #ef4444; margin-bottom: 5px; letter-spacing: 0.04em;"><i class="fa-solid fa-arrow-trend-up"></i> If Increased</div>
                                    <div style="font-size: 0.8rem; color: #fca5a5; line-height: 1.45;">${val.increase_effect || '—'}</div>
                                </div>
                                <div style="background: rgba(16, 185, 129, 0.05); border: 1px solid rgba(16, 185, 129, 0.22); border-radius: 8px; padding: 11px;">
                                    <div style="font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #10b981; margin-bottom: 5px; letter-spacing: 0.04em;"><i class="fa-solid fa-arrow-trend-down"></i> If Decreased</div>
                                    <div style="font-size: 0.8rem; color: #a7f3d0; line-height: 1.45;">${val.decrease_effect || '—'}</div>
                                </div>
                            </div>
                            ${archPills}
                            <div style="background: rgba(251, 191, 36, 0.06); border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 6px; padding: 8px 12px; margin-top: 2px; display: flex; gap: 8px; align-items: flex-start;">
                                <i class="fa-solid fa-triangle-exclamation" style="color: #fbbf24; font-size: 0.8rem; margin-top: 2px; flex-shrink: 0;"></i>
                                <span style="font-size: 0.78rem; color: #fde68a; line-height: 1.45;"><strong>Failure mode:</strong> ${failureTip}</span>
                            </div>
                        </div>`;
                }

                // Assign each key to a group (or "OTHER")
                const assignedKeys = new Set();
                let sectionsHtml = '';

                Object.entries(GROUPS).forEach(([groupName, groupDef]) => {
                    const matchedEntries = groupDef.keys
                        .map(k => [k, hp[k]])
                        .filter(([k, v]) => v !== undefined);
                    // Also do case-insensitive partial match for keys not exact
                    const extraMatches = Object.entries(hp).filter(([k]) =>
                        !assignedKeys.has(k) &&
                        !groupDef.keys.includes(k) &&
                        groupDef.keys.some(gk => k.toLowerCase().includes(gk.toLowerCase()) || gk.toLowerCase().includes(k.toLowerCase()))
                    );
                    const allEntries = [...matchedEntries, ...extraMatches].filter(([k]) => !assignedKeys.has(k));
                    allEntries.forEach(([k]) => assignedKeys.add(k));

                    if (allEntries.length === 0) return;

                    const cardsInGroup = allEntries.map(([k, v]) => buildCard(k, v, groupDef.color, groupDef.colorRgb)).join('');
                    sectionsHtml += `

                                </div>
                                <h2 style="font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: ${groupDef.color}; margin: 0;">${groupName}</h2>

                            <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px;">
                                ${cardsInGroup}
                            </div>
                        </div>`;
                });

                // Remaining (unassigned) params
                const otherEntries = Object.entries(hp).filter(([k]) => !assignedKeys.has(k));
                if (otherEntries.length > 0) {
                    const otherCards = otherEntries.map(([k, v]) => buildCard(k, v, '#94a3b8', '148, 163, 184')).join('');
                    sectionsHtml += `
                        <div style="margin-bottom: 36px;">
                            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.07);">
                                <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(148, 163, 184, 0.12); display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 0.9rem; flex-shrink: 0;">

                appContainer.innerHTML = `

                            <div style="display: inline-block; background: rgba(139, 92, 246, 0.08); border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 10px; padding: 12px 20px; max-width: 720px; font-size: 0.9rem; color: var(--color-text-secondary); line-height: 1.55; margin-top: 8px;">
                                <i class="fa-solid fa-circle-info" style="color: var(--accent-transformer); margin-right: 6px;"></i>
                                Understanding hyperparameters is critical to training stability and model performance. Small changes can mean the difference between convergence and divergence, between generalization and overfitting.
                            </div>
                        </div>

                        ${hpSandboxHtml()}

                        ${sectionsHtml}
                    </div>
                `;

                hpInitSandbox();

            } catch (err) {

        // Lazy in-browser Python (Pyodide + NumPy). Loaded only when the Dojo
        // route is first opened, then cached for the session.
        let pyodideReadyPromise = null;
        function ensurePyodide() {
            if (pyodideReadyPromise) return pyodideReadyPromise;
            pyodideReadyPromise = (async () => {
                if (typeof loadPyodide === 'undefined') {
                    await new Promise((resolve, reject) => {
                        const s = document.createElement('script');
                        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js';
                        s.onload = resolve;
                        s.onerror = () => reject(new Error('Failed to load Pyodide runtime'));
                        document.head.appendChild(s);
                    });
                }
                const py = await loadPyodide();
                await py.loadPackage('numpy');
                return py;
            })().catch(err => { pyodideReadyPromise = null; throw err; });
            return pyodideReadyPromise;
        }

        async function dojoRunTests(mode) {
            mode = mode || 'submit';
            const ex = window.dojo.current;
            if (!ex) return;
            const btnId = mode === 'run' ? 'dojo-run-btn' : 'dojo-submit-btn';
            const btn = document.getElementById(btnId);
            const resEl = document.getElementById('dojo-results');
            const prevLabel = btn ? btn.innerHTML : '';
            if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> ' + (mode === 'run' ? 'Running…' : 'Judging…'); }
            resEl.innerHTML = `<div class="dojo-running"><i class="fa-solid fa-circle-notch fa-spin"></i> Booting Python runtime (first run downloads NumPy)…</div>`;

            // Run mode = visible examples only; Submit = all test cases.
            const ec = ex.example_count || Math.min(2, ex.test_inputs.length);
            const upto = mode === 'run' ? ec : ex.test_inputs.length;

            try {
                const py = await ensurePyodide();
                const code = dojoGetCode();
                const tests = ex.test_inputs.slice(0, upto).map((inp, i) => ({ inputs: inp, expected: ex.expected_outputs[i] }));

                py.globals.set('__user_code', code);
                py.globals.set('__tests_json', JSON.stringify(tests));
                py.globals.set('__fn_name', ex.fn_name);
                py.globals.set('__tol', ex.tolerance);

                // Harness mirrors the server: numeric lists -> np.array; deep-match
                // numbers (tolerance) / lists / dicts / strings / bools.
                const harness = `
import json, numpy as np

def __is_num(v):
    return isinstance(v, (int, float)) and not isinstance(v, bool)

def __to_json(x):
    if isinstance(x, np.ndarray): return x.tolist()
    if isinstance(x, np.floating): return float(x)
    if isinstance(x, np.integer): return int(x)
    if isinstance(x, np.bool_): return bool(x)
    if isinstance(x, dict): return {str(k): __to_json(v) for k, v in x.items()}
    if isinstance(x, (list, tuple)): return [__to_json(e) for e in x]
    return x

def __num_list(v):
    f = v
    while isinstance(f, list) and f: f = f[0]
    return isinstance(f, (int, float)) and not isinstance(f, bool)

def __match(e, g, tol):
    if __is_num(e) and __is_num(g):
        if e != e and g != g: return True
        return abs(float(e) - float(g)) <= tol + 1e-9 * max(1.0, abs(float(e)))
    if isinstance(e, bool) or isinstance(g, bool): return e == g
    if isinstance(e, (list, tuple)) and isinstance(g, (list, tuple)):
        return len(e) == len(g) and all(__match(a, b, tol) for a, b in zip(e, g))
    if isinstance(e, dict) and isinstance(g, dict):
        if set(map(str, e.keys())) != set(map(str, g.keys())): return False
        gn = {str(k): v for k, v in g.items()}
        return all(__match(v, gn[str(k)], tol) for k, v in e.items())
    return e == g

__ns = {'np': np, 'numpy': np}
__results = []
try:
    exec(__user_code, __ns)
except Exception as __e:
    __results = [{'pass': False, 'error': 'Your code has an error: ' + str(__e)}]
else:
    __fn = __ns.get(__fn_name)
    if __fn is None:
        __results = [{'pass': False, 'error': "Define a function named '" + __fn_name + "'."}]
    else:
        for __t in json.loads(__tests_json):
            try:
                __kw = {k: (np.array(v, dtype=float) if (isinstance(v, list) and __num_list(v)) else v) for k, v in __t['inputs'].items()}
                __out = __to_json(__fn(**__kw))
                __ok = bool(__match(__t['expected'], __out, __tol))
                __results.append({'pass': __ok, 'got': __out})
            except Exception as __e:
                __results.append({'pass': False, 'error': str(__e)})
json.dumps(__results)
`;
                const raw = await py.runPythonAsync(harness);
                const results = JSON.parse(raw);
                dojoRenderResults(ex, results, mode);
            } catch (e) {
                resEl.innerHTML = `<div class="dojo-test-row fail"><i class="fa-solid fa-triangle-exclamation"></i> Runtime error: ${dojoEsc(e.message || String(e))}</div>`;
            } finally {
                if (btn) { btn.disabled = false; btn.innerHTML = prevLabel; }
            }
        }

        function dojoRenderResults(ex, results, mode) {
            const resEl = document.getElementById('dojo-results');
            const ec = ex.example_count || Math.min(2, ex.test_inputs.length);
            const passed = results.filter(r => r.pass).length;
            const allPass = passed === results.length && results.length > 0;
            let rows = '';
            results.forEach((r, i) => {
                const isExample = i < ec;
                const label = isExample ? `Example ${i + 1}` : `Hidden test ${i + 1 - ec}`;
                if (r.pass) {
                    rows += `<div class="dojo-test-row pass"><i class="fa-solid fa-circle-check"></i> ${label} passed</div>`;
                } else if (r.error) {
                    rows += `<div class="dojo-test-row fail"><i class="fa-solid fa-circle-xmark"></i> ${label}: ${dojoEsc(r.error)}</div>`;
                } else if (isExample) {
                    rows += `<div class="dojo-test-row fail">
                        <i class="fa-solid fa-circle-xmark"></i> ${label} failed
                        <div class="dojo-test-detail">input: <code>${dojoEsc(JSON.stringify(ex.test_inputs[i]))}</code><br>expected: <code>${dojoEsc(JSON.stringify(ex.expected_outputs[i]))}</code><br>got: <code>${dojoEsc(JSON.stringify(r.got))}</code></div>
                    </div>`;
                } else {
                    // hidden test failures don't reveal the expected value
                    rows += `<div class="dojo-test-row fail"><i class="fa-solid fa-circle-xmark"></i> ${label} failed</div>`;
                }
            });
            let banner;
            if (allPass && mode === 'submit') {
                banner = `<div class="dojo-banner success"><i class="fa-solid fa-trophy"></i> Accepted — all ${results.length} tests passed! 🎉</div>`;
            } else if (allPass) {
                banner = `<div class="dojo-banner success"><i class="fa-solid fa-circle-check"></i> Examples passed — hit Submit to run the hidden tests.</div>`;
            } else {
                banner = `<div class="dojo-banner partial">${passed}/${results.length} ${mode === 'run' ? 'examples' : 'tests'} passing. Keep going!</div>`;
            }
            resEl.innerHTML = banner + rows;

            // Only a full Submit pass counts as solved.
            if (allPass && mode === 'submit') {
                const progress = dojoProgressLoad();
                const prev = progress[ex.id] || { attempts: 0 };
                progress[ex.id] = { passed: true, attempts: (prev.attempts || 0) + 1 };
                dojoProgressSave(progress);
                dojoRenderCatalog(ex.id);
                const learnerId = localStorage.getItem('learner_id') || 'default';
                fetch('/api/dojo/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-Learner-ID': learnerId },
                    body: JSON.stringify({ exercise_id: ex.id, passed: true, attempts: progress[ex.id].attempts })
                }).catch(() => {});
            }
        }

            appContainer.innerHTML = `

                    </div>

                    <div style="display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; margin-bottom: 32px;">
                        <!-- Config Panel -->
                        <div class="card" style="display: flex; flex-direction: column; gap: var(--space-4); position: sticky; top: 20px;">

                                    <option value="FCN">FCN</option>
                                    <option value="U-Net">U-Net</option>

                                    <option value="ViT">ViT</option>
