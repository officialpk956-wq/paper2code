                            <div>
                                <label class="text-sm text-muted uppercase font-semibold mb-2 block">Dataset Size (Samples)</label>
                                <input type="number" id="est-dataset" class="input" value="1000000" style="${inputStyle}" min="1" />
                            </div>

                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <div>
                                    <label class="text-sm text-muted uppercase font-semibold mb-2 block">Batch Size</label>
                                    <input type="number" id="est-batch" class="input" value="32" style="${inputStyle}" min="1" />
                                </div>
                                <div>
                                    <label class="text-sm text-muted uppercase font-semibold mb-2 block">Epochs</label>
                                    <input type="number" id="est-epochs" class="input" value="90" style="${inputStyle}" min="1" />
                                </div>
                            </div>

                            <div>
                                <label class="text-sm text-muted uppercase font-semibold mb-2 block">GPU Hardware</label>
                                <select id="est-gpu" class="input" style="${inputStyle}">
                                    <option value="T4">T4 — 16 GB, Budget Cloud</option>
                                    <option value="L4">L4 — 24 GB, Inference-optimized</option>
                                    <option value="RTX3090">RTX 3090 — 24 GB, Consumer</option>
                                    <option value="RTX4090">RTX 4090 — 24 GB, Consumer Flagship</option>
                                    <option value="V100">V100 — 16 GB, Legacy Cloud</option>
                                    <option value="A100" selected>A100 40 GB — High TFLOPS</option>
                                    <option value="A100_80GB">A100 80 GB — Large Model</option>
                                    <option value="H100">H100 — Flagship</option>
                                </select>
                            </div>

                            <!-- Toggles -->
                            <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--bg-panel); border-radius: 8px; border: 1px solid rgba(255,255,255,0.06);">
                                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.85rem; color: var(--color-text-secondary);">
                                    <input type="checkbox" id="est-mixed-precision" checked style="width: 16px; height: 16px; accent-color: var(--accent-transformer); cursor: pointer;" />
                                    <span><strong style="color: var(--color-text-primary);">Mixed Precision</strong> (FP16 / BF16)</span>
                                </label>
                                <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.85rem; color: var(--color-text-secondary);">
                                    <input type="checkbox" id="est-gradient-checkpointing" style="width: 16px; height: 16px; accent-color: var(--accent-unet); cursor: pointer;" />
                                    <span><strong style="color: var(--color-text-primary);">Gradient Checkpointing</strong> — trade compute for memory</span>
                                </label>
                            </div>

                            <button class="btn btn-primary w-full mt-2" onclick="calculateEstimates()" style="font-size: 1rem; padding: 12px;">
                                <i class="fa-solid fa-calculator"></i> Calculate Estimates
                            </button>
                        </div>

                        <!-- Results Panel -->
                        <div id="estimator-results" style="min-height: 360px; display: flex; flex-direction: column; justify-content: center;">
                            <div class="card text-center text-muted" id="estimator-placeholder" style="padding: 60px 40px;">
                                <i class="fa-solid fa-chart-line mb-4" style="font-size: 3.5rem; opacity: 0.25; display: block; margin-bottom: 16px;"></i>
                                <p style="font-size: 0.95rem;">Set your training configuration and click <strong>Calculate Estimates</strong> to see VRAM requirements, training duration, cost breakdown, and a full GPU comparison.</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            window.calculateEstimates = async () => {
                const resultsContainer = document.getElementById('estimator-results');
                resultsContainer.innerHTML = '<div class="card" style="display:flex;align-items:center;justify-content:center;min-height:300px;"><div class="spinner"></div></div>';

                const payload = {
                    architecture: document.getElementById('est-arch').value,
                    dataset_size: parseInt(document.getElementById('est-dataset').value),
                    batch_size: parseInt(document.getElementById('est-batch').value),
                    epochs: parseInt(document.getElementById('est-epochs').value),
                    gpu_type: document.getElementById('est-gpu').value,
                    mixed_precision: document.getElementById('est-mixed-precision').checked,
                    gradient_checkpointing: document.getElementById('est-gradient-checkpointing').checked
                };

                try {
                    const res = await fetch('/api/training-estimator', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) throw new Error('Calculation failed');
                    const data = await res.json();

                    let count = parseInt(localStorage.getItem('estimates_calculated_count') || '0');
                    localStorage.setItem('estimates_calculated_count', count + 1);

                    // GPU comparison data
                    const GPU_SPECS = [
                        { key: 'T4',       label: 'T4',          vram: 16,  tflops: 65,   cost_per_hour: 0.35 },
                        { key: 'L4',       label: 'L4',          vram: 24,  tflops: 121,  cost_per_hour: 0.54 },
                        { key: 'RTX3090',  label: 'RTX 3090',    vram: 24,  tflops: 142,  cost_per_hour: 0.50 },
                        { key: 'RTX4090',  label: 'RTX 4090',    vram: 24,  tflops: 330,  cost_per_hour: 0.74 },
                        { key: 'V100',     label: 'V100',        vram: 16,  tflops: 112,  cost_per_hour: 2.48 },
                        { key: 'A100',     label: 'A100 40GB',   vram: 40,  tflops: 312,  cost_per_hour: 3.06 },
                        { key: 'A100_80GB',label: 'A100 80GB',   vram: 80,  tflops: 312,  cost_per_hour: 3.67 },
                        { key: 'H100',     label: 'H100',        vram: 80,  tflops: 989,  cost_per_hour: 4.69 }
                    ];

                    const requiredVram = data.gpu_memory_gb;
                    const archFlops = data.arch_profile ? data.arch_profile.flops : 0;
                    const archParams = data.arch_profile ? data.arch_profile.params : 0;
                    const efficiency = 0.45;
                    const stepsPerEpoch = Math.ceil(payload.dataset_size / payload.batch_size);
                    const totalSteps = stepsPerEpoch * payload.epochs;
                    const flopsPerStep = archFlops * payload.batch_size * 3; // fwd + bwd ~3x

                    function gpuHours(gpuSpec) {
                        if (archFlops === 0) return data.training_hours;
                        const effectiveTflops = gpuSpec.tflops * efficiency * 1e12;
                        return (flopsPerStep * totalSteps) / effectiveTflops / 3600;
                    }

                    let tableRows = '';
                    const chartLabels = [];
                    const chartCosts = [];
                    const chartColors = [];

                    GPU_SPECS.forEach(gpu => {
                        const hrs = gpuHours(gpu);
                        const cost = hrs * gpu.cost_per_hour;
                        const fits = gpu.vram >= requiredVram;
                        const rowBg = fits
                            ? 'background: rgba(16, 185, 129, 0.06);'
                            : 'background: rgba(239, 68, 68, 0.06);';
                        const fitsIcon = fits
                            ? '<i class="fa-solid fa-circle-check" style="color: #10b981;"></i> Yes'
                            : '<i class="fa-solid fa-circle-xmark" style="color: #ef4444;"></i> No';
                        const isSelected = gpu.key === payload.gpu_type;
                        tableRows += `
                            <tr style="${rowBg} ${isSelected ? 'outline: 2px solid var(--accent-transformer); outline-offset: -2px;' : ''}">
                                <td style="padding: 8px 12px; font-size: 0.82rem; font-weight: ${isSelected ? '700' : '400'}; color: ${isSelected ? 'var(--accent-transformer)' : 'var(--color-text-primary)'};">
                                    ${isSelected ? '<i class="fa-solid fa-star" style="font-size:0.65rem; margin-right:4px; color:var(--accent-transformer);"></i>' : ''}${gpu.label}
                                </td>
                                <td style="padding: 8px 12px; font-size: 0.82rem; text-align: center;">${gpu.vram} GB</td>
                                <td style="padding: 8px 12px; font-size: 0.82rem; text-align: center;">${hrs.toFixed(2)}h</td>
                                <td style="padding: 8px 12px; font-size: 0.82rem; text-align: center; font-weight: 600;">$${cost.toFixed(2)}</td>
                                <td style="padding: 8px 12px; font-size: 0.82rem; text-align: center;">${fitsIcon}</td>
                            </tr>`;
                        chartLabels.push(gpu.label);
                        chartCosts.push(parseFloat(cost.toFixed(2)));
                        chartColors.push(fits ? 'rgba(16, 185, 129, 0.75)' : 'rgba(239, 68, 68, 0.55)');
                    });

                    const mpBadge = payload.mixed_precision
                        ? `<span style="background:rgba(139,92,246,0.12);color:var(--accent-transformer);border:1px solid rgba(139,92,246,0.3);border-radius:20px;padding:2px 9px;font-size:0.72rem;">FP16/BF16 ON</span>`
                        : `<span style="background:rgba(255,255,255,0.05);color:#94a3b8;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:2px 9px;font-size:0.72rem;">FP32</span>`;
                    const gcBadge = payload.gradient_checkpointing
                        ? `<span style="background:rgba(16,185,129,0.1);color:#10b981;border:1px solid rgba(16,185,129,0.25);border-radius:20px;padding:2px 9px;font-size:0.72rem;">GRAD CKPT ON</span>`
                        : '';

                    resultsContainer.innerHTML = `
                        <div style="display: flex; flex-direction: column; gap: 24px;">

                            <!-- Big cost number -->
                            <div class="card" style="border-top: 4px solid var(--accent-transformer); text-align: center; padding: 28px 24px;">
                                <div style="font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--color-text-secondary); margin-bottom: 8px;">Estimated Compute Cost</div>
                                <div style="font-size: 3.2rem; font-weight: 800; color: var(--color-text-primary); line-height: 1; font-family: var(--font-heading);">$${data.compute_cost_usd.toFixed(2)}</div>
                                <div style="font-size: 0.8rem; color: var(--color-text-secondary); margin-top: 6px;">USD &bull; ${payload.architecture} on ${GPU_SPECS.find(g=>g.key===payload.gpu_type)?.label || payload.gpu_type}</div>
                                <div style="display: flex; gap: 6px; justify-content: center; margin-top: 10px;">${mpBadge}${gcBadge}</div>
                            </div>

                            <!-- VRAM / Hours / Cost breakdown 3-col -->
                            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                                <div class="metric-card" style="border-left: 4px solid var(--accent-cnn); text-align: center;">
                                    <div class="metric-label" style="text-align:center;">VRAM Required</div>
                                    <div class="metric-value" style="font-size: 2rem; text-align:center;">${data.gpu_memory_gb.toFixed(1)} GB</div>
                                    <p class="text-xs text-muted mt-1" style="text-align:center;">Model params + activations</p>
                                </div>
                                <div class="metric-card" style="border-left: 4px solid var(--accent-unet); text-align: center;">
                                    <div class="metric-label" style="text-align:center;">Training Hours</div>
                                    <div class="metric-value" style="font-size: 2rem; text-align:center;">${data.training_hours.toFixed(2)} h</div>
                                    <p class="text-xs text-muted mt-1" style="text-align:center;">Total epoch time</p>
                                </div>
                                <div class="metric-card" style="border-left: 4px solid var(--accent-transformer); text-align: center;">
                                    <div class="metric-label" style="text-align:center;">Cost / Hour</div>
                                    <div class="metric-value" style="font-size: 2rem; text-align:center;">$${data.gpu_profile ? data.gpu_profile.cost_per_hour.toFixed(2) : '—'}</div>
                                    <p class="text-xs text-muted mt-1" style="text-align:center;">Cloud rate used</p>
                                </div>
                            </div>

                            <!-- GPU Comparison Table -->
                            <div class="card" style="padding: 0; overflow: hidden;">
                                <div style="padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); display: flex; align-items: center; gap: 8px;">
                                    <i class="fa-solid fa-table" style="color: var(--accent-transformer);"></i>
                                    <h3 class="font-heading" style="font-size: 1rem; margin: 0;">GPU Comparison — All Hardware</h3>
                                    <span style="font-size: 0.72rem; color: var(--color-text-secondary); margin-left: 4px;">Green = fits VRAM &bull; Red = insufficient VRAM &bull; Star = selected</span>
                                </div>
                                <div style="overflow-x: auto;">
                                    <table style="width: 100%; border-collapse: collapse; font-size: 0.83rem;">
                                        <thead>
                                            <tr style="background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08);">
                                                <th style="padding: 10px 12px; text-align: left; font-weight: 600; color: var(--color-text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;">GPU</th>
                                                <th style="padding: 10px 12px; text-align: center; font-weight: 600; color: var(--color-text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;">VRAM</th>
                                                <th style="padding: 10px 12px; text-align: center; font-weight: 600; color: var(--color-text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;">Hours</th>
                                                <th style="padding: 10px 12px; text-align: center; font-weight: 600; color: var(--color-text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;">Cost</th>
                                                <th style="padding: 10px 12px; text-align: center; font-weight: 600; color: var(--color-text-secondary); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;">Fits</th>
                                            </tr>
                                        </thead>
                                        <tbody>${tableRows}</tbody>
                                    </table>
                                </div>
                            </div>

                            <!-- Bar Chart -->
                            <div class="card">
                                <h3 class="font-heading" style="font-size: 1rem; margin: 0 0 14px;"><i class="fa-solid fa-chart-bar" style="color: var(--accent-transformer); margin-right: 6px;"></i>Cost Comparison Chart</h3>
                                <canvas id="gpu-comparison-chart" height="220"></canvas>
                            </div>

                            <!-- Scaling Insight -->
                            <div style="background: rgba(251, 191, 36, 0.06); border: 1px solid rgba(251, 191, 36, 0.2); border-radius: 10px; padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start;">
                                <i class="fa-solid fa-lightbulb" style="color: #fbbf24; font-size: 1.1rem; margin-top: 2px; flex-shrink: 0;"></i>
                                <div>
                                    <div style="font-weight: 700; font-size: 0.88rem; color: #fde68a; margin-bottom: 3px;">Scaling Insight</div>
                                    <div style="font-size: 0.83rem; color: var(--color-text-secondary); line-height: 1.5;">
                                        Doubling the dataset doubles training time and cost. Doubling batch size halves the number of steps but may require a proportional learning-rate increase (linear scaling rule). Switching from FP32 to FP16/BF16 typically halves VRAM usage and increases throughput 1.5–2x on Tensor Core GPUs.
                                    </div>
                                </div>
                            </div>

                            <!-- Educational Explanation -->
                            <div class="card" style="border-top: 4px solid var(--accent-cnn);">
                                <h3 class="font-heading" style="font-size: 1rem; margin: 0 0 12px;"><i class="fa-solid fa-graduation-cap" style="color: var(--accent-cnn); margin-right: 6px;"></i>Why Memory and Compute Scale This Way</h3>
                                <div style="font-size: 0.83rem; color: var(--color-text-secondary); line-height: 1.65; display: flex; flex-direction: column; gap: 10px;">
                                    <p><strong style="color: var(--color-text-primary);">VRAM footprint</strong> is determined by model parameters (4 bytes each in FP32, 2 bytes in FP16), optimizer state (Adam stores 2 extra copies per parameter), and activations retained during the forward pass for use in the backward pass. Larger batch sizes increase activation memory linearly. Gradient checkpointing trades recomputation for memory by discarding and recomputing activations on the backward pass, reducing memory O(sqrt(L)) for L layers.</p>
                                    <p><strong style="color: var(--color-text-primary);">Compute (FLOPs)</strong> per step scales with architecture depth and width. Convolutions scale as O(k^2 &middot; C_in &middot; C_out &middot; H &middot; W) per layer. Attention in Transformers scales as O(n^2 &middot; d) with sequence length — quadratic, which is why long sequences are expensive. The backward pass is roughly 2x the cost of the forward pass.</p>
                                    <p><strong style="color: var(--color-text-primary);">Effective GPU utilization</strong> rarely exceeds 40–55% of peak TFLOPS due to memory bandwidth bottlenecks, kernel launch overhead, and pipeline bubbles. Larger batch sizes and mixed precision both improve arithmetic intensity and push utilization higher.</p>
                                </div>
                                <div style="background: var(--bg-panel); border-radius: 8px; padding: 12px; font-size: 0.8rem; margin-top: 14px; color: var(--color-text-secondary); line-height: 1.5;">
                                    <strong>Profile used:</strong>
                                    Architecture FLOPs: <code>${formatNumber(archFlops)}</code> &bull;
                                    Parameters: <code>${formatNumber(archParams)}</code> &bull;
                                    GPU TFLOPS: <code>${data.gpu_profile ? data.gpu_profile.tflops : '—'}</code> &bull;
                                    Efficiency: <code>45%</code> &bull;
                                    Rate: <code>$${data.gpu_profile ? data.gpu_profile.cost_per_hour.toFixed(2) : '—'}/hr</code>
                                </div>
                                <p class="text-xs text-muted" style="margin-top: 10px;"><i class="fa-solid fa-circle-info"></i> All estimates are planning figures based on published scaling laws — actual cloud bills will vary.</p>
                            </div>
                        </div>
                    `;

                    // Render Chart.js bar chart
                    const ctx = document.getElementById('gpu-comparison-chart');
                    if (ctx && window.Chart) {
                        new Chart(ctx, {
                            type: 'bar',
                            data: {
                                labels: chartLabels,
                                datasets: [{
                                    label: 'Total Cost (USD)',
                                    data: chartCosts,
                                    backgroundColor: chartColors,
                                    borderColor: chartColors.map(c => c.replace('0.75', '1').replace('0.55', '0.9')),
                                    borderWidth: 1,
                                    borderRadius: 5
                                }]
                            },
                            options: {
                                responsive: true,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        callbacks: {
                                            label: ctx => ` $${ctx.parsed.y.toFixed(2)}`
                                        }
                                    }
                                },
                                scales: {
                                    x: {
                                        ticks: { color: '#94a3b8', font: { size: 11 } },
                                        grid: { color: 'rgba(255,255,255,0.05)' }
                                    },
                                    y: {
                                        ticks: {
                                            color: '#94a3b8',
                                            font: { size: 11 },
                                            callback: v => '$' + v
                                        },
                                        grid: { color: 'rgba(255,255,255,0.05)' }
                                    }
                                }
                            }
                        });
                    }

                } catch (e) {
                    resultsContainer.innerHTML = `<div class="card"><p class="text-danger"><i class="fa-solid fa-triangle-exclamation"></i> Failed to estimate: ${e.message}</p></div>`;
                }
            };
        }

        async function renderReproductionPage(params) {
            const paperId = params.id;
            navActions.innerHTML = `<a href="#/papers/${paperId}" class="btn btn-primary"><i class="fa-solid fa-arrow-left"></i> Paper Overview</a>`;
            appContainer.innerHTML = `<div class="spinner"></div>`;

            try {
                const response = await fetch(`/api/reproduction/${paperId}`);
                if (!response.ok) throw new Error('Reproduction card not found');
                const data = await response.json();
                const card = data.reproduction_card;

                let failuresHtml = '';
                (card.common_failure_modes || []).forEach(f => {
                    failuresHtml += `
                        <div class="card" style="border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.02); display: flex; flex-direction: column; gap: var(--space-2);">
                            <h4 style="color: #fca5a5; font-size: 1.05rem; margin: 0;"><i class="fa-solid fa-triangle-exclamation"></i> ${f.failure_mode}</h4>
                            <p class="text-sm text-muted" style="margin: 0;"><strong>Symptom:</strong> ${f.symptom}</p>
                            <div style="background: var(--bg-panel); border-radius: 6px; padding: var(--space-2); margin-top: 4px; font-family: var(--font-mono); font-size: 0.85rem; color: #a7f3d0; line-height: 1.4;">
                                <strong>Recommended Fix:</strong> ${f.fix}
                            </div>
                        </div>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="page-view" style="max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;">
                        <div class="text-center">
                            <span class="badge badge-unet mb-2">Reproduction Mode</span>
                            <h1 class="hero-title mb-2" style="font-size: 2.5rem;">${data.paper_title} Reproduction Card</h1>
                            <p class="text-muted">Crucial guidelines and expected results for validating this model in practice.</p>
                        </div>

                        <div class="grid-cols-2 gap-4" style="grid-template-columns: 1.5fr 1fr;">
                            <div class="card" style="border-top: 4px solid var(--accent-transformer); display: flex; flex-direction: column; gap: var(--space-3);">
                                <h3 class="font-heading text-lg"><i class="fa-solid fa-file-invoice"></i> Paper Summary</h3>
                                <p class="text-sm text-muted" style="line-height: 1.6;">${card.paper_summary}</p>
                            </div>
                            <div class="card" style="border-top: 4px solid var(--accent-cnn); display: flex; flex-direction: column; gap: var(--space-3);">
                                <h3 class="font-heading text-lg"><i class="fa-solid fa-chart-line"></i> Expected Results</h3>
                                <p class="text-sm text-muted" style="line-height: 1.6;">${card.expected_results}</p>
                            </div>
                        </div>

                        <div class="grid-cols-2 gap-4" style="grid-template-columns: 1fr 1fr;">
                            <div class="card">
                                <h3 class="font-heading text-lg mb-3"><i class="fa-solid fa-gears"></i> Training Setup Overview</h3>
                                <p class="text-sm text-muted" style="line-height: 1.6;">${card.training_config}</p>
                            </div>
                            <div class="card">
                                <h3 class="font-heading text-lg mb-3"><i class="fa-solid fa-triangle-exclamation"></i> Known Limitations</h3>
                                <p class="text-sm text-muted" style="line-height: 1.6;">${card.known_limitations}</p>
                            </div>
                        </div>

                        <div>
                            <h3 class="font-heading text-xl mb-4"><i class="fa-solid fa-circle-exclamation" style="color: #ef4444;"></i> Failure Modes & Fixes</h3>
                            <div style="display: flex; flex-direction: column; gap: var(--space-3);">
                                ${failuresHtml}
                            </div>
                        </div>
                    </div>

        function deltaBadge(value, unit = '', isFlops = false) {
            if (value === 0 || value === undefined) return `<span style="color:var(--color-text-secondary)">±0${unit}</span>`;
            const pos = value > 0;
            const color = isFlops ? (pos ? '#ef4444' : '#10b981') : (pos ? '#f59e0b' : '#10b981');
            const arrow = pos ? '▲' : '▼';
            return `<span style="color:${color};font-weight:600">${arrow} ${pos?'+':''}${typeof value==='number'&&!Number.isInteger(value)?value.toFixed(1):value}${unit}</span>`;
        }
        function pctBadge(pct) {
            if (!pct && pct !== 0) return '';
            const pos = pct > 0;
            const color = pos ? '#f59e0b' : '#10b981';
            return `<span style="font-size:0.75rem;color:${color}">(${pos?'+':''}${pct.toFixed(1)}%)</span>`;
        }

        // Score ring SVG
        function scoreRing(score) {
            const pct = Math.round(score * 100);
            const r = 32, circ = 2 * Math.PI * r;
            const dash = circ * score;
            const color = score >= 0.7 ? '#10b981' : score >= 0.4 ? '#f59e0b' : '#ef4444';
            return `<svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--color-border)" stroke-width="8"/>
                <circle cx="40" cy="40" r="${r}" fill="none" stroke="${color}" stroke-width="8"
                    stroke-dasharray="${dash.toFixed(1)} ${circ.toFixed(1)}"
                    stroke-dashoffset="${circ / 4}" stroke-linecap="round" transform="rotate(-90 40 40)"/>
                <text x="40" y="45" text-anchor="middle" fill="${color}" font-size="16" font-weight="700">${pct}%</text>
            </svg>`;
        }

                        <h4 style="margin:0;font-family:var(--font-heading);font-size:1rem;color:#fde68a">Training Loss Stagnates</h4>

                        </div>
                        <div>
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:5px">Likely Causes</div>
                          <ul style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;padding-left:14px;line-height:1.7">
                            <li>Learning rate too low</li>
                            <li>Dead neurons (ReLU saturation)</li>
                            <li>Poor data normalization</li>
                          </ul>
                        </div>
                        <div style="background:rgba(245,158,11,0.06);border-radius:8px;padding:10px">
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#f59e0b;margin-bottom:5px">Fix</div>
                          <p style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;line-height:1.5">Use LR finder. Check BatchNorm layers. Replace dead ReLUs with Leaky ReLU or GELU.</p>
                        </div>
                      </div>
                    </div>

                    <!-- 3. Overfitting -->
                    <div class="lab-panel" style="border-left:4px solid #f97316;padding:16px 20px">

                        <div style="background:rgba(249,115,22,0.12);color:#f97316;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0"><i class="fa-solid fa-chart-line"></i></div>
                        <h4 style="margin:0;font-family:var(--font-heading);font-size:1rem;color:#fdba74">Overfitting</h4>
                      </div>
                      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
                        <div>
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:5px">Symptoms</div>
                          <p style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;line-height:1.5">Training loss low and falling; validation loss diverges upward.</p>
                        </div>
                        <div>
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:5px">Likely Causes</div>
                          <ul style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;padding-left:14px;line-height:1.7">
                            <li>Insufficient regularization</li>
                            <li>Model too large for dataset</li>
                            <li>Too few training samples</li>
                          </ul>
                        </div>
                        <div style="background:rgba(249,115,22,0.06);border-radius:8px;padding:10px">
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#f97316;margin-bottom:5px">Fix</div>
                          <p style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;line-height:1.5">Add Dropout, weight decay (L2). Apply data augmentation. Use early stopping.</p>
                        </div>
                      </div>
                    </div>

                    <!-- 4. Underfitting -->
                    <div class="lab-panel" style="border-left:4px solid #3b82f6;padding:16px 20px">
                      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                        <div style="background:rgba(59,130,246,0.12);color:#3b82f6;width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0"><i class="fa-solid fa-arrow-trend-down"></i></div>
                        <h4 style="margin:0;font-family:var(--font-heading);font-size:1rem;color:#93c5fd">Underfitting</h4>
                      </div>
                      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
                        <div>
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:5px">Symptoms</div>
                          <p style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;line-height:1.5">Both training and validation losses remain high throughout training.</p>
                        </div>
                        <div>
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--color-text-secondary);margin-bottom:5px">Likely Causes</div>
                          <ul style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;padding-left:14px;line-height:1.7">
                            <li>Learning rate too low</li>
                            <li>Model capacity too small</li>
                            <li>Insufficient training epochs</li>
                          </ul>
                        </div>
                        <div style="background:rgba(59,130,246,0.06);border-radius:8px;padding:10px">
                          <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#3b82f6;margin-bottom:5px">Fix</div>
                          <p style="font-size:0.82rem;color:var(--color-text-secondary);margin:0;line-height:1.5">Increase model capacity (more layers/width). Train for more epochs. Use a higher LR with warmup.</p>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>

            </div>`;

            // Init
            labLoadMutationList();
            labLoadBaseGraph();
            labUpdateNotebookBadge();
        }

        async function labLoadMutationList() {
            try {
                const res = await fetch('/api/lab/mutations');
                const data = await res.json();
                const mutations = data.mutations;
                const catColors = { depth:'cat-depth', width:'cat-width', structure:'cat-structure', attention:'cat-attention', embedding:'cat-embedding' };
                let html = '';
                Object.entries(mutations).forEach(([key, m]) => {
                    html += `<button class="mutation-btn" id="mutbtn-${key}" onclick="labToggleMutation('${key}')">
                        <div class="mutation-icon ${catColors[m.category]||'cat-depth'}"><i class="fa-solid ${m.icon}"></i></div>
                        <div style="flex:1">
                            <div style="font-size:0.875rem;font-weight:600">${m.label}</div>
                            <div style="font-size:0.75rem;color:var(--color-text-secondary)">${m.description}</div>
                        </div>
                    </button>`;
                });
                document.getElementById('lab-mutation-list').innerHTML = html;
            } catch(e) {
                document.getElementById('lab-mutation-list').innerHTML = `<div class="text-muted text-sm">Failed to load mutations: ${e.message}</div>`;
            }
        }

        async function labLoadBaseGraph() {
            try {
                const res = await fetch('/api/lab/mutate', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({ architecture: labCurrentArch, mutations: [] })
                });
                const data = await res.json();
                labLastResult = data;
                renderGraph('lab-graph-before', data.before.graph);
                renderGraph('lab-graph-after', data.before.graph, null, 'default');
                labRenderMetricsTable(data.before.metrics, data.before.metrics);
            } catch(e) {}
        }

        function labSetArch(arch, el) {
            labCurrentArch = arch;
            document.querySelectorAll('.arch-pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            labClearMutations();
            labLoadBaseGraph();
            // Reload tradeoff chart if on that tab
            if (document.getElementById('lab-tab-tradeoff').style.display !== 'none') {
                labLoadTradeoffChart();
            }
        }

        function labToggleMutation(key) {
            const btn = document.getElementById(`mutbtn-${key}`);
            const idx = labActiveMutations.findIndex(m => m.type === key);
            if (idx >= 0) {
                labActiveMutations.splice(idx, 1);
                btn.classList.remove('active');
            } else {
                // Some mutations need params
                let params = {};
                if (key === 'increase_depth') params = { n: 1 };
                else if (key === 'decrease_depth') params = { n: 1 };
                else if (key === 'increase_width') params = { factor: 1.5 };
                else if (key === 'decrease_width') params = { factor: 0.5 };
                else if (key === 'change_patch_size') params = { patch_size: 8 };
                else if (key === 'change_hidden_dim') params = { dim: 1024 };
                labActiveMutations.push({ type: key, params });
                btn.classList.add('active');
            }
            labUpdateActiveMutList();
        }

        function labUpdateActiveMutList() {
            const el = document.getElementById('active-mut-list');
            const cnt = document.getElementById('active-mut-count');
            cnt.textContent = labActiveMutations.length;
            if (labActiveMutations.length === 0) {
                el.textContent = 'None selected';
                return;
            }
            el.innerHTML = labActiveMutations.map(m =>
                `<div style="display:inline-flex;align-items:center;gap:4px;background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.2);border-radius:6px;padding:3px 10px;margin:2px;font-size:0.8rem">
                    <i class="fa-solid fa-dna" style="color:var(--accent-transformer)"></i> ${m.type.replace(/_/g,' ')}
                </div>`
            ).join('');
        }

        function labClearMutations() {
            labActiveMutations = [];
            document.querySelectorAll('.mutation-btn').forEach(b => b.classList.remove('active'));
            labUpdateActiveMutList();
            document.getElementById('lab-diff-panel').style.display = 'none';
        }

        async function labRunMutation() {
            const btn = document.getElementById('lab-run-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Running...';

            try {
                const res = await fetch('/api/lab/mutate', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ architecture: labCurrentArch, mutations: labActiveMutations })
                });
                if (!res.ok) throw new Error(await res.text());
                const data = await res.json();
                labLastResult = data;

                // Render graphs
                renderGraph('lab-graph-before', data.before.graph);
                renderGraph('lab-graph-after', data.after.graph, null, 'default');

                // Render metrics table
                labRenderMetricsTable(data.before.metrics, data.after.metrics);

                // Render diff
                labRenderDiff(data.diff);
                document.getElementById('lab-diff-panel').style.display = 'block';

            } catch(e) {
                document.getElementById('lab-diff-panel').style.display = 'block';
                document.getElementById('lab-diff-content').innerHTML = `<div class="text-sm" style="color:#ef4444">Error: ${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Run Experiment';
            }
        }

        function labRenderMetricsTable(before, after) {
            const el = document.getElementById('lab-metrics-table');
            if (!el) return;
            const rows = [
                { label: 'Parameters', b: formatNumber(before.params), a: formatNumber(after.params), delta: after.params - before.params, unit: '' },
                { label: 'FLOPs Score', b: before.flops_score, a: after.flops_score, delta: after.flops_score - before.flops_score, unit: '', isFlops: true },
                { label: 'Depth (nodes)', b: before.depth, a: after.depth, delta: after.depth - before.depth, unit: '' },
                { label: 'Memory', b: before.memory_mb + ' MB', a: after.memory_mb + ' MB', delta: after.memory_mb - before.memory_mb, unit: ' MB', isFlops: true },
            ];
            el.innerHTML = rows.map(r => `
                <div class="diff-row">
                    <div class="diff-label">${r.label}</div>
                    <div style="display:flex;align-items:center;gap:12px;font-size:0.875rem">
                        <span style="color:var(--color-text-secondary)">${r.b}</span>
                        <i class="fa-solid fa-arrow-right" style="font-size:0.7rem;color:var(--color-text-secondary)"></i>
                        <span style="font-weight:600">${r.a}</span>
                        ${deltaBadge(r.delta, r.unit, r.isFlops)}
                    </div>
                </div>`).join('');
        }

        function labRenderDiff(diff) {
            const el = document.getElementById('lab-diff-content');
            if (!el) return;
            const pd = diff.param_delta || {};
            const fd = diff.flops_delta || {};
            const dd = diff.depth_delta || {};
            const sd = diff.skip_delta || {};
            const md = diff.memory_delta || {};

            let nodesHtml = '';
            if (diff.nodes_added?.length) nodesHtml += diff.nodes_added.map(n => `<span style="background:rgba(16,185,129,0.15);color:#34d399;border-radius:5px;padding:2px 8px;font-size:0.75rem;margin:2px">+${n}</span>`).join('');
            if (diff.nodes_removed?.length) nodesHtml += diff.nodes_removed.map(n => `<span style="background:rgba(239,68,68,0.15);color:#f87171;border-radius:5px;padding:2px 8px;font-size:0.75rem;margin:2px">−${n}</span>`).join('');

            el.innerHTML = `
                <div style="background:var(--bg-body);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:0.8rem;color:var(--color-text-secondary);line-height:1.5">
                    ${diff.summary_text}
                </div>
                ${nodesHtml ? `<div style="margin-bottom:10px;display:flex;flex-wrap:wrap;gap:4px">${nodesHtml}</div>` : ''}
                <div>
                    <div class="diff-row"><div class="diff-label">Parameters</div><div>${deltaBadge(pd.absolute, '')} ${pctBadge(pd.pct)}</div></div>
                    <div class="diff-row"><div class="diff-label">FLOPs Score</div><div>${deltaBadge(fd.absolute, '', true)}</div></div>
                    <div class="diff-row"><div class="diff-label">Depth (nodes)</div><div>${deltaBadge(dd.absolute, ' nodes')}</div></div>
                    <div class="diff-row"><div class="diff-label">Skip Connections</div><div>${deltaBadge(sd.absolute, '')}</div></div>
                    <div class="diff-row"><div class="diff-label">Memory</div><div>${deltaBadge(md.absolute_mb, ' MB', true)} ${pctBadge(md.pct)}</div></div>
                </div>`;
        }

        function labSaveToNotebook() {
            if (!labLastResult) return;
            const entry = {
                id: Math.random().toString(36).slice(2,9),
                architecture: labCurrentArch,
                mutations: labActiveMutations.map(m => m.type).join(' + ') || 'baseline',
                diff_summary: labLastResult.diff?.summary_text || '',
                before_metrics: labLastResult.before?.metrics,
                after_metrics: labLastResult.after?.metrics,
                param_delta_pct: labLastResult.diff?.param_delta?.pct || 0,
                flops_delta: labLastResult.diff?.flops_delta?.absolute || 0,
            };
            labNotebookAdd(entry);
            labUpdateNotebookBadge();
            // Show toast
            const toast = document.createElement('div');
            toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--accent-transformer);color:white;padding:10px 18px;border-radius:10px;font-size:0.875rem;z-index:9999;animation:fadeIn 0.3s';
            toast.innerHTML = '<i class="fa-solid fa-check"></i> Saved to Notebook';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function labUpdateNotebookBadge() {
            const badge = document.getElementById('notebook-count-badge');
            if (badge) badge.textContent = labNotebookLoad().length;
        }

        function labClearNotebook() {
            labNotebookSave([]);
            labUpdateNotebookBadge();
            labRenderNotebook();
        }

        function labRenderNotebook() {
            const el = document.getElementById('lab-notebook-content');
            if (!el) return;
            const entries = labNotebookLoad();
            if (entries.length === 0) {
                el.innerHTML = `<div style="text-align:center;padding:40px;color:var(--color-text-secondary)">
                    <i class="fa-solid fa-book-open" style="font-size:2rem;opacity:0.3;display:block;margin-bottom:12px"></i>
                    No experiments saved yet.</div>`;
                return;
            }
            el.innerHTML = entries.map((e, i) => {
                const paramDir = e.param_delta_pct > 0.5 ? '▲' : e.param_delta_pct < -0.5 ? '▼' : '→';
                const flopsDir = e.flops_delta > 0 ? '▲' : e.flops_delta < 0 ? '▼' : '→';
                const paramColor = e.param_delta_pct > 0 ? '#f59e0b' : '#10b981';
                const flopsColor = e.flops_delta > 0 ? '#ef4444' : '#10b981';
                return `<div class="notebook-entry">
                    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:8px">
                        <div>
                            <div style="font-weight:600;font-size:0.9rem">${e.architecture} — ${e.mutations}</div>
                            <div style="font-size:0.75rem;color:var(--color-text-secondary)">${new Date(e.saved_at).toLocaleString()}</div>
                        </div>
                        <button onclick="labDeleteNotebookEntry(${i})" style="background:none;border:none;color:var(--color-text-secondary);cursor:pointer;font-size:0.8rem"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div style="font-size:0.8rem;color:var(--color-text-secondary);margin-bottom:8px">${e.diff_summary || 'No diff summary'}</div>
                    <div style="display:flex;gap:16px;font-size:0.8rem">
                        <span>Params: <span style="color:${paramColor};font-weight:600">${paramDir} ${e.param_delta_pct > 0 ? '+' : ''}${(e.param_delta_pct||0).toFixed(1)}%</span></span>
                        <span>FLOPs: <span style="color:${flopsColor};font-weight:600">${flopsDir} ${e.flops_delta > 0 ? '+' : ''}${e.flops_delta||0}</span></span>
                    </div>
                    ${e.prediction_score !== undefined && e.prediction_score !== null ? `<div style="margin-top:8px;font-size:0.8rem">Score: <span class="${e.prediction_score >= 0.7 ? 'score-excellent' : e.prediction_score >= 0.4 ? 'score-good' : 'score-poor'}">${Math.round(e.prediction_score*100)}%</span></div>` : ''}
                </div>`;
            }).join('');
        }

        function labDeleteNotebookEntry(idx) {
            const entries = labNotebookLoad();
            entries.splice(idx, 1);
            labNotebookSave(entries);
            labUpdateNotebookBadge();
            labRenderNotebook();
        }

        // --- Predict Tab ---
        let labPredictSelections = { param: null, flops: null };
        let labCurrentPrompt = null;

        async function labLoadPredictPrompt() {
            const mutType = document.getElementById('predict-mutation-select')?.value || 'increase_depth';
            try {
                const res = await fetch(`/api/lab/prediction-prompt?mutation_type=${mutType}&architecture=${labCurrentArch}`);
                const data = await res.json();
                labCurrentPrompt = data;
                document.getElementById('predict-question-text').textContent = data.question;
                const hintsEl = document.getElementById('predict-hints');
                if (hintsEl) {
                    hintsEl.innerHTML = (data.hints || []).map(h =>
                        `<span style="background:var(--bg-body);border:1px solid var(--color-border);border-radius:6px;padding:3px 10px;font-size:0.75rem;color:var(--color-text-secondary)">${h}</span>`
                    ).join('');
                }
            } catch(e) {}
            // Reset selections
            labPredictSelections = { param: null, flops: null };
            document.querySelectorAll('.predict-choice').forEach(b => b.classList.remove('selected'));
            document.getElementById('predict-result-panel').style.display = 'none';
        }

        function labSelectPrediction(dimension, value) {
            labPredictSelections[dimension] = value;
            const prefix = `pred-${dimension}-`;
            ['increase','no_change','decrease'].forEach(v => {
                const el = document.getElementById(`${prefix}${v}`);
                if (el) el.classList.toggle('selected', v === value);
            });
        }

        async function labSubmitPrediction() {
            if (!labPredictSelections.param || !labPredictSelections.flops) {
                alert('Please select your prediction for both Parameters and FLOPs before submitting.');
                return;
            }
            const mutType = document.getElementById('predict-mutation-select')?.value || 'increase_depth';
            const reasoning = document.getElementById('predict-reasoning-input')?.value || '';

            const hypothesis = {
                predicted_param_direction: labPredictSelections.param,
                predicted_flops_direction: labPredictSelections.flops,
                prediction: reasoning,
                mutation_type: mutType,
            };

            try {
                const res = await fetch('/api/lab/predict', {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({
                        architecture: labCurrentArch,
                        mutations: [{ type: mutType, params: _defaultParamsFor(mutType) }],
                        hypothesis,
                    })
                });
                const data = await res.json();
                const s = data.scoring;
                const scoreColor = s.score >= 0.7 ? '#10b981' : s.score >= 0.4 ? '#f59e0b' : '#ef4444';

                document.getElementById('predict-result-panel').style.display = 'block';
                document.getElementById('predict-result-content').innerHTML = `
                    <div style="display:flex;align-items:center;gap:20px;margin-bottom:16px">
                        ${scoreRing(s.score)}
                        <div>
                            <div style="font-size:1.4rem;font-weight:700;color:${scoreColor}">${s.score >= 0.7 ? 'Excellent!' : s.score >= 0.4 ? 'Good effort' : 'Keep learning!'}</div>
                            <div style="font-size:0.875rem;color:var(--color-text-secondary)">Score: ${Math.round(s.score*100)} / 100</div>
                        </div>
                    </div>
                    <div style="background:var(--bg-body);border-radius:8px;padding:12px;font-size:0.875rem;line-height:1.6;margin-bottom:14px">${s.feedback}</div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
                        <div style="background:var(--bg-panel);border-radius:8px;padding:10px">
                            <div style="font-size:0.7rem;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:4px">Param Direction</div>
                            <div style="font-weight:600">${s.param_correct ? '✓' : '✗'} Actual: <span style="color:var(--accent-transformer)">${s.actual_param_direction}</span></div>
                        </div>
                        <div style="background:var(--bg-panel);border-radius:8px;padding:10px">
                            <div style="font-size:0.7rem;text-transform:uppercase;color:var(--color-text-secondary);margin-bottom:4px">FLOPs Direction</div>
                            <div style="font-weight:600">${s.flops_correct ? '✓' : '✗'} Actual: <span style="color:var(--accent-transformer)">${s.actual_flops_direction}</span></div>
                        </div>
                    </div>
                    <div style="font-size:0.8rem;color:var(--color-text-secondary);margin-bottom:10px">Actual diff: ${data.diff?.summary_text || ''}</div>
                    <button onclick="labSavePredictionToNotebook(${s.score}, '${mutType}')" class="btn btn-outline" style="font-size:0.8rem">
                        <i class="fa-solid fa-save"></i> Save to Notebook
                    </button>`;

                // Save to notebook
                labSavePredictionToNotebook(s.score, mutType, data.diff, hypothesis);
            } catch(e) {
                document.getElementById('predict-result-panel').style.display = 'block';
                document.getElementById('predict-result-content').innerHTML = `<div style="color:#ef4444">Error: ${e.message}</div>`;
            }
        }

        function _defaultParamsFor(mutType) {
            const defaults = {
                increase_depth: { n: 1 }, decrease_depth: { n: 1 },
                increase_width: { factor: 1.5 }, decrease_width: { factor: 0.5 },
                change_patch_size: { patch_size: 8 }, change_hidden_dim: { dim: 1024 },
            };
            return defaults[mutType] || {};
        }

        function labSavePredictionToNotebook(score, mutType, diff, hypothesis) {
            const entry = {
                id: Math.random().toString(36).slice(2,9),
                architecture: labCurrentArch,
                mutations: mutType.replace(/_/g,' '),
                diff_summary: diff?.summary_text || '',
                param_delta_pct: diff?.param_delta?.pct || 0,
                flops_delta: diff?.flops_delta?.absolute || 0,
                prediction_score: score,
                hypothesis_text: hypothesis?.prediction || '',
            };
            labNotebookAdd(entry);
            labUpdateNotebookBadge();
        }

        // --- Tradeoff Tab ---
        async function labLoadTradeoffChart() {
            const canvas = document.getElementById('lab-tradeoff-chart');
            if (!canvas) return;

            try {
                const res = await fetch(`/api/lab/tradeoffs?architecture=${encodeURIComponent(labCurrentArch)}`);
                const data = await res.json();
                const points = data.scatter_points || [];

                // Group by category for coloring
                const groupColors = {
                    baseline:  { bg: 'rgba(139,92,246,0.9)',  border: '#8b5cf6' },
                    depth:     { bg: 'rgba(59,130,246,0.75)', border: '#3b82f6' },
                    width:     { bg: 'rgba(16,185,129,0.75)', border: '#10b981' },
                    structure: { bg: 'rgba(245,158,11,0.75)', border: '#f59e0b' },
                    attention: { bg: 'rgba(236,72,153,0.75)', border: '#ec4899' },
                };

                const datasets = [];
                const groups = [...new Set(points.map(p => p.group))];
                groups.forEach(grp => {
                    const grpPoints = points.filter(p => p.group === grp);
                    const colors = groupColors[grp] || { bg: 'rgba(107,114,128,0.75)', border: '#6b7280' };
                    datasets.push({
                        label: grp.charAt(0).toUpperCase() + grp.slice(1),
                        data: grpPoints.map(p => ({
                            x: p.flops_score,
                            y: p.params,
                            r: Math.max(5, Math.min(25, (p.memory_mb || 1) * 0.4 + 5)),
                            label: p.label,
                            isFrontier: p.is_frontier,
                            memory_mb: p.memory_mb,
                            depth: p.depth,
                        })),
                        backgroundColor: grpPoints.map(p => p.is_frontier ? 'rgba(139,92,246,0.9)' : colors.bg),
                        borderColor: grpPoints.map(p => p.is_frontier ? '#a78bfa' : colors.border),
                        borderWidth: grpPoints.map(p => p.is_frontier ? 3 : 1.5),
                    });
                });

                if (labTradeoffChart) { labTradeoffChart.destroy(); labTradeoffChart = null; }

                if (typeof Chart !== 'undefined') {
                    labTradeoffChart = new Chart(canvas, {
                        type: 'bubble',
                        data: { datasets },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: true, position: 'top', labels: { color: '#9ca3af', font: { size: 11 }, boxWidth: 12 } },
                                tooltip: {
                                    callbacks: {
                                        label: (ctx) => {
                                            const d = ctx.raw;
                                            return [
                                                `${d.label}${d.isFrontier ? ' ★' : ''}`,
                                                `FLOPs Score: ${d.x}`,
                                                `Params: ${formatNumber(d.y)}`,
                                                `Memory: ${d.memory_mb} MB`,
                                                `Depth: ${d.depth} nodes`,
                                            ];
                                        }
                                    }
                                }
                            },
                            scales: {
                                x: { title: { display: true, text: 'FLOPs Score (compute)', color: '#9ca3af' }, ticks: { color: '#9ca3af' }, grid: { color: 'rgba(75,85,99,0.3)' } },
                                y: { title: { display: true, text: 'Parameter Count', color: '#9ca3af' }, ticks: { color: '#9ca3af', callback: v => formatNumber(v) }, grid: { color: 'rgba(75,85,99,0.3)' } },
                            },
                            onClick: (evt, elements) => {
                                if (!elements.length) return;
                                const el = elements[0];
                                const d = datasets[el.datasetIndex].data[el.index];
                                document.getElementById('tradeoff-selected-info').innerHTML = `
                                    <div style="font-weight:600;margin-bottom:6px">${d.label}${d.isFrontier ? ' <span style="color:#a78bfa">★ Frontier</span>' : ''}</div>
                                    <div class="diff-row"><div class="diff-label">FLOPs Score</div><div>${d.x}</div></div>
                                    <div class="diff-row"><div class="diff-label">Parameters</div><div>${formatNumber(d.y)}</div></div>
                                    <div class="diff-row"><div class="diff-label">Memory</div><div>${d.memory_mb} MB</div></div>
                                    <div class="diff-row"><div class="diff-label">Depth</div><div>${d.depth} nodes</div></div>`;
                            }
                        }
                    });

                    // Legend
                    const legendEl = document.getElementById('tradeoff-legend');
                    if (legendEl) {
                        legendEl.innerHTML = Object.entries(groupColors).map(([grp, c]) =>
                            `<div class="tradeoff-legend-item"><div class="tradeoff-legend-dot" style="background:${c.bg}"></div>${grp}</div>`
                        ).join('') + `<div class="tradeoff-legend-item"><div class="tradeoff-legend-dot" style="background:#a78bfa;border:2px solid #8b5cf6"></div>★ Pareto Frontier</div>`;
                    }

                    // Load tradeoff summaries
                    labAllTradeoffSummaries = data.tradeoff_summaries || {};
                    labLoadTradeoffSummary();
                }
            } catch(e) {
                if (canvas) canvas.parentElement.innerHTML = `<div style="color:#ef4444;padding:16px">Failed to load tradeoff data: ${e.message}</div>`;
            }
        }

        let labAllTradeoffSummaries = {};
        function labLoadTradeoffSummary() {
            const select = document.getElementById('tradeoff-summary-select');
            const el = document.getElementById('tradeoff-summary-content');
            if (!select || !el) return;
            const key = select.value;
            const s = labAllTradeoffSummaries[key];
            if (!s) { el.innerHTML = '<div class="text-muted text-sm">Loading...</div>'; return; }

            const scoreMap = { 'very high': 5, 'high': 4, 'medium': 3, 'low': 2, 'minimal': 1, 'low': 1 };
            function pill(val) {
                const level = (val||'').toLowerCase();
                let color = '#6b7280';
                if (level.includes('very high') || level.includes('excellent')) color = '#ef4444';
                else if (level.includes('high')) color = '#f59e0b';
                else if (level.includes('medium') || level.includes('moderate')) color = '#3b82f6';
                else if (level.includes('low') || level.includes('minimal') || level.includes('stable') || level.includes('fast') || level.includes('same')) color = '#10b981';
                return `<span style="background:${color}22;color:${color};border-radius:6px;padding:2px 8px;font-size:0.75rem;font-weight:600">${val}</span>`;
            }

            el.innerHTML = `
                <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
                    <div class="diff-row"><div class="diff-label">Compute</div><div>${pill(s.compute)}</div></div>
                    <div class="diff-row"><div class="diff-label">Memory</div><div>${pill(s.memory)}</div></div>
                    <div class="diff-row"><div class="diff-label">Expressivity</div><div>${pill(s.expressivity)}</div></div>
                    <div class="diff-row"><div class="diff-label">Inference Speed</div><div>${pill(s.inference_speed)}</div></div>
                    <div class="diff-row"><div class="diff-label">Training Stability</div><div>${pill(s.training_stability)}</div></div>
                </div>
                <div style="background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.2);border-radius:8px;padding:10px;font-size:0.8rem;line-height:1.5;color:var(--color-text-secondary)">
                    <i class="fa-solid fa-lightbulb" style="color:var(--accent-transformer);margin-right:4px"></i> ${s.recommendation}
                </div>`;
        }

        // --- Tab switcher ---
        function labSwitchTab(tab) {
            ['mutate','predict','tradeoff','notebook','failure'].forEach(t => {
                const tabDiv = document.getElementById(`lab-tab-${t}`);
                const tabBtn = document.getElementById(`tab-${t}`);
                if (tabDiv) tabDiv.style.display = t === tab ? '' : 'none';
                if (tabBtn) tabBtn.classList.toggle('active', t === tab);
            });
            if (tab === 'notebook') labRenderNotebook();
            if (tab === 'predict') labLoadPredictPrompt();
            if (tab === 'tradeoff') labLoadTradeoffChart();
            if (tab === 'failure') labRenderFailureArchTip();
        }

        function labRenderFailureArchTip() {
            const el = document.getElementById('failure-arch-tip-text');
            if (!el) return;
            const tips = {
                'ResNet': 'ResNet skip connections help stabilize gradients, but very deep ResNets (>50 layers) can still explode if LR is too high at the start. Use warmup with cosine decay and ensure residual branches are zero-initialized.',
                'Transformer': 'Transformers are sensitive to learning rate schedules. Use the "Attention is All You Need" warmup formula: LR scales as d_model^(-0.5) * min(step^(-0.5), step * warmup_steps^(-1.5)). Layer normalization placement (pre-norm vs. post-norm) significantly affects training stability.',
                'U-Net': 'U-Net skip connections can cause gradient imbalance between encoder and decoder. If the decoder loss dominates, consider separate LR groups. Ensure proper padding so skip-connection concatenations match spatially.',
                'DenseNet': 'DenseNet concatenates all previous feature maps, so memory usage grows quadratically with depth. Monitor GPU memory closely. Transition layers are critical — removing them causes memory explosions.',
                'ViT': 'Vision Transformers are notoriously data-hungry. Without sufficient data or augmentation (RandAugment, Mixup), ViTs overfit drastically. Patch embedding init matters — use large-kernel Conv2d equivalents for stability.',
            };
            el.textContent = tips[labCurrentArch] || `For ${labCurrentArch}: Monitor gradient norms at each layer during the first 100 steps. Use gradient clipping with max_norm=1.0 and start with a conservative LR with linear warmup over 5% of total steps.`;
        }

        // --- Lab tutor integration ---
        function labOpenTutor() {
            const ctx = {
                architecture: labCurrentArch,
                mutations_applied: labActiveMutations,
                diff: labLastResult?.diff || {},
                user_hypothesis: '',
            };
            openTutor('lab', ctx);
        }

        // --- Router ---
        function parseRoute(hash) {
            const hashParts = hash.split('?');
            const path = hashParts[0].slice(1) || '/';
            const queryStr = hashParts[1] || '';
            const query = {};
            queryStr.split('&').forEach(p => { const [k,v] = p.split('='); if(k) query[k]=v; });

            if (path === '/upload') return { handler: renderUploadPage, params: {}, query };
            if (path === '/playground') return { handler: renderPlaygroundPage, params: {}, query };
            if (path === '/compare') return { handler: renderComparePage, params: {}, query };
            if (path === '/assessment') return { handler: renderAssessmentPage, params: {}, query };
            if (path === '/dashboard') return { handler: renderDashboardPage, params: {}, query };
            if (path === '/lab') return { handler: renderLabPage, params: {}, query };
            if (path === '/training-estimator') return { handler: renderTrainingEstimatorPage, params: {}, query };
            if (path === '/hyperparameters') return { handler: renderHyperparametersPage, params: {}, query };
            if (path === '/dojo') return { handler: renderDojoPage, params: {}, query };
            const dojoMatch = path.match(/^\/dojo\/([a-z0-9_]+)$/);
            if (dojoMatch) return { handler: renderDojoPage, params: { id: dojoMatch[1] }, query };
            const implMatch = path.match(/^\/implementation\/(\d+)$/);
            if (implMatch) return { handler: renderImplementationPage, params: { id: implMatch[1] }, query };
            const trainingMatch = path.match(/^\/training\/(\d+)$/);
            if (trainingMatch) return { handler: renderTrainingPage, params: { id: trainingMatch[1] }, query };
            const reproMatch = path.match(/^\/reproduction\/(\d+)$/);
            if (reproMatch) return { handler: renderReproductionPage, params: { id: reproMatch[1] }, query };
            const explorerMatch = path.match(/^\/explorer\/(\d+)$/);
            if (explorerMatch) return { handler: renderExplorerPage, params: { id: explorerMatch[1] }, query };
            const journeyMatch = path.match(/^\/papers\/(\d+)\/journey$/);
            if (journeyMatch) return { handler: renderJourneyPage, params: { id: journeyMatch[1] }, query };
            const moduleMatch = path.match(/^\/papers\/(\d+)\/modules\/(\d+)$/);
            if (moduleMatch) return { handler: renderModulePage, params: { paper_id: moduleMatch[1], module_id: moduleMatch[2] }, query };
            const paperMatch = path.match(/^\/papers\/(\d+)$/);
            if (paperMatch) return { handler: renderOverviewPage, params: { id: paperMatch[1] }, query };
            return { handler: renderLibraryPage, params: {}, query };
        }

        // ============================================================
        // Phase 13 — App shell: theme, per-route accent, motion helpers
        // ============================================================
        const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const icon = document.querySelector('#theme-toggle i');
            if (icon) icon.className = theme === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        function toggleTheme() {
            const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            localStorage.setItem('theme', next);
            applyTheme(next);
        }
        (function initTheme() {
            let t = localStorage.getItem('theme');
            if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
            applyTheme(t);
        })();

        // Per-route accent: tints nav indicator, headers, glows.
        const ROUTE_ACCENT = {
            '#/dojo': ['var(--accent-transformer)', '139, 92, 246'],
            '#/hyperparameters': ['var(--accent-cnn)', '16, 185, 129'],
            '#/training-estimator': ['var(--accent-unet)', '6, 182, 212'],
            '#/assessment': ['var(--accent-transformer)', '139, 92, 246'],
            '#/lab': ['var(--accent-cnn)', '16, 185, 129'],
            '#/dashboard': ['var(--accent-unet)', '6, 182, 212'],
        };
        function applyRouteAccent(hash) {
            let accent = ['var(--accent-transformer)', '139, 92, 246'];
            for (const key in ROUTE_ACCENT) { if (hash.startsWith(key)) { accent = ROUTE_ACCENT[key]; break; } }
            if (hash.startsWith('#/explorer') || hash.startsWith('#/papers')) accent = ['var(--accent-transformer)', '139, 92, 246'];
            document.documentElement.style.setProperty('--page-accent', accent[0]);
            document.documentElement.style.setProperty('--page-accent-rgb', accent[1]);
        }

        // Staggered reveal for any .reveal element. Reveals immediately with a
        // small per-element stagger — NOT scroll-gated, so below-the-fold content
        // is never left invisible (a .reveal that never gets .in stays opacity:0).
        function observeReveals() {
            const els = document.querySelectorAll('.reveal:not(.in)');
            els.forEach((el, i) => {
                if (!prefersReducedMotion) el.style.animationDelay = Math.min(i * 45, 360) + 'ms';
                el.classList.add('in');
            });
        }

        // Count-up for numeric metrics. Element opts in via class "count-up" + data-to.
        function animateNumber(el, to, opts = {}) {
            if (prefersReducedMotion) { el.textContent = (opts.prefix||'') + to + (opts.suffix||''); return; }
            const dur = opts.duration || 800, start = performance.now(), from = opts.from || 0;
            const dec = opts.decimals != null ? opts.decimals : (Number.isInteger(to) ? 0 : 1);
            function frame(now) {
                const p = Math.min(1, (now - start) / dur);
                const eased = 1 - Math.pow(1 - p, 3);
                const val = from + (to - from) * eased;
                el.textContent = (opts.prefix||'') + val.toFixed(dec) + (opts.suffix||'');
                if (p < 1) requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        }
        function runCountUps() {
            document.querySelectorAll('.count-up[data-to]').forEach(el => {
                if (el.dataset.done) return; el.dataset.done = '1';
                animateNumber(el, parseFloat(el.dataset.to), {
                    prefix: el.dataset.prefix || '', suffix: el.dataset.suffix || '',
                    decimals: el.dataset.decimals != null ? parseInt(el.dataset.decimals) : null
                });
            });
        }

        // Button ripple (event delegation).
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.btn');
            if (!btn || prefersReducedMotion) return;
            const r = btn.getBoundingClientRect();
            const span = document.createElement('span');
            span.className = 'ripple';
            const size = Math.max(r.width, r.height);
            span.style.width = span.style.height = size + 'px';
            span.style.left = (e.clientX - r.left - size / 2) + 'px';
            span.style.top = (e.clientY - r.top - size / 2) + 'px';
            btn.appendChild(span);
            setTimeout(() => span.remove(), 600);
        });

        // Hook the app container so post-render passes run automatically.
        function afterRender() {
            const app = document.getElementById('app-container');
            if (app && !prefersReducedMotion) { app.classList.remove('route-fade'); void app.offsetWidth; app.classList.add('route-fade'); }
        }

        // Render functions are async (content lands after fetches). A childList
        // observer on the container fires once per innerHTML swap — wiring up
        // reveals + count-ups automatically without per-page calls. childList
        // (not subtree) avoids re-firing on count-up text mutations.
        (function watchAppContainer() {
            const app = document.getElementById('app-container');
            if (!app || typeof MutationObserver === 'undefined') return;
            let t = null;
            new MutationObserver(() => {
                clearTimeout(t);
                t = setTimeout(() => { observeReveals(); runCountUps(); }, 50);
            }).observe(app, { childList: true });
        })();

        function router() {
            const hashFull = window.location.hash;
            applyRouteAccent(hashFull.split('?')[0]);
            const { handler, params, query } = parseRoute(hashFull);
            if (handler) handler(params, query);

            // Highlight active nav links
            const hash = hashFull.split('?')[0];
            document.querySelectorAll('.nav-link').forEach(link => {
                if (link.getAttribute('href') === hash) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
            afterRender();
        }

        window.addEventListener('hashchange', router);
        // Run immediately — DOM is ready since this script is at the end of <body>
        router();
    </script>
    <script src="/static/playground.js"></script>
</body>
</html>
