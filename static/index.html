<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper2Code - Interactive Architecture Experience</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,300,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Display (techy, characterful) + Mono (code & data) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cytoscape, Chart.js & Monaco Editor loaded async to prevent blocking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.js" defer></script>
    
    <!-- Paper2Code Design System -->
    <link rel="stylesheet" href="/static/design.css">

    <style>
        /* Ambient Glow Blobs */
        .ambient-glow {
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: var(--accent-transformer);
            filter: blur(150px);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }
        .glow-top-right {
            top: -20vh;
            right: -10vw;
        }
        .glow-bottom-left {
            bottom: -20vh;
            left: -10vw;
            background: var(--accent-unet);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .logo-icon {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent-transformer), var(--accent-unet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: -0.03em;
        }

        .logo-text span {
            color: var(--accent-transformer);
        }

        /* Helpers */
        .text-muted { color: var(--color-text-secondary); }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .font-semibold { font-weight: 600; }
        .mb-2 { margin-bottom: var(--space-2); }
        .mb-4 { margin-bottom: var(--space-4); }
        .mt-4 { margin-top: var(--space-4); }
        .mt-8 { margin-top: var(--space-8); }
        .gap-2 { gap: var(--space-2); }
        .gap-4 { gap: var(--space-4); }
        .opacity-70 { opacity: 0.7; }
        
        .grid-cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
        .grid-cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }

        /* Loader */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-border);
            border-top-color: var(--accent-transformer);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: var(--space-12) auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Page Transition */
        .page-view {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Timeline Redesign */
        .timeline-content {
            background: var(--bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: var(--space-4);
            transition: all var(--transition-base);
        }
        .timeline-item:hover .timeline-content {
            border-color: var(--color-border-subtle);
            background: var(--bg-panel);
            transform: translateX(4px);
        }

        /* Sidebar Nav */
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2);
            border-radius: 8px;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            transition: all var(--transition-base);
            margin-bottom: 2px;
        }
        .sidebar-link:hover {
            background: var(--bg-panel);
            color: var(--color-text-primary);
        }
        .sidebar-link.active {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-transformer);
            font-weight: 500;
        }

        /* Nav Links */
        .nav-link {
            color: var(--color-text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color var(--transition-base);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-link:hover {
            color: var(--color-text-primary);
        }
        .nav-link.active {
            color: var(--page-accent);
            font-weight: 600;
        }

        /* Quick Facts / Metric Cards */
        .metric-card {
            background: var(--bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: var(--space-3);
        }
        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-1);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .metric-value {
            font-family: var(--font-display);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            font-variant-numeric: tabular-nums;
        }

        
        /* Tutor Panel */
        .tutor-panel { position: fixed; top: 0; right: clamp(-440px, -90vw, -320px); width: clamp(320px, 90vw, 420px); height: 100vh; background: var(--glass-bg); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-left: 1px solid var(--glass-border); box-shadow: -8px 0 40px rgba(0,0,0,0.35); z-index: var(--z-modal); display: flex; flex-direction: column; transition: right 0.34s var(--ease-out), opacity 0.34s var(--ease-out); opacity: 0; }
        .tutor-panel.open { right: 0; opacity: 1; }
        @supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) { .tutor-panel { background: var(--bg-surface); } }
        .tutor-header { padding: var(--space-4); border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
        .tutor-chat { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
        .tutor-msg { padding: var(--space-3); border-radius: 8px; font-size: 0.9rem; line-height: 1.5; max-width: 90%; }
        .tutor-msg.user { background: var(--bg-panel); align-self: flex-end; }
        .tutor-msg.bot { background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.2); align-self: flex-start; }
        .tutor-msg-meta { font-size: 0.7rem; color: var(--color-text-secondary); margin-top: 4px; border-top: 1px solid var(--color-border); padding-top: 4px; }
        .tutor-input-area { padding: var(--space-4); border-top: 1px solid var(--color-border); display: flex; gap: var(--space-2); }
        .tutor-input-area input { flex: 1; padding: var(--space-2); border-radius: 6px; border: 1px solid var(--color-border); background: var(--bg-body); color: white; }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .grid-cols-3 { grid-template-columns: 1fr; }
            .grid-cols-2 { grid-template-columns: 1fr; }
            .hero-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="aurora-bg" aria-hidden="true"><div class="aurora-blob"></div></div>

    <header class="header-nav">
        <div class="container flex justify-between items-center">
            <a href="#/" class="logo-group">
                <div class="logo-icon"><i class="fa-solid fa-microchip"></i></div>
                <div class="logo-text">Paper2<span>Code</span></div>
            </a>
            <div style="display: flex; align-items: center; gap: var(--space-4);">
                <a href="#/dojo" class="nav-link" id="nav-dojo"><i class="fa-solid fa-code"></i> Code Dojo</a>
                <a href="#/training-estimator" class="nav-link"><i class="fa-solid fa-calculator"></i> Cost Estimator</a>
                <a href="#/hyperparameters" class="nav-link"><i class="fa-solid fa-gauge-high"></i> Hyperparameters</a>
                <a href="#/assessment" class="nav-link"><i class="fa-solid fa-graduation-cap"></i> Assessments</a>
                <a href="#/lab" class="nav-link" id="nav-lab"><i class="fa-solid fa-flask-vial"></i> Research Lab</a>
                <a href="#/dashboard" class="nav-link"><i class="fa-solid fa-chart-simple"></i> Dashboard</a>
                <button class="theme-toggle" id="theme-toggle" title="Toggle light / dark" aria-label="Toggle light or dark theme" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <div id="nav-actions"></div>
            </div>
        </div>
    </header>

    <main class="container" id="app-container"></main>
    <div id="cy-tooltip" class="cy-tooltip"></div>

    <!-- Tutor Panel -->
    <div id="tutor-panel" class="tutor-panel">
        <div class="tutor-header">
            <h3><i class="fa-solid fa-robot" style="color: var(--accent-transformer)"></i> Architecture Tutor</h3>
            <button onclick="closeTutor()" class="btn btn-secondary btn-sm"><i class="fa-solid fa-times"></i></button>
        </div>
        <div id="tutor-chat" class="tutor-chat"></div>
        <div class="tutor-input-area">
            <input type="text" id="tutor-input" placeholder="Ask about this context..." onkeypress="if(event.key === 'Enter') sendTutorMessage()">
            <button onclick="sendTutorMessage()" class="btn btn-primary"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>


    <script>
        
        // Ensure browser-local learner_id is set
        if (!localStorage.learner_id) {
            localStorage.learner_id = crypto.randomUUID();
        }

        // Global fetch wrapper to inject X-Learner-ID header.
        // IMPORTANT: only attach the header to our OWN same-origin requests.
        // Adding a custom header to cross-origin requests (e.g. the Pyodide
        // wasm binary on a CDN) forces a CORS preflight the CDN rejects,
        // which breaks in-browser Python in the Code Dojo.
        const originalFetch = window.fetch;
        window.fetch = function(url, options = {}) {
            try {
                const target = (url && typeof url === 'object' && 'url' in url) ? url.url : url;
                const u = new URL(target, window.location.href);
                if (u.origin !== window.location.origin) {
                    return originalFetch(url, options);
                }
            } catch (e) {
                return originalFetch(url, options);
            }
            options.headers = options.headers || {};
            if (options.headers instanceof Headers) {
                options.headers.set('X-Learner-ID', localStorage.learner_id);
            } else if (Array.isArray(options.headers)) {
                options.headers.push(['X-Learner-ID', localStorage.learner_id]);
            } else {
                options.headers['X-Learner-ID'] = localStorage.learner_id;
            }
            return originalFetch(url, options);
        };

        // Tutor Logic
        let tutorSessionId = "session_" + Math.random().toString(36).substr(2, 9);
        let tutorCurrentContext = {};
        let tutorContextType = "none";

        function openTutor(contextType, contextData) {
            tutorContextType = contextType;
            tutorCurrentContext = contextData;
            document.getElementById("tutor-panel").classList.add("open");
            const chat = document.getElementById("tutor-chat");
            if(chat.children.length === 0) {
                appendTutorMessage("bot", "Hello! I am your AI Architecture Tutor. I have context on the current " + contextType + ". What would you like to know?");
            }
        }
        function closeTutor() { document.getElementById("tutor-panel").classList.remove("open"); }
        function appendTutorMessage(role, text, meta = null) {
            const chat = document.getElementById("tutor-chat");
            const div = document.createElement("div");
            div.className = `tutor-msg ${role}`;
            let htmlText = text.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
            div.innerHTML = htmlText;
            if (meta) {
                div.innerHTML += `<div class="tutor-msg-meta">
                    <div><i class="fa-solid fa-bullseye"></i> ${meta.source_context}</div>
                    <div><i class="fa-solid fa-brain"></i> ${meta.reasoning_type} (${meta.confidence})</div>
                </div>`;
            }
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        async function sendTutorMessage() {
            const input = document.getElementById("tutor-input");
            const text = input.value.trim();
            if(!text) return;
            input.value = "";
            appendTutorMessage("user", text);
            const typingId = "typing_" + Date.now();
            const typingDiv = document.createElement("div");
            typingDiv.id = typingId; typingDiv.className = "tutor-msg bot text-muted";
            typingDiv.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Thinking...';
            document.getElementById("tutor-chat").appendChild(typingDiv);
            document.getElementById("tutor-chat").scrollTop = document.getElementById("tutor-chat").scrollHeight;

            try {
                const res = await fetch("/api/tutor/ask", {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ session_id: tutorSessionId, context_type: tutorContextType, context_data: tutorCurrentContext, query: text })
                });
                const data = await res.json();
                document.getElementById(typingId).remove();
                appendTutorMessage("bot", data.answer, data);
            } catch(e) {
                document.getElementById(typingId).remove();
                appendTutorMessage("bot", "Error connecting to tutor.");
            }
        }

        async function loadLearningPath() {
            appContainer.innerHTML = `<div class="text-center mt-8"><div class="spinner"></div><p>Generating Learning Path...</p></div>`;
            navActions.innerHTML = '';
            
            try {
                const res = await fetch("/api/tutor/learning-path");
                const data = await res.json();
                
                let pathHtml = `<div class="page-view"><h1 class="hero-title mb-4">Architecture Learning Path</h1><p class="text-muted mb-8">A deterministic sequence for learning deep learning architectures.</p><div style="display: flex; flex-direction: column; gap: var(--space-4);">`;
                
                data.learning_path.forEach((level, index) => {
                    pathHtml += `
                        <div class="metric-card" style="border-left: 4px solid var(--accent-transformer)">
                            <h3>Step ${index + 1}: ${level.level}</h3>
                            <p class="text-muted mb-4">${level.focus}</p>
                            <div style="display: flex; gap: var(--space-2); flex-wrap: wrap;">
                                ${level.papers.map(p => `<span class="badge" style="background: var(--bg-panel); padding: 4px 12px; border-radius: 16px;">${p}</span>`).join("")}
                            </div>
                        </div>
                    `;
                });
                
                pathHtml += `</div></div>`;
                appContainer.innerHTML = pathHtml;
            } catch(e) {
                appContainer.innerHTML = `<div class="text-danger">Failed to load learning path: ${e.message}</div>`;
            }
        }

        const appContainer = document.getElementById('app-container');
        const navActions = document.getElementById('nav-actions');

        window.generateQuiz = async function() {
            const qc = document.getElementById("quiz-container");
            qc.innerHTML = '<div class="spinner"></div>';
            try {
                const res = await fetch("/api/tutor/quiz", {
                    method: "POST", headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({ module_data: { layer_name: currentModuleData.layer_name, module_type: currentModuleData.module_type, explanation: currentModuleData.explanation, paper_title: currentModuleData.paper_title } })
                });
                const data = await res.json();
                let qHtml = '<div style="display: flex; flex-direction: column; gap: var(--space-4);">';
                data.questions.forEach((q, i) => {
                    qHtml += `<div class="metric-card">
                        <div class="font-semibold mb-2">Q${i+1}: ${q.question}</div>
                        <details><summary class="text-muted" style="cursor: pointer;">Show Answer</summary><div class="mt-2 text-sm">${q.answer}</div></details>
                    </div>`;
                });
                qHtml += '</div>';
                qc.innerHTML = qHtml;
            } catch(e) {
                qc.innerHTML = `<div class="text-danger">Failed to load quiz.</div>`;
            }
        };

let currentModuleData = {};


        const compareKnowledge = {
            cnn: {
                dna: ['Convolution Driven', 'Residual Learning', 'Hierarchical Features'],
                advantages: ['Highly efficient on grids', 'Translation invariance', 'Proven for vision'],
                limitations: ['Limited long-range context', 'Fixed receptive field'],
                useCases: 'Image Classification, Object Detection, Image Segmentation'
            },
            transformer: {
                dna: ['Attention Driven', 'Global Context', 'Token Interactions'],
                advantages: ['Global receptive field', 'Highly scalable', 'Domain agnostic'],
                limitations: ['Compute expensive (O(N²))', 'Data hungry', 'Lacks spatial inductive bias'],
                useCases: 'Natural Language Processing, Vision Transformers (ViT), Multimodal'
            },
            unet: {
                dna: ['Encoder-Decoder', 'Skip Connections', 'Spatial Recovery'],
                advantages: ['Preserves high-resolution details', 'Works well with limited data'],
                limitations: ['High memory usage for feature maps', 'Complex training dynamics'],
                useCases: 'Medical Image Segmentation, Image Restoration, Diffusion Models'
            }
        };

        const interviewQuestions = [
            { q: "How do you implement a Residual Connection in PyTorch?", a: "By storing the input tensor x, passing x through the layers, and then adding it back before the final activation: out = self.layers(x) + x; return self.relu(out)." },
            { q: "Why is Self-Attention computationally expensive?", a: "The Q*K^T operation scales quadratically O(N^2) with the sequence length (N). In PyTorch, this is typically handled by nn.MultiheadAttention or scaled dot-product attention." },
            { q: "How are Skip Connections implemented in U-Net?", a: "The encoder saves intermediate feature maps at each spatial resolution. During the decoder phase, these saved tensors are concatenated to the upsampled tensors: torch.cat([upsampled_x, saved_x], dim=1)." },
            { q: "What does nn.Conv2d(kernel_size=3, padding=1) do?", a: "It applies a 3x3 convolution filter and adds 1 pixel of zero-padding on all sides, which perfectly preserves the spatial dimensions of the input tensor." }
        ];

        window.toggleFlashcard = function(el) {
            el.classList.toggle('revealed');
        };

        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(0) + 'K';
            return num.toString();
        }

        function getArchClass(type) {
            const t = type.toLowerCase();
            if (t.includes('cnn') || t.includes('resnet')) return 'cnn';
            if (t.includes('attention') || t.includes('transformer')) return 'transformer';
            return 'unet';
        }

        function getArchColor(typeClass) {
            if(typeClass === 'cnn') return '#10B981';
            if(typeClass === 'transformer') return '#8B5CF6';
            return '#06B6D4';
        }

        function getArchIcon(type) {
            const t = type.toLowerCase();
            if (t.includes('attention') || t.includes('transformer')) return 'fa-brain';
            if (t.includes('cnn')) return 'fa-layer-group';
            if (t.includes('encoder-decoder')) return 'fa-shuffle';
            return 'fa-network-wired';
        }

        // --- Phase 3: Client-Side Code Generator ---
        function nodeToPyTorch(node) {
            const p = node.params || {};
            const ch = p.channels || p.filters || 64;
            const k = p.kernel_size || 3;
            // Best-effort extraction of input hidden size for linear layers
            let in_hs = 512;
            if (node.input_shape && node.input_shape.length) {
                const last = node.input_shape[node.input_shape.length - 1];
                if (typeof last === 'number') in_hs = last;
            }
            const out_hs = p.hidden_size || 512;
            const heads = p.num_heads || p.heads || 8;

            const t = node.type.toLowerCase();
            
            // Map types to nn.* constructors (Matches backend codegen.py exactly)
            const map = {
                "conv2d": `nn.Conv2d(${ch}, ${ch}, kernel_size=${k}, padding=${Math.floor(k/2)})`,
                "conv1d": `nn.Conv1d(${ch}, ${ch}, kernel_size=${k}, padding=${Math.floor(k/2)})`,
                "linear": `nn.Linear(${in_hs}, ${out_hs})`,
                "relu": "nn.ReLU(inplace=True)",
                "gelu": "nn.GELU()",
                "sigmoid": "nn.Sigmoid()",
                "maxpool2d": "nn.MaxPool2d(kernel_size=2, stride=2)",
                "avgpool2d": "nn.AvgPool2d(kernel_size=2, stride=2)",
                "batchnorm2d": `nn.BatchNorm2d(${ch})`,
                "batchnorm1d": `nn.BatchNorm1d(${ch})`,
                "layernorm": `nn.LayerNorm(${in_hs})`,
                "dropout": "nn.Dropout(p=0.1)",
                "transpose": "lambda x: x.transpose(1, 2)",
                "upsample": "nn.Upsample(scale_factor=2, mode='bilinear', align_corners=False)",
                "multiheadattention": `nn.MultiheadAttention(embed_dim=${in_hs}, num_heads=${heads}, batch_first=True)`,
                "transformerblock": `nn.TransformerEncoderLayer(d_model=${in_hs}, nhead=${heads}, batch_first=True)`,
                "patchembedding": `ViTPatchEmbed(3, ${p.embed_dim || 768}, ${p.patch_size || 16})`,
                "sequence_pooling": "lambda x: x.mean(dim=1)"
            };

            return map[t] || `# Custom block implementation needed for ${node.type}`;
        }

        function generateArchitectureSkeleton(graph) {
            if (!graph || !graph.nodes || graph.nodes.length === 0) return "# No nodes available to generate code.";
            
            const name = (graph.name || "CustomModel").replace(/[^A-Za-z0-9]/g, "");
            
            let lines = [
                "# NOTE: Skip connections not represented in this sequential skeleton",
                "import torch",
                "import torch.nn as nn",
                "",
                "class ViTPatchEmbed(nn.Module):",
                "    def __init__(self, in_channels, embed_dim, patch_size):",
                "        super().__init__()",
                "        self.proj = nn.Conv2d(in_channels, embed_dim, kernel_size=patch_size, stride=patch_size)",
                "    def forward(self, x):",
                "        return self.proj(x).flatten(2).transpose(1, 2)",
                "",
                `class ${name}(nn.Module):`,
                "    def __init__(self):",
                "        super().__init__()"
            ];
            
            let forwardCalls = [];
            
            graph.nodes.forEach(node => {
                const layerStr = nodeToPyTorch(node);
                if (layerStr && !layerStr.startsWith("#")) {
                    lines.push(`        self.${node.id} = ${layerStr}`);
                }
                forwardCalls.push(`        x = self.${node.id}(x)  # ${node.label}`);
            });
            
            lines.push("");
            lines.push("    def forward(self, x):");
            lines = lines.concat(forwardCalls);
            lines.push("        return x");
            lines.push("");
            
            return lines.join("\\n");
        }
        
        // Setup Monaco Editor lazy loader
        let monacoInstance = null;
        let monacoInitPromise = null;
        function initMonaco(containerId, initialCode, readOnly = true) {
            if (!monacoInitPromise) {
                monacoInitPromise = new Promise((resolve) => {
                    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs' }});
                    require(['vs/editor/editor.main'], function() {
                        resolve(monaco);
                    });
                });
            }
            
            return monacoInitPromise.then((monacoObj) => {
                const el = document.getElementById(containerId);
                if (!el) return null;
                el.innerHTML = '';
                const editor = monacoObj.editor.create(el, {
                    value: initialCode,
                    language: 'python',
                    theme: 'vs-dark',
                    readOnly: readOnly,
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    fontSize: 14,
                    lineHeight: 24,
                    padding: { top: 16, bottom: 16 },
                    renderLineHighlight: 'all',
                    automaticLayout: true
                });
                return editor;
            });
        }

        function downloadCode(filename, code) {
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Cytoscape Renderer Helper
        function renderGraph(containerId, graphData, currentNodes = null, mode = 'default') {
            const container = document.getElementById(containerId);
            if (!container || !graphData || !graphData.nodes) return;
            if (typeof cytoscape === 'undefined') { container.innerHTML = '<div class="text-sm text-muted" style="padding:16px;text-align:center;">Graph loading...</div>'; return; }
            
            const elements = { nodes: [], edges: [] };
            
            graphData.nodes.forEach(n => {
                const isTarget = currentNodes && currentNodes.some(cn => cn.node_id === n.id);
                let bgColor = '#374151'; // default
                let bgOpacity = 1;
                
                if (mode === 'compute') {
                    const nameLower = n.label ? n.label.toLowerCase() : '';
                    if (nameLower.includes('conv') || nameLower.includes('attention')) bgColor = '#EF4444'; // Red
                    else if (nameLower.includes('fc') || nameLower.includes('linear')) bgColor = '#F59E0B'; // Yellow
                    else bgColor = '#10B981'; // Green
                } else if (mode === 'memory') {
                    const nameLower = n.label ? n.label.toLowerCase() : '';
                    if (nameLower.includes('pool') || nameLower.includes('embed') || nameLower.includes('attention')) bgColor = '#EF4444'; 
                    else if (nameLower.includes('norm')) bgColor = '#F59E0B';
                    else bgColor = '#10B981';
                } else if (currentNodes) {
                    bgColor = isTarget ? '#8B5CF6' : '#374151';
                    bgOpacity = isTarget ? 1 : 0.4;
                }

                elements.nodes.push({
                    data: { id: n.id, label: n.label || n.id, type: n.type },
                    style: { 'background-color': bgColor, 'opacity': bgOpacity }
                });
            });

            graphData.edges.forEach(e => {
                const classes = e.type === 'skip' ? 'skip-edge' : '';
                elements.edges.push({
                    data: { id: e.source + '-' + e.target, source: e.source, target: e.target, type: e.type },
                    classes: classes
                });
            });

            const cy = cytoscape({
                container: container,
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(label)',
                            'color': '#F9FAFB',
                            'font-size': '10px',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'width': 60,
                            'height': 30,
                            'shape': 'round-rectangle',
                            'border-width': 1,
                            'border-color': '#111827',
                            'text-outline-color': '#000',
                            'text-outline-width': 1
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#4B5563',
                            'target-arrow-color': '#4B5563',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier'
                        }
                    },
                    {
                        selector: '.skip-edge',
                        style: {
                            'line-style': 'dashed',
                            'line-color': '#8B5CF6',
                            'target-arrow-color': '#8B5CF6'
                        }
                    }
                ],
                layout: {
                    name: 'breadthfirst',
                    directed: true,
                    padding: 30,
                    spacingFactor: 1.2
                },
                userZoomingEnabled: true,
                userPanningEnabled: true
            });

            const tooltip = document.getElementById('cy-tooltip');
            cy.on('mouseover', 'node', function(e) {
                const node = e.target;
                tooltip.innerHTML = `<strong>${node.data('label')}</strong><br/><span style="color:var(--color-text-secondary)">Type: ${node.data('type') || 'Layer'}</span>`;
                tooltip.style.display = 'block';
                tooltip.style.left = e.originalEvent.pageX + 10 + 'px';
                tooltip.style.top = e.originalEvent.pageY + 10 + 'px';
            });
            cy.on('mouseout', 'node', function() {
                tooltip.style.display = 'none';
            });
            
            // Phase 3: Node <-> Code Sync
            cy.on('tap', 'node', function(e) {
                const nodeId = e.target.id();
                if (window.currentModuleNodesMap && window.currentModuleNodesMap[nodeId] && window.currentEditorInstance) {
                    const line = window.currentModuleNodesMap[nodeId];
                    window.currentEditorInstance.revealLineInCenter(line);
                    window.currentEditorInstance.setPosition({ lineNumber: line, column: 1 });
                    window.currentEditorInstance.focus();
                }
            });
            
            return cy;
        }

                const meta = paper.metadata;
                const modules = modulesData.modules || [];
                const graph = paper.architecture_graph || { nodes: [], edges: [] };

                // Group modules into stages
                const stages = [];
                if (modules.length > 0) {
                    const stageSize = Math.ceil(modules.length / 4);
                    for (let i = 0; i < modules.length; i += stageSize) {
                        const stageModules = modules.slice(i, i + stageSize);
                        stages.push({
                            index: stages.length,
                            name: stageModules[0].layer_name || `Stage ${stages.length + 1}`,
                            modules: stageModules,
                            startIdx: i,
                            endIdx: Math.min(i + stageSize, modules.length)
                        });
                    }
                } else {
                    stages.push({
                        index: 0,
                        name: "Architecture",
                        modules: [],
                        startIdx: 0,
                        endIdx: 0
                    });
                }

                // Build stage timeline
                let timelineHtml = '<div style="display: flex; align-items: center; gap: 16px; margin-bottom: 32px; overflow-x: auto; padding: 16px 0;">';
                stages.forEach((stage, idx) => {
                    timelineHtml += `
                        <div class="stage-timeline-item ${idx === 0 ? 'active' : ''}" onclick="selectStage(${idx})" style="
                            padding: 12px 16px;
                            background: ${idx === 0 ? 'rgba(139, 92, 246, 0.2)' : 'var(--bg-panel)'};

                        ${idx < stages.length - 1 ? '<div style="color: var(--color-border);">→</div>' : ''}
                    `;
                });
                timelineHtml += '</div>';

                // Build tensor journey visualization
                let tensorJourneyHtml = '<div id="tensor-journey-container" style="margin-top: 24px;">';
                stages.forEach((stage, stageIdx) => {
                    tensorJourneyHtml += `<div class="tensor-journey-stage" id="tensor-journey-${stageIdx}" style="display: ${stageIdx === 0 ? 'block' : 'none'};">
                        <h3 class="mb-4 font-heading text-lg"><i class="fa-solid fa-water"></i> Tensor Journey: ${stage.name}</h3>
                        <p class="text-muted text-sm mb-6">Watch how tensor shapes transform through each module in this stage</p>

                        <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                            <button onclick="toggleTensorMath()" class="btn btn-outline btn-sm" style="font-size: 0.75rem;">
                                <i class="fa-solid fa-square-root-variable"></i> Show Math
                            </button>

                            </button>

                        <div style="overflow-x: auto; padding-bottom: 16px;">
                            <div style="display: flex; gap: 12px; min-width: min-content;">
                    `;

                    if (stage.modules.length > 0) {
                        // First module input
                        const firstMod = stage.modules[0];
                        const _fts = firstMod.tensor_summary || {};
                        const firstInput = Array.isArray(_fts.input_shape) ? _fts.input_shape :
                            (Array.isArray(_fts.trace) && _fts.trace.length > 0 && Array.isArray(_fts.trace[0].input_shape)
                                ? _fts.trace[0].input_shape : []);
                        const firstInputStr = firstInput.length > 0 ? '[' + firstInput.join(', ') + ']' : '?';

                        tensorJourneyHtml += `
                            <div class="tensor-step" style="min-width: 120px;">
                                <div class="tensor-step-label">Input</div>
                                <div class="tensor-step-shape">${firstInputStr}</div>
                                <div class="tensor-step-info text-xs text-muted">
                                    ${firstInput.length > 0 ? 'B=' + firstInput[0] + ', C=' + firstInput[1] : '—'}
                                </div>
                            </div>
                        `;

                        // Each module transformation
                        stage.modules.forEach((mod, modIdx) => {
                            const _mts = mod.tensor_summary || {};
                            const _mtr = Array.isArray(_mts.trace) ? _mts.trace : [];
                            const inputShape = Array.isArray(_mts.input_shape) ? _mts.input_shape :
                                (_mtr.length > 0 && Array.isArray(_mtr[0].input_shape) ? _mtr[0].input_shape : []);
                            const outputShape = Array.isArray(_mts.output_shape) ? _mts.output_shape :
                                (_mtr.length > 0 && Array.isArray(_mtr[_mtr.length-1].output_shape) ? _mtr[_mtr.length-1].output_shape : []);
                            const inputStr = inputShape.length > 0 ? '[' + inputShape.join(', ') + ']' : '?';
                            const outputStr = outputShape.length > 0 ? '[' + outputShape.join(', ') + ']' : '?';

                            const flops = mod.flops_context?.real_flops_mflops || 0;
                            const params = mod.flops_context?.total_params_estimate || 0;

                            `;
                        });

                        // Output
                        const lastMod = stage.modules[stage.modules.length - 1];
                        const _lts = lastMod.tensor_summary || {};
                        const _ltr = Array.isArray(_lts.trace) ? _lts.trace : [];
                        const lastOutput = Array.isArray(_lts.output_shape) ? _lts.output_shape :
                            (_ltr.length > 0 && Array.isArray(_ltr[_ltr.length-1].output_shape) ? _ltr[_ltr.length-1].output_shape : []);
                        const lastOutputStr = lastOutput.length > 0 ? '[' + lastOutput.join(', ') + ']' : '?';

                        tensorJourneyHtml += `
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <i class="fa-solid fa-arrow-right" style="color: var(--color-border); font-size: 0.85rem;"></i>

                                <div class="tensor-step" style="min-width: 120px;">
                                    <div class="tensor-step-label">Output</div>
                                    <div class="tensor-step-shape">${lastOutputStr}</div>
                                    <div class="tensor-step-info text-xs text-muted">
                                        ${lastOutput.length > 0 ? 'B=' + lastOutput[0] + ', C=' + lastOutput[1] : '—'}
                                    </div>
                                </div>
                            </div>
                        `;
                    }

                    tensorJourneyHtml += `
                            </div>
                        </div>
                    </div>
                    `;
                });
                tensorJourneyHtml += '</div>';

                // Build stage details panel
                let stageDetailsHtml = '<div id="stage-details" style="flex: 1;">';
                stages.forEach((stage, idx) => {
                    let totalFlops = 0;
                    let totalParams = 0;
                    let inputShape = "—";
                    let outputShape = "—";

                    if (stage.modules.length > 0) {
                        const firstMod = stage.modules[0];
                        const lastMod = stage.modules[stage.modules.length - 1];
                        totalFlops = stage.modules.reduce((sum, m) => sum + (m.flops_context?.real_flops_mflops || 0), 0);
                        totalParams = stage.modules.reduce((sum, m) => sum + (m.flops_context?.total_params_estimate || 0), 0);

                        if (firstMod.tensor_summary?.input_shape) {
                            inputShape = '[' + firstMod.tensor_summary.input_shape.join(', ') + ']';
                        }
                        if (lastMod.tensor_summary?.output_shape) {
                            outputShape = '[' + lastMod.tensor_summary.output_shape.join(', ') + ']';
                        }
                    }

                    let flopsDisplay = totalFlops >= 1000 ? (totalFlops/1000).toFixed(1) + 'G' : totalFlops.toFixed(1) + 'M';

                    let highestCostLayer = '—';
                    if (stage.modules.length > 0) {
                        const byFlops = [...stage.modules].sort((a, b) => (b.flops_context?.real_flops_mflops || 0) - (a.flops_context?.real_flops_mflops || 0));
                        highestCostLayer = byFlops[0].layer_name;
                    }

                    stageDetailsHtml += `
                        <div class="stage-detail-panel" id="stage-${idx}" style="display: ${idx === 0 ? 'block' : 'none'}; animation: fadeIn 0.3s ease-out;">
                            <div class="mb-6">
                                <h2 style="font-size: 1.75rem; margin-bottom: 8px;">${stage.name}</h2>
                                <p class="text-muted">Stage ${idx + 1} of ${stages.length}</p>
                            </div>

                            <div class="grid-cols-3 gap-4 mb-6">
                                <div class="metric-card">
                                    <div class="metric-label"><i class="fa-solid fa-microchip"></i> Modules</div>
                                    <div class="metric-value">${stage.modules.length}</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-label"><i class="fa-solid fa-bolt"></i> FLOPs</div>
                                    <div class="metric-value">${flopsDisplay}</div>
                                </div>
                                <div class="metric-card">
                                    <div class="metric-label"><i class="fa-solid fa-chart-line"></i> Parameters</div>
                                    <div class="metric-value">${formatNumber(totalParams)}</div>
                                </div>
                            </div>

                            <div class="card mb-6">
                                <h4 class="mb-3 font-heading text-sm uppercase text-muted"><i class="fa-solid fa-fire"></i> Stage Compute Summary</h4>
                                <div style="display: flex; flex-direction: column; gap: 10px; font-size: 0.875rem;">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span class="text-muted">Total FLOPs</span>
                                        <span style="font-weight: 600;">${flopsDisplay}FLOPs</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <span class="text-muted">Total Parameters</span>
                                        <span style="font-weight: 600;">${formatNumber(totalParams)}</span>
                                    </div>
                                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                                        <span class="text-muted">Highest Cost Layer</span>
                                        <span style="font-weight: 600; color: #EF4444; text-align: right; word-break: break-word; max-width: 55%;">${highestCostLayer}</span>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-6">
                                <h4 class="mb-4 font-heading text-sm uppercase text-muted"><i class="fa-solid fa-cube"></i> Tensor Journey</h4>
                                <div style="display: flex; align-items: center; gap: 12px;">
                                    <div class="tensor-box" style="flex: 1;">
                                        <div class="text-xs font-semibold opacity-70">Input</div>
                                        <div class="text-sm font-mono">${inputShape}</div>
                                    </div>
                                    <i class="fa-solid fa-arrow-right" style="color: var(--color-border);"></i>
                                    <div class="tensor-box" style="flex: 1;">
                                        <div class="text-xs font-semibold opacity-70">${stage.name}</div>
                                        <div class="badge" style="background: rgba(139, 92, 246, 0.1); color: var(--accent-transformer); font-size: 0.75rem;">Transform</div>
                                    </div>
                                    <i class="fa-solid fa-arrow-right" style="color: var(--color-border);"></i>
                                    <div class="tensor-box" style="flex: 1;">
                                        <div class="text-xs font-semibold opacity-70">Output</div>
                                        <div class="text-sm font-mono">${outputShape}</div>
                                    </div>
                                </div>
                            </div>

                            <div class="card">
                                <h4 class="mb-3 font-heading text-sm uppercase text-muted"><i class="fa-solid fa-layer-group"></i> Modules in This Stage</h4>
                                <div style="display: flex; flex-direction: column; gap: 8px;">
                                    ${stage.modules.map(m => `
                                        <div class="metric-card" style="border-left: 3px solid var(--accent-transformer); padding: 12px;">
                                            <div class="font-semibold text-sm">${m.layer_name}</div>
                                            <div class="text-xs text-muted mt-1">${m.module_type}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    `;
                });
                stageDetailsHtml += '</div>';

                // Render page
                appContainer.innerHTML = `
                    <div class="page-view" style="display: flex; flex-direction: column; gap: 24px;">
                        <div class="mb-8">
                            <span class="badge badge-transformer mb-4" style="background: rgba(139, 92, 246, 0.1); color: var(--accent-transformer);">
                                <i class="fa-solid fa-microchip"></i> ARCHITECTURE EXPLORER
                            </span>
                            <h1 style="font-size: 2.5rem; margin-bottom: 8px;">${meta.full_title || meta.title}</h1>
                            <p class="text-muted"><i class="fa-regular fa-user mr-2"></i> ${meta.authors || 'Original Authors'}</p>
                        </div>

                        <div style="background: var(--bg-panel); border-radius: 12px; padding: 16px; border: 1px solid var(--color-border);">
                            <h3 class="mb-2 font-heading text-sm uppercase text-muted">Stage Progression</h3>
                            ${timelineHtml}
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                            <div>
                                ${stageDetailsHtml}
                            </div>
                            <div class="card" style="padding: 0; display: flex; flex-direction: column;">
                                <div style="padding: 12px 16px; border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
                                    <h3 class="font-heading text-sm uppercase text-muted"><i class="fa-solid fa-project-diagram"></i> Architecture Graph</h3>
                                    <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
                                        <button id="fp-play" onclick="fpToggle()" class="btn btn-accent btn-sm" style="font-size: 0.7rem; padding: 3px 10px; margin-right: 6px;"><i class="fa-solid fa-play"></i> Forward Pass</button>
                                        <button id="fp-step" onclick="fpStep()" class="btn btn-outline btn-sm" title="Step one layer" style="font-size: 0.7rem; padding: 3px 8px; margin-right: 10px;"><i class="fa-solid fa-forward-step"></i></button>
                                        <span class="text-xs text-muted" style="margin-right: 4px;">Heatmap:</span>
                                        <button id="hm-none" onclick="applyHeatmap('none')" class="btn btn-outline btn-sm" style="font-size: 0.7rem; padding: 3px 8px; background: rgba(139,92,246,0.15); border-color: var(--accent-transformer); color: var(--accent-transformer);">None</button>
                                        <button id="hm-flops" onclick="applyHeatmap('flops')" class="btn btn-outline btn-sm" style="font-size: 0.7rem; padding: 3px 8px;">FLOPs</button>
                                        <button id="hm-params" onclick="applyHeatmap('params')" class="btn btn-outline btn-sm" style="font-size: 0.7rem; padding: 3px 8px;">Parameters</button>
                                        <button id="hm-memory" onclick="applyHeatmap('memory')" class="btn btn-outline btn-sm" style="font-size: 0.7rem; padding: 3px 8px;">Memory</button>
                                    </div>
                                </div>
                                <div style="display: flex; flex-grow: 1; min-height: 0;">
                                    <div class="cy-container" id="cy-explorer" style="flex-grow: 1; min-height: 500px;"></div>
                                    <div id="heatmap-legend" style="display: none; padding: 16px; min-width: 130px; border-left: 1px solid var(--color-border);">
                                        <div style="font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--color-text-secondary); margin-bottom: 10px;">Legend</div>
                                        <div id="heatmap-legend-items"></div>
                                    </div>
                                </div>
                                <div id="node-detail-panel" style="display: none; padding: 14px 16px; border-top: 1px solid var(--color-border); border-radius: 0 0 12px 12px;">
                                    <div id="node-detail-content"></div>
                                </div>
                            </div>
                        </div>

                        ${tensorJourneyHtml}
                    </div>
                `;

                // Store for window functions
                window.currentExplorerStages = stages;
                window.currentExplorerGraph = graph;
                window.currentExplorerModules = modules;
                window.currentHeatmapMode = 'none';

                // Render graph, build metrics, attach heatmap tap handler
                setTimeout(() => {
                    const cy = renderGraph('cy-explorer', graph);
                    window.currentExplorerCy = cy;
                    if (cy) {
                        const mods = window.currentExplorerModules || [];
                        const nodeMetrics = {};
                        cy.nodes().forEach(n => {
                            const label = n.data('label') || '';
                            const ll = label.toLowerCase().trim();
                            const mod = mods.find(m => m.layer_name === label) ||
                                        mods.find(m => m.layer_name.toLowerCase() === ll) ||
                                        mods.find(m => ll.includes(m.layer_name.toLowerCase().trim())) ||
                                        mods.find(m => m.layer_name.toLowerCase().trim().includes(ll)) || null;
                            let flops = 0, params = 0, memory = 0;
                            if (mod) {
                                flops = mod.flops_context?.real_flops_mflops || 0;
                                params = mod.flops_context?.total_params_estimate || 0;
                                memory = mod.flops_context?.activation_memory_mb || 0;
                                if (!memory) {
                                    const ts = mod.tensor_summary || {};
                                    const outShape = Array.isArray(ts.output_shape) ? ts.output_shape :
                                        (Array.isArray(ts.trace) && ts.trace.length > 0 ? ts.trace[ts.trace.length - 1].output_shape : null);
                                    if (Array.isArray(outShape) && outShape.length >= 2) {
                                        const elems = outShape.reduce((a, b) => (typeof b === 'number' ? a * b : a), 1);
                                        memory = (elems * 4) / (1024 * 1024);
                                    }
                                }
                            }
                            nodeMetrics[n.id()] = { flops, params, memory, label };
                        });
                        window.currentExplorerNodeMetrics = nodeMetrics;
                        cy.on('tap', 'node', function(e) {
                            window.showNodeDetail(e.target.id());
                        });
                    }
                }, 100);

            } catch (err) {
                appContainer.innerHTML = `<div class="card text-center"><p class="text-muted">Failed to load explorer: ${err.message}</p></div>`;
            }
        }

        // ============================================================
        // V3 — Animated forward-pass through the architecture graph
        // ============================================================
        window.fpState = { order: [], idx: -1, playing: false, timer: null };

        function fpReady() {
            const cy = window.currentExplorerCy;
            return cy && cy.nodes && cy.nodes().length > 0;
        }
        function fpAccentColor() {
            const rgb = getComputedStyle(document.documentElement).getPropertyValue('--page-accent-rgb').trim() || '139, 92, 246';
            return `rgb(${rgb})`;
        }
        function fpSetBtn(playing) {
            const b = document.getElementById('fp-play');
            if (b) b.innerHTML = playing ? '<i class="fa-solid fa-pause"></i> Pause' : '<i class="fa-solid fa-play"></i> Forward Pass';
        }
        function fpBuildOrder() {
            const cy = window.currentExplorerCy;
            const nodes = cy.nodes().toArray();
            nodes.sort((a, b) => {
                const pa = a.position(), pb = b.position();
                return (pa.y - pb.y) || (pa.x - pb.x);
            });
            return nodes.map(n => n.id());
        }
        function fpHighlight(i) {
            const cy = window.currentExplorerCy;
            const order = window.fpState.order;
            if (!cy || i < 0 || i >= order.length) return;
            const accent = fpAccentColor();
            const node = cy.getElementById(order[i]);
            cy.batch(() => {
                cy.nodes().style('opacity', 0.28);
                cy.edges().style({ 'line-color': '#4B5563', 'target-arrow-color': '#4B5563', 'width': 2 });
                for (let k = 0; k <= i; k++) {
                    const prev = cy.getElementById(order[k]);
                    prev.style('opacity', k === i ? 1 : 0.62);
                    prev.style('border-color', k === i ? accent : '#111827');
                    prev.style('border-width', k === i ? 4 : 1);
                }
                node.incomers('edge').style({ 'line-color': accent, 'target-arrow-color': accent, 'width': 4 });
            });
            if (!prefersReducedMotion && node.animate) {
                node.animate({ style: { 'width': 80, 'height': 42 } }, { duration: 170 })
                    .animate({ style: { 'width': 60, 'height': 30 } }, { duration: 230 });
            }
            fpShowReadout(i, order[i]);
            fpSyncStage(order[i]);
        }
        function fpShowReadout(i, id) {
            const panel = document.getElementById('node-detail-panel');
            const content = document.getElementById('node-detail-content');
            if (!panel || !content) return;
            const m = (window.currentExplorerNodeMetrics || {})[id] || {};
            const mods = window.currentExplorerModules || [];
            const label = m.label || id;
            const ll = label.toLowerCase().trim();
            const mod = mods.find(x => x.layer_name === label)
                || mods.find(x => x.layer_name.toLowerCase() === ll)
                || mods.find(x => ll.includes(x.layer_name.toLowerCase().trim()))
                || mods.find(x => x.layer_name.toLowerCase().trim().includes(ll)) || null;
            let shape = '?';
            const ts = mod && mod.tensor_summary;
            if (ts) {
                let os = Array.isArray(ts.output_shape) ? ts.output_shape
                    : (Array.isArray(ts.trace) && ts.trace.length ? ts.trace[ts.trace.length - 1].output_shape : null);
                if (Array.isArray(os) && os.length) shape = '[' + os.join(', ') + ']';
            }
            const flops = m.flops ? (m.flops >= 1000 ? (m.flops / 1000).toFixed(1) + 'G' : m.flops.toFixed(1) + 'M') : '—';
            const total = window.fpState.order.length;
            panel.style.display = 'block';
            content.innerHTML = `<div class="pop-in" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <span class="badge badge-transformer">Layer ${i + 1}/${total}</span>
                <strong style="font-family:var(--font-mono);">${label}</strong>
                <span class="text-sm" style="color:var(--page-accent);font-family:var(--font-mono);">${shape}</span>
                <span class="text-xs text-muted">${flops} FLOPs${m.params ? ' · ' + formatNumber(m.params) + ' params' : ''}</span>
            </div>`;
        }
        function fpSyncStage(id) {
            const stages = window.currentExplorerStages;
            const m = (window.currentExplorerNodeMetrics || {})[id] || {};
            if (!stages || !m.label) return;
            let stageIdx = -1;
            stages.forEach((s, si) => { if (s.modules.some(mm => mm.layer_name === m.label)) stageIdx = si; });
            if (stageIdx >= 0 && window._fpStage !== stageIdx && typeof window.selectStage === 'function') {
                window._fpStage = stageIdx;
                window.selectStage(stageIdx);
            }
        }
        function fpStep() {
            if (!fpReady()) return false;
            if (!window.fpState.order.length || window.fpState.idx >= window.fpState.order.length - 1) {
                window.fpState.order = fpBuildOrder();
                window.fpState.idx = -1;
                window._fpStage = -1;
            }
            window.fpState.idx++;
            fpHighlight(window.fpState.idx);
            return window.fpState.idx < window.fpState.order.length - 1;
        }
        function fpToggle() {
            if (!fpReady()) return;
            if (window.fpState.playing) { fpPause(); return; }
            if (prefersReducedMotion) { fpStep(); return; }
            if (!window.fpState.order.length || window.fpState.idx >= window.fpState.order.length - 1) {
                window.fpState.order = fpBuildOrder(); window.fpState.idx = -1; window._fpStage = -1;
            }
            window.fpState.playing = true; fpSetBtn(true);
            const tick = () => {
                const more = fpStep();
                if (more && window.fpState.playing) window.fpState.timer = setTimeout(tick, 850);
                else { window.fpState.playing = false; fpSetBtn(false); }
            };
            tick();
        }
        function fpPause() {
            window.fpState.playing = false;
            if (window.fpState.timer) { clearTimeout(window.fpState.timer); window.fpState.timer = null; }
            fpSetBtn(false);
        }

        window.selectStage = function(stageIdx) {
            if (!window.currentExplorerStages) return;

            // Update active stage
            document.querySelectorAll('.stage-timeline-item').forEach((el, idx) => {
                if (idx === stageIdx) {
                    el.style.background = 'rgba(139, 92, 246, 0.2)';
                    el.style.borderColor = 'var(--accent-transformer)';
                } else {
                    el.style.background = 'var(--bg-panel)';
                    el.style.borderColor = 'var(--color-border)';
                }
            });

            // Update stage details panel
            document.querySelectorAll('.stage-detail-panel').forEach((panel, idx) => {
                panel.style.display = idx === stageIdx ? 'block' : 'none';
            });

            // Update tensor journey section
            document.querySelectorAll('.tensor-journey-stage').forEach((section, idx) => {
                section.style.display = idx === stageIdx ? 'block' : 'none';
            });
        };

        window.toggleTensorMath = function() {
            const mathElements = document.querySelectorAll('.tensor-math');
            const isHidden = mathElements[0] ? mathElements[0].style.display === 'none' : true;

            mathElements.forEach(el => {
                el.style.display = isHidden ? 'block' : 'none';
            });

            // Update button text
            const btn = event?.target?.closest('.btn');
            if (btn) {
                if (isHidden) {
                    btn.innerHTML = '<i class="fa-solid fa-square-root-variable"></i> Hide Math';
                } else {
                    btn.innerHTML = '<i class="fa-solid fa-square-root-variable"></i> Show Math';
                }
            }
        };

        window.toggleTensorCode = function() {
            const codeElements = document.querySelectorAll('.tensor-code');
            const isHidden = codeElements[0] ? codeElements[0].style.display === 'none' : true;

            codeElements.forEach(el => {
                el.style.display = isHidden ? 'block' : 'none';
            });

            // Update button text
            const btn = event?.target?.closest('.btn');
            if (btn) {
                if (isHidden) {
                    btn.innerHTML = '<i class="fa-brands fa-python"></i> Hide Code';
                } else {
                    btn.innerHTML = '<i class="fa-brands fa-python"></i> Show Code';
                }
            }
        };

        // --- Phase 11C: Compute Heatmap ---
        function heatColor(t) {
            if (t < 0.25) return '#10B981';
            if (t < 0.50) return '#EAB308';
            if (t < 0.75) return '#F97316';
            return '#EF4444';
        }

        window.applyHeatmap = function(mode) {
            window.currentHeatmapMode = mode;
            const cy = window.currentExplorerCy;
            const nodeMetrics = window.currentExplorerNodeMetrics;

            // Update button active states
            ['none', 'flops', 'params', 'memory'].forEach(m => {
                const btn = document.getElementById('hm-' + m);
                if (!btn) return;
                if (m === mode) {
                    btn.style.background = 'rgba(139,92,246,0.15)';
                    btn.style.borderColor = 'var(--accent-transformer)';
                    btn.style.color = 'var(--accent-transformer)';
                } else {
                    btn.style.background = '';
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }
            });

            const legend = document.getElementById('heatmap-legend');
            const legendItems = document.getElementById('heatmap-legend-items');

            if (!cy) return;

            if (mode === 'none') {
                if (legend) legend.style.display = 'none';
                cy.nodes().forEach(n => n.style('background-color', '#374151'));
                window.currentExplorerNodeRanks = null;
                if (window.currentExplorerSelectedNode) window.showNodeDetail(window.currentExplorerSelectedNode);
                return;
            }

            if (legend) legend.style.display = 'block';

            // Collect values per node
            const entries = nodeMetrics ? Object.entries(nodeMetrics) : [];
            const vals = entries.map(([id, nm]) => ({ id, val: nm[mode] || 0 }));
            const allVals = vals.map(v => v.val);
            const maxVal = Math.max(...allVals, 0.001);
            const minVal = Math.min(...allVals, 0);
            const range = maxVal - minVal || 0.001;

            // Build rank map (0 = most expensive, 100 = least)
            const sorted = [...vals].sort((a, b) => b.val - a.val);
            const nodeRanks = {};
            sorted.forEach((v, i) => {
                nodeRanks[v.id] = Math.max(1, Math.round((i / Math.max(sorted.length - 1, 1)) * 100));
            });
            window.currentExplorerNodeRanks = nodeRanks;

            // Color nodes
            cy.nodes().forEach(n => {
                const nm = nodeMetrics ? nodeMetrics[n.id()] : null;
                const val = nm ? (nm[mode] || 0) : 0;
                const t = (val - minVal) / range;
                n.style('background-color', heatColor(t));
            });

            // Update legend
            const modeLabel = mode === 'flops' ? 'FLOPs' : mode === 'params' ? 'Parameters' : 'Memory';
            if (legendItems) {
                legendItems.innerHTML = [
                    ['#10B981', 'Low ' + modeLabel],
                    ['#EAB308', 'Medium'],
                    ['#F97316', 'High'],
                    ['#EF4444', 'Very High']
                ].map(([color, lbl]) =>
                    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">' +
                    '<div style="width:14px;height:14px;border-radius:3px;background:' + color + ';flex-shrink:0;"></div>' +
                    '<span class="text-muted" style="font-size:0.75rem;">' + lbl + '</span></div>'
                ).join('');
            }

            // Refresh node detail panel if open
            if (window.currentExplorerSelectedNode) window.showNodeDetail(window.currentExplorerSelectedNode);
        };

        window.journeyStep = async function(dir) {
            const s = window.journeyState;
            s.currentIndex += dir;
            if(s.currentIndex < 0) s.currentIndex = 0;
            if(s.currentIndex >= s.modules.length) s.currentIndex = s.modules.length - 1;
            
            document.getElementById('journey-prev').disabled = (s.currentIndex === 0);
            document.getElementById('journey-next').disabled = (s.currentIndex === s.modules.length - 1);
            
            await loadJourneyStep();
        };

            const s = window.journeyState;
            const moduleId = s.modules[s.currentIndex].id;
            
            document.getElementById('journey-progress').innerText = `Step ${s.currentIndex + 1} of ${s.modules.length}`;
            const content = document.getElementById('journey-content');
            content.innerHTML = `<div class="spinner"></div>`;
            
            const modResp = await fetch(`/api/modules/${moduleId}`);

            let inShapeRaw = tensor.input_shape;
            let outShapeRaw = tensor.output_shape;
            if (!inShapeRaw && Array.isArray(tensor.trace) && tensor.trace.length > 0) {
                inShapeRaw = tensor.trace[0].input_shape;
                outShapeRaw = tensor.trace[tensor.trace.length - 1].output_shape;
            }
            const inShape = Array.isArray(inShapeRaw) ? '[' + inShapeRaw.join(', ') + ']' : (inShapeRaw || 'N/A');

            const exp = module.explanation ? module.explanation.replace(/\n/g, '<br>') : "Passes tensor through architecture layer.";

            let stepCodeLines = [];
            if (module.graph_nodes && module.graph_nodes.length > 0) {

        // --- Phase 2B: Architecture Compare Lab ---

                            <button class="btn btn-outline" onclick="window.location.hash='#/'">Cancel</button>

                        </div>
                    </div>
                </div>
            `;

            window.handleFileSelect = async () => {
                const fileInput = document.getElementById('paper-file');
                const file = fileInput.files[0];
                if (!file) return;
                
                const errDiv = document.getElementById('upload-error');
                
                if (!file.name.toLowerCase().endsWith('.pdf')) {
                    errDiv.innerText = 'Only PDF files are supported.';
                    errDiv.style.display = 'block';
                    return;
                }
                if (file.size === 0) {
                    errDiv.innerText = 'File is empty.';
                    errDiv.style.display = 'block';
                    return;
                }
                if (file.size > 20 * 1024 * 1024) {
                    errDiv.innerText = 'File exceeds 20MB limit.';
                    errDiv.style.display = 'block';
                    return;
                }
                
                document.getElementById('upload-step-1').style.display = 'none';
                document.getElementById('upload-step-2').style.display = 'block';
                errDiv.style.display = 'none';
                
                const formData = new FormData();
                formData.append('file', file);
                
                try {
                    const res = await fetch('/api/papers/upload', {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Upload failed');
                    
                    window.uploadedPaperId = data.paper_id;
                    
                    const reportHtml = `
                        <div class="metric-card"><div class="metric-label">Title</div><div class="text-sm font-semibold">${data.title}</div></div>
                        <div class="metric-card"><div class="metric-label">Classification</div><div class="text-sm font-semibold">${data.classification}</div></div>
                        <div class="metric-card"><div class="metric-label">Nodes / Edges</div><div class="text-sm font-semibold">${data.report.nodes} / ${data.report.edges}</div></div>
                        <div class="metric-card"><div class="metric-label">Parameters</div><div class="text-sm font-semibold">${formatNumber(data.report.parameters)}</div></div>
                    `;
                    document.getElementById('report-grid').innerHTML = reportHtml;
                    
                    document.getElementById('upload-step-2').style.display = 'none';
                    document.getElementById('upload-step-3').style.display = 'block';
                } catch (e) {
                    document.getElementById('upload-step-2').style.display = 'none';
                    document.getElementById('upload-step-1').style.display = 'block';
                    document.getElementById('upload-error').style.display = 'block';
                    document.getElementById('upload-error').innerText = e.message;
                }
            };
            
            window.publishPaper = async () => {
                if(!window.uploadedPaperId) return;
                const btn = document.getElementById('publish-btn');
                btn.disabled = true;
                btn.innerText = 'Publishing...';
                
                try {
                    const res = await fetch(`/api/papers/${window.uploadedPaperId}/publish`, { method: 'POST' });
                    if(!res.ok) throw new Error("Publish failed");
                    window.location.hash = '#/';
                } catch(e) {
                    alert(e.message);
                    btn.disabled = false;
                    btn.innerText = 'Publish to Library';
                }
            };
        }
