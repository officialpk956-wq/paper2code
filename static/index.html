<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper2Code - Interactive Architecture Experience</title>
    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,300,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Cytoscape, Chart.js & Monaco Editor loaded async to prevent blocking -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.26.0/cytoscape.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs/loader.js" defer></script>
    
    <!-- Paper2Code Design System -->
    <link rel="stylesheet" href="/static/design.css">

    <style>
        /* Ambient Glow Blobs */
        .ambient-glow {
            position: fixed;
            width: 40vw;
            height: 40vw;
            border-radius: 50%;
            background: var(--accent-transformer);
            filter: blur(150px);
            opacity: 0.1;
            pointer-events: none;
            z-index: -1;
        }
        .glow-top-right {
            top: -20vh;
            right: -10vw;
        }
        .glow-bottom-left {
            bottom: -20vh;
            left: -10vw;
            background: var(--accent-unet);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }

        .logo-icon {
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent-transformer), var(--accent-unet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text {
            font-family: var(--font-heading);
            font-weight: 800;
            font-size: 1.5rem;
            letter-spacing: -0.02em;
        }

        .logo-text span {
            color: var(--accent-transformer);
        }

        /* Helpers */
        .text-muted { color: var(--color-text-secondary); }
        .text-sm { font-size: 0.875rem; }
        .text-lg { font-size: 1.125rem; }
        .font-semibold { font-weight: 600; }
        .mb-2 { margin-bottom: var(--space-2); }
        .mb-4 { margin-bottom: var(--space-4); }
        .mt-4 { margin-top: var(--space-4); }
        .mt-8 { margin-top: var(--space-8); }
        .gap-2 { gap: var(--space-2); }
        .gap-4 { gap: var(--space-4); }
        .opacity-70 { opacity: 0.7; }
        
        .grid-cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
        .grid-cols-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-4); }

        /* Loader */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--color-border);
            border-top-color: var(--accent-transformer);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: var(--space-12) auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Page Transition */
        .page-view {
            animation: fadeIn 0.3s ease-out forwards;
        }

        /* Timeline Redesign */
        .timeline-content {
            background: var(--bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: var(--space-4);
            transition: all var(--transition-base);
        }
        .timeline-item:hover .timeline-content {
            border-color: var(--color-border-subtle);
            background: var(--bg-panel);
            transform: translateX(4px);
        }

        /* Sidebar Nav */
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            padding: var(--space-2);
            border-radius: 8px;
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            transition: all var(--transition-base);
            margin-bottom: 2px;
        }
        .sidebar-link:hover {
            background: var(--bg-panel);
            color: var(--color-text-primary);
        }
        .sidebar-link.active {
            background: rgba(139, 92, 246, 0.1);
            color: var(--accent-transformer);
            font-weight: 500;
        }

        /* Quick Facts / Metric Cards */
        .metric-card {
            background: var(--bg-surface);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: var(--space-3);
        }
        .metric-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--color-text-secondary);
            margin-bottom: var(--space-1);
            display: flex;
            align-items: center;
            gap: var(--space-1);
        }
        .metric-value {
            font-family: var(--font-heading);
            font-size: 1.25rem;
            font-weight: 600;
        }

        /* Mobile Adjustments */
        @media (max-width: 1024px) {
            .grid-cols-3 { grid-template-columns: 1fr; }
            .grid-cols-2 { grid-template-columns: 1fr; }
            .hero-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <div class="ambient-glow glow-top-right"></div>
    <div class="ambient-glow glow-bottom-left"></div>

    <header class="header-nav">
        <div class="container flex justify-between items-center">
            <a href="#/" class="logo-group">
                <div class="logo-icon"><i class="fa-solid fa-microchip"></i></div>
                <div class="logo-text">Paper2<span>Code</span></div>
            </a>
            <div id="nav-actions"></div>
        </div>
    </header>

    <main class="container" id="app-container"></main>
    <div id="cy-tooltip" class="cy-tooltip"></div>

    <script>
        const appContainer = document.getElementById('app-container');
        const navActions = document.getElementById('nav-actions');

        const compareKnowledge = {
            cnn: {
                dna: ['Convolution Driven', 'Residual Learning', 'Hierarchical Features'],
                advantages: ['Highly efficient on grids', 'Translation invariance', 'Proven for vision'],
                limitations: ['Limited long-range context', 'Fixed receptive field'],
                useCases: 'Image Classification, Object Detection, Image Segmentation'
            },
            transformer: {
                dna: ['Attention Driven', 'Global Context', 'Token Interactions'],
                advantages: ['Global receptive field', 'Highly scalable', 'Domain agnostic'],
                limitations: ['Compute expensive (O(N²))', 'Data hungry', 'Lacks spatial inductive bias'],
                useCases: 'Natural Language Processing, Vision Transformers (ViT), Multimodal'
            },
            unet: {
                dna: ['Encoder-Decoder', 'Skip Connections', 'Spatial Recovery'],
                advantages: ['Preserves high-resolution details', 'Works well with limited data'],
                limitations: ['High memory usage for feature maps', 'Complex training dynamics'],
                useCases: 'Medical Image Segmentation, Image Restoration, Diffusion Models'
            }
        };

        const interviewQuestions = [
            { q: "How do you implement a Residual Connection in PyTorch?", a: "By storing the input tensor x, passing x through the layers, and then adding it back before the final activation: out = self.layers(x) + x; return self.relu(out)." },
            { q: "Why is Self-Attention computationally expensive?", a: "The Q*K^T operation scales quadratically O(N^2) with the sequence length (N). In PyTorch, this is typically handled by nn.MultiheadAttention or scaled dot-product attention." },
            { q: "How are Skip Connections implemented in U-Net?", a: "The encoder saves intermediate feature maps at each spatial resolution. During the decoder phase, these saved tensors are concatenated to the upsampled tensors: torch.cat([upsampled_x, saved_x], dim=1)." },
            { q: "What does nn.Conv2d(kernel_size=3, padding=1) do?", a: "It applies a 3x3 convolution filter and adds 1 pixel of zero-padding on all sides, which perfectly preserves the spatial dimensions of the input tensor." }
        ];

        window.toggleFlashcard = function(el) {
            el.classList.toggle('revealed');
        };

        function formatNumber(num) {
            if (!num) return '0';
            if (num >= 1e6) return (num / 1e6).toFixed(1) + 'M';
            if (num >= 1e3) return (num / 1e3).toFixed(0) + 'K';
            return num.toString();
        }

        function getArchClass(type) {
            const t = type.toLowerCase();
            if (t.includes('cnn') || t.includes('resnet')) return 'cnn';
            if (t.includes('attention') || t.includes('transformer')) return 'transformer';
            return 'unet';
        }

        function getArchColor(typeClass) {
            if(typeClass === 'cnn') return '#10B981';
            if(typeClass === 'transformer') return '#8B5CF6';
            return '#06B6D4';
        }

        function getArchIcon(type) {
            const t = type.toLowerCase();
            if (t.includes('attention') || t.includes('transformer')) return 'fa-brain';
            if (t.includes('cnn')) return 'fa-layer-group';
            if (t.includes('encoder-decoder')) return 'fa-shuffle';
            return 'fa-network-wired';
        }

        // --- Phase 3: Client-Side Code Generator ---
        function nodeToPyTorch(node) {
            const p = node.params || {};
            const ch = p.channels || p.filters || 64;
            const k = p.kernel_size || 3;
            // Best-effort extraction of input hidden size for linear layers
            let in_hs = 512;
            if (node.input_shape && node.input_shape.length) {
                const last = node.input_shape[node.input_shape.length - 1];
                if (typeof last === 'number') in_hs = last;
            }
            const out_hs = p.hidden_size || 512;
            const heads = p.num_heads || p.heads || 8;

            const t = node.type.toLowerCase();
            
            // Map types to nn.* constructors (Matches backend codegen.py exactly)
            const map = {
                "conv2d": `nn.Conv2d(${ch}, ${ch}, kernel_size=${k}, padding=${Math.floor(k/2)})`,
                "conv1d": `nn.Conv1d(${ch}, ${ch}, kernel_size=${k}, padding=${Math.floor(k/2)})`,
                "linear": `nn.Linear(${in_hs}, ${out_hs})`,
                "relu": "nn.ReLU(inplace=True)",
                "gelu": "nn.GELU()",
                "sigmoid": "nn.Sigmoid()",
                "maxpool2d": "nn.MaxPool2d(kernel_size=2, stride=2)",
                "avgpool2d": "nn.AvgPool2d(kernel_size=2, stride=2)",
                "batchnorm2d": `nn.BatchNorm2d(${ch})`,
                "batchnorm1d": `nn.BatchNorm1d(${ch})`,
                "layernorm": `nn.LayerNorm(${in_hs})`,
                "dropout": "nn.Dropout(p=0.1)",
                "transpose": "lambda x: x.transpose(1, 2)",
                "upsample": "nn.Upsample(scale_factor=2, mode='bilinear', align_corners=False)",
                "multiheadattention": `nn.MultiheadAttention(embed_dim=${in_hs}, num_heads=${heads}, batch_first=True)`,
                "transformerblock": `nn.TransformerEncoderLayer(d_model=${in_hs}, nhead=${heads}, batch_first=True)`,
                "patchembedding": `ViTPatchEmbed(3, ${p.embed_dim || 768}, ${p.patch_size || 16})`,
                "sequence_pooling": "lambda x: x.mean(dim=1)"
            };

            return map[t] || `# Custom block implementation needed for ${node.type}`;
        }

        function generateArchitectureSkeleton(graph) {
            if (!graph || !graph.nodes || graph.nodes.length === 0) return "# No nodes available to generate code.";
            
            const name = (graph.name || "CustomModel").replace(/[^A-Za-z0-9]/g, "");
            
            let lines = [
                "# NOTE: Skip connections not represented in this sequential skeleton",
                "import torch",
                "import torch.nn as nn",
                "",
                "class ViTPatchEmbed(nn.Module):",
                "    def __init__(self, in_channels, embed_dim, patch_size):",
                "        super().__init__()",
                "        self.proj = nn.Conv2d(in_channels, embed_dim, kernel_size=patch_size, stride=patch_size)",
                "    def forward(self, x):",
                "        return self.proj(x).flatten(2).transpose(1, 2)",
                "",
                `class ${name}(nn.Module):`,
                "    def __init__(self):",
                "        super().__init__()"
            ];
            
            let forwardCalls = [];
            
            graph.nodes.forEach(node => {
                const layerStr = nodeToPyTorch(node);
                if (layerStr && !layerStr.startsWith("#")) {
                    lines.push(`        self.${node.id} = ${layerStr}`);
                }
                forwardCalls.push(`        x = self.${node.id}(x)  # ${node.label}`);
            });
            
            lines.push("");
            lines.push("    def forward(self, x):");
            lines = lines.concat(forwardCalls);
            lines.push("        return x");
            lines.push("");
            
            return lines.join("\\n");
        }
        
        // Setup Monaco Editor lazy loader
        let monacoInstance = null;
        let monacoInitPromise = null;
        function initMonaco(containerId, initialCode, readOnly = true) {
            if (!monacoInitPromise) {
                monacoInitPromise = new Promise((resolve) => {
                    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.40.0/min/vs' }});
                    require(['vs/editor/editor.main'], function() {
                        resolve(monaco);
                    });
                });
            }
            
            return monacoInitPromise.then((monacoObj) => {
                const el = document.getElementById(containerId);
                if (!el) return null;
                el.innerHTML = '';
                const editor = monacoObj.editor.create(el, {
                    value: initialCode,
                    language: 'python',
                    theme: 'vs-dark',
                    readOnly: readOnly,
                    minimap: { enabled: false },
                    scrollBeyondLastLine: false,
                    fontSize: 14,
                    lineHeight: 24,
                    padding: { top: 16, bottom: 16 },
                    renderLineHighlight: 'all',
                    automaticLayout: true
                });
                return editor;
            });
        }

        function downloadCode(filename, code) {
            const blob = new Blob([code], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Cytoscape Renderer Helper
        function renderGraph(containerId, graphData, currentNodes = null, mode = 'default') {
            const container = document.getElementById(containerId);
            if (!container || !graphData || !graphData.nodes) return;
            if (typeof cytoscape === 'undefined') { container.innerHTML = '<div class="text-sm text-muted" style="padding:16px;text-align:center;">Graph loading...</div>'; return; }
            
            const elements = { nodes: [], edges: [] };
            
            graphData.nodes.forEach(n => {
                const isTarget = currentNodes && currentNodes.some(cn => cn.node_id === n.id);
                let bgColor = '#374151'; // default
                let bgOpacity = 1;
                
                if (mode === 'compute') {
                    const nameLower = n.label ? n.label.toLowerCase() : '';
                    if (nameLower.includes('conv') || nameLower.includes('attention')) bgColor = '#EF4444'; // Red
                    else if (nameLower.includes('fc') || nameLower.includes('linear')) bgColor = '#F59E0B'; // Yellow
                    else bgColor = '#10B981'; // Green
                } else if (mode === 'memory') {
                    const nameLower = n.label ? n.label.toLowerCase() : '';
                    if (nameLower.includes('pool') || nameLower.includes('embed') || nameLower.includes('attention')) bgColor = '#EF4444'; 
                    else if (nameLower.includes('norm')) bgColor = '#F59E0B';
                    else bgColor = '#10B981';
                } else if (currentNodes) {
                    bgColor = isTarget ? '#8B5CF6' : '#374151';
                    bgOpacity = isTarget ? 1 : 0.4;
                }

                elements.nodes.push({
                    data: { id: n.id, label: n.label || n.id, type: n.type },
                    style: { 'background-color': bgColor, 'opacity': bgOpacity }
                });
            });

            graphData.edges.forEach(e => {
                elements.edges.push({
                    data: { id: e.source + '-' + e.target, source: e.source, target: e.target }
                });
            });

            const cy = cytoscape({
                container: container,
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(label)',
                            'color': '#F9FAFB',
                            'font-size': '10px',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'width': 60,
                            'height': 30,
                            'shape': 'round-rectangle',
                            'border-width': 1,
                            'border-color': '#111827',
                            'text-outline-color': '#000',
                            'text-outline-width': 1
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#4B5563',
                            'target-arrow-color': '#4B5563',
                            'target-arrow-shape': 'triangle',
                            'curve-style': 'bezier'
                        }
                    }
                ],
                layout: {
                    name: 'breadthfirst',
                    directed: true,
                    padding: 30,
                    spacingFactor: 1.2
                },
                userZoomingEnabled: true,
                userPanningEnabled: true
            });

            const tooltip = document.getElementById('cy-tooltip');
            cy.on('mouseover', 'node', function(e) {
                const node = e.target;
                tooltip.innerHTML = `<strong>${node.data('label')}</strong><br/><span style="color:var(--color-text-secondary)">Type: ${node.data('type') || 'Layer'}</span>`;
                tooltip.style.display = 'block';
                tooltip.style.left = e.originalEvent.pageX + 10 + 'px';
                tooltip.style.top = e.originalEvent.pageY + 10 + 'px';
            });
            cy.on('mouseout', 'node', function() {
                tooltip.style.display = 'none';
            });
            
            // Phase 3: Node <-> Code Sync
            cy.on('tap', 'node', function(e) {
                const nodeId = e.target.id();
                if (window.currentModuleNodesMap && window.currentModuleNodesMap[nodeId] && window.currentEditorInstance) {
                    const line = window.currentModuleNodesMap[nodeId];
                    window.currentEditorInstance.revealLineInCenter(line);
                    window.currentEditorInstance.setPosition({ lineNumber: line, column: 1 });
                    window.currentEditorInstance.focus();
                }
            });
            
            return cy;
        }

        // --- Phase A: Library Page ---
        async function renderLibraryPage() {
            navActions.innerHTML = `<a href="#/compare" class="btn btn-outline" style="border-color: var(--accent-transformer); color: var(--color-text-primary);"><i class="fa-solid fa-code-compare mr-2"></i> Compare Architectures</a>`; 
            appContainer.innerHTML = `<div class="spinner"></div>`;

            try {
                const response = await fetch('/api/papers');
                const papers = await response.json();

                let gridContent = '';
                papers.forEach((p, idx) => {
                    const cleanTypeClass = getArchClass(p.architecture_type);
                    const icon = getArchIcon(p.architecture_type);
                    
                    let insight = 'A seminal architecture in deep learning.';
                    if (cleanTypeClass === 'transformer') insight = 'Replaced recurrence entirely with self-attention.';
                    else if (cleanTypeClass === 'cnn') insight = 'Enabled extremely deep networks via shortcut connections.';
                    else if (cleanTypeClass === 'unet') insight = 'Pioneered encoder-decoder connections for segmentation.';

                    gridContent += `
                        <div class="card card-hover" style="animation: fadeIn 0.4s ease-out ${idx * 0.1}s forwards; opacity: 0;">
                            <div class="mb-4">
                                <span class="badge badge-${cleanTypeClass} mb-2"><i class="fa-solid ${icon}" style="margin-right: 4px;"></i> ${p.architecture_type}</span>
                                <h3>${p.title}</h3>
                                <p class="text-sm text-muted mt-2" style="font-style: italic;">"${insight}"</p>
                            </div>
                            <div class="grid-cols-2 mb-4">
                                <div>
                                    <div class="text-sm text-muted uppercase font-semibold">Parameters</div>
                                    <div class="text-lg font-heading">${formatNumber(p.parameter_count)}</div>
                                </div>
                                <div>
                                    <div class="text-sm text-muted uppercase font-semibold">Modules</div>
                                    <div class="text-lg font-heading">${p.module_count}</div>
                                </div>
                            </div>
                            <a href="#/papers/${p.id}" class="btn btn-outline" style="width: 100%;">
                                Explore Architecture <i class="fa-solid fa-arrow-right ml-2" style="margin-left: 8px;"></i>
                            </a>
                        </div>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="page-view">
                        <section class="hero">
                            <h1 class="hero-title">Interactive Architecture Library</h1>
                            <p class="hero-subtitle">Seminal machine learning models decomposed into visual, educational learning paths.</p>
                        </section>
                        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));">
                            ${gridContent}
                        </div>
                    </div>
                `;
            } catch (err) {
                appContainer.innerHTML = `<div class="card text-center"><p class="text-muted">Failed to load papers: ${err.message}</p></div>`;
            }
        }

        // --- Phase B: Paper Overview Page ---
        async function renderOverviewPage(params) {
            const paperId = params.id;
            navActions.innerHTML = `
                <a href="#/papers/${paperId}/journey" class="btn btn-primary" style="margin-right: 16px;"><i class="fa-solid fa-code" style="margin-right: 8px;"></i> Implementation Walkthrough</a>
                <a href="#/" class="btn btn-outline"><i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Library</a>
            `;
            appContainer.innerHTML = `<div class="spinner"></div>`;

            try {
                const response = await fetch(`/api/papers/${paperId}`);
                if (!response.ok) throw new Error('Paper not found');
                const paper = await response.json();
                window.currentPaperData = paper;
                
                const meta = paper.metadata;
                const stats = paper.architecture_statistics;
                const cleanTypeClass = getArchClass(meta.architecture_type);
                const archIcon = getArchIcon(meta.architecture_type);

                let maxFlopsModule = {flops: 0, name: ''};
                let bottleneckStr = 'Uniform Distribution';
                paper.module_summary.forEach(m => {
                    if(m.flops_context && m.flops_context.real_flops_mflops > maxFlopsModule.flops) {
                        maxFlopsModule = {flops: m.flops_context.real_flops_mflops, name: m.layer_name};
                    }
                });
                if(maxFlopsModule.flops > 0) bottleneckStr = maxFlopsModule.name + " represents the compute bottleneck.";

                let timelineContent = '';
                paper.module_summary.forEach((m) => {
                    let mFlopsStr = "0";
                    if (m.flops_context && m.flops_context.real_flops_mflops > 0) {
                        const mflops = m.flops_context.real_flops_mflops;
                        if (mflops >= 1000) mFlopsStr = (mflops / 1000).toFixed(1) + "G";
                        else if (mflops >= 1) mFlopsStr = mflops.toFixed(1) + "M";
                        else mFlopsStr = (mflops * 1000).toFixed(0) + "K";
                    }

                    timelineContent += `
                        <a href="#/papers/${paperId}/modules/${m.id}">
                        <div class="timeline-item">
                            <div class="timeline-content">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="font-heading text-lg">${m.layer_name}</h4>
                                    <span class="badge" style="font-size: 0.65rem;">${m.module_type}</span>
                                </div>
                                <div class="text-sm text-muted mb-4">
                                    ${m.explanation ? m.explanation.substring(0, 120) + '...' : 'Module decomposition step.'}
                                </div>
                                <div class="flex gap-4 text-sm text-muted">
                                    <span><i class="fa-solid fa-microchip mr-1"></i> ${mFlopsStr} FLOPs</span>
                                    <span><i class="fa-solid fa-server mr-1"></i> ${formatNumber(m.flops_context?.total_params_estimate || 0)} Params</span>
                                </div>
                            </div>
                        </div>
                        </a>
                    `;
                });

                appContainer.innerHTML = `
                    <div class="page-view overview-layout">
                        <!-- Main Content -->
                        <div>
                            <div class="mb-8">
                                <span class="badge badge-${cleanTypeClass} mb-4"><i class="fa-solid ${archIcon}" style="margin-right: 4px;"></i> ${meta.architecture_type}</span>
                                <h1 style="font-size: 3rem; margin-bottom: 16px;">${meta.full_title}</h1>

                const formattedDesc = formatContent(module.description);

                paperData.modules.forEach(m => {

                                </div>

                            </div>

                                    ${tensorAnimHtml}

                                <div class="card editor-pane" style="padding: 0;">

                            ${formattedDesc !== formattedExpl && formattedDesc.trim() !== '' ? `<div class="mb-8 text-muted mt-8">${formattedDesc}</div>` : ''}
                            ${formattedExpl.trim() !== '' ? `<div class="callout mb-8"><div class="callout-title" style="color: var(--accent-transformer); font-size: 1.125rem;"><i class="fa-solid fa-lightbulb"></i> Why This Matters</div><div class="text-muted mt-2">${formattedExpl}</div></div>` : ''}
                            
                            <div class="flex gap-4 mt-8 pt-8" style="border-top: 1px solid var(--color-border-subtle);">
                                <a ${prevAttr} class="btn btn-outline" style="flex: 1;"><i class="fa-solid fa-arrow-left mr-2"></i> Prev</a>

                        <div class="sidebar">

                let moduleCodeLines = [];

                if (module.graph_nodes && module.graph_nodes.length > 0) {
                    module.graph_nodes.forEach(n => {
                        let snippet = nodeToPyTorch(n);
                        if (snippet && !snippet.startsWith("#")) {
                            moduleCodeLines.push(`self.${n.id} = ${snippet}`);
                            nodeLineMap[n.id] = currentLine;
                            currentLine++;
                        } else {
                            moduleCodeLines.push(`# Custom block needed for ${n.id}`);

        // --- Feature 5: Implementation Walkthrough ---
        async function renderJourneyPage(params) {
            const paperId = params.id;
            navActions.innerHTML = `<a href="#/papers/${paperId}" class="btn btn-outline"><i class="fa-solid fa-times" style="margin-right: 8px;"></i> Exit Walkthrough</a>`;
            appContainer.innerHTML = `<div class="spinner"></div>`;

            try {
                const listResp = await fetch(`/api/papers/${paperId}/modules`);
                const paperData = await listResp.json();
                
                if(!paperData.modules || paperData.modules.length === 0) throw new Error("No modules found.");
                
                window.journeyState = { paperId: paperId, modules: paperData.modules, currentIndex: 0 };
                
                appContainer.innerHTML = `
                    <div class="page-view journey-layout">
                        <div class="text-center mb-4">
                            <h2 class="font-heading text-2xl">Implementation Walkthrough: <span style="color:var(--accent-cnn)">${paperData.paper_title}</span></h2>
                            <div class="text-sm text-muted mt-2" id="journey-progress">Step 1 of ${paperData.total_modules}</div>
                        </div>
                        <div id="journey-content" class="card" style="display: flex; flex-direction: column; justify-content: center; min-height: 400px;">
                            <div class="spinner"></div>
                        </div>
                        <div class="flex justify-between mt-4">
                            <button id="journey-prev" class="btn btn-outline" onclick="journeyStep(-1)" disabled><i class="fa-solid fa-arrow-left mr-2"></i> Previous</button>
                            <button id="journey-next" class="btn btn-primary" onclick="journeyStep(1)">Next Step <i class="fa-solid fa-arrow-right ml-2"></i></button>
                        </div>
                    </div>
                `;
                
                await loadJourneyStep();
            } catch(err) {
                appContainer.innerHTML = `<div class="card text-center"><p class="text-muted">Walkthrough failed: ${err.message}</p></div>`;
            }
        }

        window.journeyStep = async function(dir) {
            const s = window.journeyState;
            s.currentIndex += dir;
            if(s.currentIndex < 0) s.currentIndex = 0;
            if(s.currentIndex >= s.modules.length) s.currentIndex = s.modules.length - 1;
            
            document.getElementById('journey-prev').disabled = (s.currentIndex === 0);
            document.getElementById('journey-next').disabled = (s.currentIndex === s.modules.length - 1);
            
            await loadJourneyStep();
        };

        async function loadJourneyStep() {
            const s = window.journeyState;
            const moduleId = s.modules[s.currentIndex].id;
            
            document.getElementById('journey-progress').innerText = `Step ${s.currentIndex + 1} of ${s.modules.length}`;
            const content = document.getElementById('journey-content');
            content.innerHTML = `<div class="spinner"></div>`;
            
            const modResp = await fetch(`/api/modules/${moduleId}`);
            const module = await modResp.json();
            
            const tensor = module.tensor_summary || {};
            let inShapeRaw = tensor.input_shape;
            let outShapeRaw = tensor.output_shape;
            if (!inShapeRaw && Array.isArray(tensor.trace) && tensor.trace.length > 0) {
                inShapeRaw = tensor.trace[0].input_shape;
                outShapeRaw = tensor.trace[tensor.trace.length - 1].output_shape;
            }
            const inShape = Array.isArray(inShapeRaw) ? '[' + inShapeRaw.join(', ') + ']' : (inShapeRaw || 'N/A');
            const outShape = Array.isArray(outShapeRaw) ? '[' + outShapeRaw.join(', ') + ']' : (outShapeRaw || 'N/A');

            let flopsDisplay = '0';
            if (module.flops_context && module.flops_context.real_flops_mflops) {
                let m = module.flops_context.real_flops_mflops;
                flopsDisplay = m >= 1000 ? (m/1000).toFixed(1) + 'G' : m >= 1 ? m.toFixed(1) + 'M' : (m*1000).toFixed(0) + 'K';
            }
            
            const exp = module.explanation ? module.explanation.replace(/\n/g, '<br>') : "Passes tensor through architecture layer.";

            let stepCodeLines = [];
            if (module.graph_nodes && module.graph_nodes.length > 0) {
                module.graph_nodes.forEach(n => {
                    let snippet = nodeToPyTorch(n);
                    if (snippet && !snippet.startsWith("#")) {
                        stepCodeLines.push(`self.${n.id} = ${snippet}`);
                    }
                });
            }
            if (stepCodeLines.length === 0) stepCodeLines.push("# Custom block needed");
            const stepCode = stepCodeLines.join("\\n");

            content.innerHTML = `
                <div class="animate-fade-in" style="max-width: 900px; margin: 0 auto; width: 100%;">
                    <div class="text-center mb-8">
                        <span class="badge mb-2">${module.module_type}</span>
                        <h2 style="font-size: 2rem;">${module.layer_name}</h2>
                    </div>
                    <div class="grid-cols-2 gap-8 mb-8">
                        <div>
                            <h4 class="font-heading text-lg mb-2" style="color: var(--accent-cnn);">Tensor Transformation</h4>
                            <div class="tensor-journey-container" style="flex-direction: column; padding: var(--space-2);">
                                <div class="text-sm font-mono">${inShape}</div>
                                <i class="fa-solid fa-arrow-down tensor-arrow"></i>
                                <div class="text-sm font-mono">${outShape}</div>
                            </div>
                        </div>
                        <div>
                            <h4 class="font-heading text-lg mb-2" style="color: var(--accent-transformer);">Why & Cost?</h4>
                            <div class="text-muted text-sm mb-4">${exp}</div>
                            <div class="metric-card" style="padding: var(--space-2);">
                                <div class="metric-label"><i class="fa-solid fa-bolt"></i> Cost</div>
                                <div class="metric-value text-lg">${flopsDisplay} FLOPs</div>
                            </div>
                        </div>
                    </div>
                    <div class="editor-pane" style="padding: 0;">
                        <div class="editor-header">
                            <span><i class="fa-brands fa-python" style="color: #4e9a06; margin-right: 8px;"></i> PyTorch Code</span>
                        </div>
                        <div id="walkthrough-editor" class="monaco-container" style="min-height: 150px; width: 100%;"></div>
                    </div>
                </div>
            `;
            
            setTimeout(() => {
                initMonaco('walkthrough-editor', stepCode, true);
            }, 50);
        }

                    `;

                return;

            try {
                const [resA, resB] = await Promise.all([
                    fetch(`/api/papers/${query.a}`),

                const paperB = await resB.json();

                const typeA = getArchClass(paperA.metadata.architecture_type);

                const knowA = compareKnowledge[typeA] || compareKnowledge['cnn'];
                const knowB = compareKnowledge[typeB] || compareKnowledge['cnn'];

                function buildPipeline(modules) {

                appContainer.innerHTML = `

                        <div class="split-header">
                            <h1 style="font-size: 2.5rem; margin-bottom: 8px;">Architecture Comparison Lab</h1>
                            <p class="text-muted">Analyzing structural, mathematical, and philosophical tradeoffs.</p>
                        </div>
                        
                        <div class="split-layout mb-8">
                            <div class="split-col" style="border-top: 4px solid ${getArchColor(typeA)}">
                                <h2>${paperA.metadata.title}</h2>
                                <span class="badge badge-${typeA} mb-2" style="width: fit-content;">${paperA.metadata.architecture_type}</span>
                                <ul class="feature-list mt-4">
                                    ${knowA.dna.map(d => `<li><i class="fa-solid fa-check text-muted"></i> ${d}</li>`).join('')}
                                </ul>
                            </div>
                            <div class="split-col" style="border-top: 4px solid ${getArchColor(typeB)}">
                                <h2>${paperB.metadata.title}</h2>
                                <span class="badge badge-${typeB} mb-2" style="width: fit-content;">${paperB.metadata.architecture_type}</span>
                                <ul class="feature-list mt-4">
                                    ${knowB.dna.map(d => `<li><i class="fa-solid fa-check text-muted"></i> ${d}</li>`).join('')}
                                </ul>
                            </div>
                        </div>

                        <h3 class="mb-4 font-heading text-lg"><i class="fa-solid fa-chart-pie mr-2"></i> Metric Comparison</h3>
                        <div class="split-layout mb-8">
                            <div class="card" style="display:flex; justify-content:center; align-items:center; height: 350px;">
                                <canvas id="radarChart"></canvas>
                            </div>
                            <div class="card" style="display:flex; justify-content:center; align-items:center; height: 350px;">
                                <canvas id="barChart"></canvas>
                            </div>
                        </div>

                        <h3 class="mb-4 font-heading text-lg"><i class="fa-solid fa-scale-balanced mr-2"></i> Design Tradeoffs</h3>
                        <div class="split-layout mb-8">
                            <div class="split-col">
                                <h4 class="mb-2" style="color: ${getArchColor(typeA)}"><i class="fa-solid fa-thumbs-up mr-2"></i>Advantages</h4>
                                <ul class="feature-list mb-4">
                                    ${knowA.advantages.map(d => `<li><i class="fa-solid fa-plus text-muted"></i> ${d}</li>`).join('')}
                                </ul>
                                <h4 class="mb-2 text-muted"><i class="fa-solid fa-thumbs-down mr-2"></i>Limitations</h4>
                                <ul class="feature-list">
                                    ${knowA.limitations.map(d => `<li><i class="fa-solid fa-minus text-muted"></i> ${d}</li>`).join('')}
                                </ul>
                                <div class="mt-4 pt-4" style="border-top: 1px solid var(--color-border-subtle);">
                                    <h4 class="text-sm text-muted uppercase font-semibold mb-2">Best For</h4>
                                    <p class="text-sm font-semibold">${knowA.useCases}</p>
                                </div>
                            </div>
                            <div class="split-col">
                                <h4 class="mb-2" style="color: ${getArchColor(typeB)}"><i class="fa-solid fa-thumbs-up mr-2"></i>Advantages</h4>
                                <ul class="feature-list mb-4">
                                    ${knowB.advantages.map(d => `<li><i class="fa-solid fa-plus text-muted"></i> ${d}</li>`).join('')}
                                </ul>
                                <h4 class="mb-2 text-muted"><i class="fa-solid fa-thumbs-down mr-2"></i>Limitations</h4>
                                <ul class="feature-list">
                                    ${knowB.limitations.map(d => `<li><i class="fa-solid fa-minus text-muted"></i> ${d}</li>`).join('')}
                                </ul>
                                <div class="mt-4 pt-4" style="border-top: 1px solid var(--color-border-subtle);">
                                    <h4 class="text-sm text-muted uppercase font-semibold mb-2">Best For</h4>
                                    <p class="text-sm font-semibold">${knowB.useCases}</p>
                                </div>
                            </div>
                        </div>

                        <h3 class="mb-4 font-heading text-lg"><i class="fa-solid fa-project-diagram mr-2"></i> Visual Graph & Tensor Flow</h3>
                        <div class="split-layout mb-8">
                            <div class="split-col">
                                <div class="cy-container" id="cy-a" style="height: 300px; border:none; border-bottom:1px solid var(--color-border); border-radius:0;"></div>
                                <div class="p-4" style="height: 400px; overflow-y: auto;">
                                    <h4 class="text-center font-heading text-sm text-muted uppercase mb-4">Tensor Flow Pipeline</h4>
                                    ${buildPipeline(paperA.module_summary)}
                                </div>
                            </div>
                            <div class="split-col">
                                <div class="cy-container" id="cy-b" style="height: 300px; border:none; border-bottom:1px solid var(--color-border); border-radius:0;"></div>
                                <div class="p-4" style="height: 400px; overflow-y: auto;">
                                    <h4 class="text-center font-heading text-sm text-muted uppercase mb-4">Tensor Flow Pipeline</h4>
                                    ${buildPipeline(paperB.module_summary)}
                                </div>
                            </div>
                        </div>

                        <h3 class="mb-4 font-heading text-lg"><i class="fa-solid fa-clipboard-question mr-2"></i> Interview Mode</h3>
                        <p class="text-muted mb-4">Test your knowledge. Click to reveal the answer.</p>
                        <div class="grid-cols-2 gap-4 mb-8">
                            ${interviewQuestions.map(iq => `
                                <div class="flashcard" onclick="toggleFlashcard(this)">
                                    <div class="flashcard-q">${iq.q}</div>
                                    <div class="flashcard-a">${iq.a}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                Chart.defaults.color = '#9CA3AF';
                Chart.defaults.font.family = 'Inter';

                const maxParams = Math.max(paperA.parameter_count, paperB.parameter_count) || 1;
                const maxFlops = Math.max(paperA.flops, paperB.flops) || 1;
                const maxDepth = Math.max(paperA.architecture_statistics.depth, paperB.architecture_statistics.depth) || 1;
                const maxNodes = Math.max(paperA.architecture_statistics.node_count, paperB.architecture_statistics.node_count) || 1;

                new Chart(document.getElementById('radarChart'), {
                    type: 'radar',
                    data: {
                        labels: ['Parameters', 'FLOPs', 'Depth', 'Graph Size'],
                        datasets: [
                            {
                                label: paperA.metadata.title,
                                data: [
                                    (paperA.parameter_count / maxParams) * 100,
                                    (paperA.flops / maxFlops) * 100,
                                    (paperA.architecture_statistics.depth / maxDepth) * 100,
                                    (paperA.architecture_statistics.node_count / maxNodes) * 100
                                ],
                                backgroundColor: getArchColor(typeA) + '33',
                                borderColor: getArchColor(typeA),
                                pointBackgroundColor: getArchColor(typeA)
                            },
                            {
                                label: paperB.metadata.title,
                                data: [
                                    (paperB.parameter_count / maxParams) * 100,
                                    (paperB.flops / maxFlops) * 100,
                                    (paperB.architecture_statistics.depth / maxDepth) * 100,
                                    (paperB.architecture_statistics.node_count / maxNodes) * 100
                                ],
                                backgroundColor: getArchColor(typeB) + '33',
                                borderColor: getArchColor(typeB),
                                pointBackgroundColor: getArchColor(typeB)
                            }
                        ]
                    },
                    options: {
                        scales: { r: { min: 0, max: 100, ticks: { display: false }, grid: { color: '#374151' }, angleLines: { color: '#374151' } } },
                        plugins: { legend: { position: 'bottom' } }
                    }
                });

                new Chart(document.getElementById('barChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Parameters (Raw)', 'FLOPs (Raw)'],
                        datasets: [
                            {
                                label: paperA.metadata.title,
                                data: [paperA.parameter_count, paperA.flops],
                                backgroundColor: getArchColor(typeA)
                            },
                            {
                                label: paperB.metadata.title,
                                data: [paperB.parameter_count, paperB.flops],
                                backgroundColor: getArchColor(typeB)
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: { y: { type: 'logarithmic', grid: { color: '#374151' } }, x: { grid: { color: '#374151' } } },
                        plugins: { legend: { position: 'bottom' } }
                    }
                });

                setTimeout(() => {
                    renderGraph('cy-a', paperA.architecture_graph, null, 'compute');
                    renderGraph('cy-b', paperB.architecture_graph, null, 'compute');
                }, 100);

            } catch(err) {
                appContainer.innerHTML = `<div class="card text-center"><p class="text-muted">Failed to load comparison: ${err.message}</p></div>`;
            }
        }

        // --- Router ---
        function parseRoute(hash) {
            const hashParts = hash.split('?');
            const path = hashParts[0].slice(1) || '/';
            const queryStr = hashParts[1] || '';
            const query = {};
            queryStr.split('&').forEach(p => { const [k,v] = p.split('='); if(k) query[k]=v; });

            if (path === '/compare') return { handler: renderComparePage, params: {}, query };
            const journeyMatch = path.match(/^\/papers\/(\d+)\/journey$/);
            if (journeyMatch) return { handler: renderJourneyPage, params: { id: journeyMatch[1] }, query };
            const moduleMatch = path.match(/^\/papers\/(\d+)\/modules\/(\d+)$/);
            if (moduleMatch) return { handler: renderModulePage, params: { paper_id: moduleMatch[1], module_id: moduleMatch[2] }, query };
            const paperMatch = path.match(/^\/papers\/(\d+)$/);
            if (paperMatch) return { handler: renderOverviewPage, params: { id: paperMatch[1] }, query };
            return { handler: renderLibraryPage, params: {}, query };
        }

        function router() {
            const { handler, params, query } = parseRoute(window.location.hash);
            if (handler) handler(params, query);
        }

        window.addEventListener('hashchange', router);
        // Run immediately — DOM is ready since this script is at the end of <body>
        router();
    </script>
</body>
</html>
