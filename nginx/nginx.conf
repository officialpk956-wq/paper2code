# Paper2Code — Nginx reverse proxy
#
# TLS termination: mount your certs at /etc/nginx/certs/fullchain.pem + privkey.pem
# For Let's Encrypt: certbot certonly --standalone -d yourdomain.com
#
# Rate limiting: 10 req/s per IP (burst 30) on all /api routes
# Gzip: on for JSON, JS, CSS, HTML
# /metrics: internal IPs only

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 25M;

    # ── Rate limiting ────────────────────────────────────────────────────────
    # 10 req/s per IP; burst of 30 allowed before 429
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        image/svg+xml;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect (production) ───────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow ACME challenge (Let's Encrypt)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS (production) ────────────────────────────────────────────────────
    # Uncomment this block when TLS certs are available
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name yourdomain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #
    #     location / {
    #         limit_req zone=api burst=30 nodelay;
    #         proxy_pass http://api;
    #         proxy_http_version 1.1;
    #         proxy_set_header Connection "";
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #         proxy_read_timeout 300s;
    #         proxy_connect_timeout 10s;
    #         proxy_send_timeout 300s;
    #     }
    #
    #     location /metrics {
    #         allow 10.0.0.0/8;
    #         allow 172.16.0.0/12;
    #         allow 192.168.0.0/16;
    #         deny all;
    #         proxy_pass http://api;
    #     }
    # }

    # ── HTTP (development / local) ────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        location / {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
        }

        # /metrics — internal IPs only
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://api;
        }

        # Flower dashboard — not exposed publicly
        location /flower/ {
            return 403;
        }
    }
}
