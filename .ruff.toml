[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "venv", "tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "PT"]
ignore = ["E501"]  # let Black/Ruff formatter handle line lengths

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
