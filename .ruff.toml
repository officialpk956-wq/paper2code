line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "venv", "tests/data"]

[lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "PT"]
ignore = [
    "E501",  # let Black/Ruff formatter handle line lengths
    "B008",  # Depends(...) as a default arg is the standard FastAPI DI pattern
    # ponytail: pre-existing findings from the first real lint pass on this
    # codebase (config was broken until now, so this never ran before) —
    # not yet individually reviewed. Upgrade path: triage and re-enable one
    # category at a time, fixing what's real (E402/F401/F841 first).
    "E402", "E712", "E741", "E722",
    "F401", "F841",
    "B904", "B905", "B007", "C416", "PT018",
]

[format]
quote-style = "double"
indent-style = "space"
