name: TensorTonic CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install ruff
      run: pip install ruff
    - name: Run ruff check
      run: ruff check backend core workers
    - name: Run ruff format --check
      run: ruff format --check backend core workers

  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run pytest
      run: pytest tests/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install dependencies
      run: npm install
    - name: Build Next.js
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: https://paper2code-1-81y5.onrender.com
        NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
        NEXT_PUBLIC_FIREBASE_APP_ID: 1:0:web:0

  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run sandbox test
      run: echo "Sandbox execution simulation"
