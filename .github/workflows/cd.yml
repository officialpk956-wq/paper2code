name: CD

on:
  workflow_run:
    workflows: ["Paper2Code CI"]
    branches: [main, master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -s requirements.in ]; then pip install -r requirements.in; fi

      - name: Build release bundle
        shell: bash
        run: |
          mkdir -p dist
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./data' \
            --exclude='./models' \
            --exclude='./outputs' \
            --exclude='./notebooks' \
            --exclude='./experiments' \
            -czf dist/paper2code-${{ github.sha }}.tar.gz .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper2code-bundle
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Trigger deployment webhook
        if: ${{ secrets.DEPLOY_WEBHOOK_URL != '' }}
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          curl -sS -X POST "$DEPLOY_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"sha\":\"$SHA\",\"ref\":\"$REF_NAME\",\"repo\":\"${{ github.repository }}\"}"

      - name: Skip deploy note
        if: ${{ secrets.DEPLOY_WEBHOOK_URL == '' }}
        run: echo "DEPLOY_WEBHOOK_URL is not configured. Packaging completed; deployment skipped."
