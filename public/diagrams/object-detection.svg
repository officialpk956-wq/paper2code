<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrdet" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrdety" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Two-stage family header -->
  <text x="210" y="18" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">TWO-STAGE (accurate, slower)</text>
  <text x="560" y="18" font-family="monospace" font-size="9" fill="#f59e0b" text-anchor="middle">ONE-STAGE (faster, real-time)</text>
  <line x1="400" y1="10" x2="400" y2="190" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- R-CNN -->
  <rect x="10" y="25" width="95" height="55" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="58" y="44" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">R-CNN</text>
  <text x="58" y="58" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">2000 RoI crops</text>
  <text x="58" y="70" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2014 · 47s/img</text>

  <line x1="105" y1="52" x2="123" y2="52" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrdet)"/>

  <!-- Fast R-CNN -->
  <rect x="125" y="25" width="95" height="55" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="173" y="44" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Fast R-CNN</text>
  <text x="173" y="58" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">shared CNN</text>
  <text x="173" y="70" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2015 · 2s/img</text>

  <line x1="220" y1="52" x2="238" y2="52" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrdet)"/>

  <!-- Faster R-CNN -->
  <rect x="240" y="25" width="110" height="55" rx="5" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
  <text x="295" y="44" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Faster R-CNN</text>
  <text x="295" y="58" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">RPN + shared CNN</text>
  <text x="295" y="70" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2015 · 200ms/img</text>

  <!-- DETR -->
  <rect x="240" y="100" width="110" height="65" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="120" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">DETR</text>
  <text x="295" y="135" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Transformer end-to-end</text>
  <text x="295" y="148" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">no NMS needed</text>
  <text x="295" y="158" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">FAIR 2020</text>

  <!-- YOLO family -->
  <rect x="420" y="25" width="90" height="55" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="465" y="44" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">YOLOv1</text>
  <text x="465" y="58" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">7×7 grid cells</text>
  <text x="465" y="70" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2015 · 45fps</text>

  <line x1="510" y1="52" x2="528" y2="52" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrdety)"/>

  <!-- YOLOv3 -->
  <rect x="530" y="25" width="90" height="55" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="575" y="44" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">YOLOv3</text>
  <text x="575" y="58" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">multi-scale anchors</text>
  <text x="575" y="70" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2018 · 65fps</text>

  <!-- YOLOv8 / RT-DETR -->
  <rect x="420" y="100" width="90" height="65" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="465" y="120" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">YOLOv8</text>
  <text x="465" y="135" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">anchor-free</text>
  <text x="465" y="148" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">decoupled head</text>
  <text x="465" y="158" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Ultralytics 2023</text>

  <rect x="530" y="100" width="90" height="65" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="575" y="120" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">RT-DETR</text>
  <text x="575" y="135" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Transformer</text>
  <text x="575" y="148" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">real-time speed</text>
  <text x="575" y="158" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Baidu 2023</text>

  <text x="360" y="188" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">47s/img (R-CNN 2014) → 200ms (Faster 2015) → 22ms (YOLOv8 2023)</text>
</svg>
