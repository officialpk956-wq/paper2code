<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-vision { stroke: #0ea5e9; fill: #0ea5e9; fill-opacity: 0.1; }
    .box-text { stroke: #10b981; fill: #10b981; fill-opacity: 0.1; }
    .box-connector { stroke: #f59e0b; }
    .box-llm { stroke: #7c3aed; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Multimodal Architecture (LLaVA / Flamingo Style)</text>

  <!-- Vision Pathway -->
  <rect x="40" y="50" width="100" height="40" class="box box-vision" />
  <text x="90" y="70" fill="#0ea5e9">Image Input</text>
  <line x1="140" y1="70" x2="180" y2="70" class="arrow"/>

  <rect x="180" y="50" width="120" height="40" class="box box-vision" />
  <text x="240" y="70" fill="#0ea5e9">Vision Encoder</text>
  <text x="240" y="105" class="label">(CLIP ViT)</text>
  <line x1="300" y1="70" x2="340" y2="70" class="arrow"/>

  <!-- Modality Connector -->
  <rect x="340" y="50" width="120" height="40" class="box box-connector" />
  <text x="400" y="70">Modality Conn.</text>
  <text x="400" y="105" class="label">(MLP / Q-Former)</text>

  <!-- Text Pathway -->
  <rect x="40" y="140" width="100" height="40" class="box box-text" />
  <text x="90" y="160" fill="#10b981">Text Prompt</text>
  <line x1="140" y1="160" x2="180" y2="160" class="arrow"/>

  <rect x="180" y="140" width="120" height="40" class="box box-text" />
  <text x="240" y="160" fill="#10b981">Tokenizer</text>

  <!-- Both connect to LLM -->
  <line x1="460" y1="70" x2="520" y2="100" class="arrow"/>
  <line x1="300" y1="160" x2="520" y2="120" class="arrow"/>

  <!-- LLM Decoder -->
  <rect x="520" y="80" width="120" height="60" class="box box-llm" />
  <text x="580" y="100">LLM Decoder</text>
  <text x="580" y="120" class="label">(Llama / Vicuna)</text>

  <!-- Output -->
  <line x1="640" y1="110" x2="680" y2="110" class="arrow"/>
  <text x="690" y="110" font-weight="bold">Output</text>
  
</svg>
