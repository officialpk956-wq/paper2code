<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrlf" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Full Fine-tuning (problematic) -->
  <rect x="10" y="20" width="140" height="90" rx="6" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="80" y="40" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Full Fine-tuning</text>
  <text x="80" y="57" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">update all 70B params</text>
  <text x="80" y="70" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">~140GB optimizer state</text>
  <text x="80" y="83" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">catastrophic forgetting</text>
  <text x="80" y="96" font-family="monospace" font-size="7" fill="#ef4444" text-anchor="middle">impractical for most</text>

  <line x1="150" y1="65" x2="168" y2="65" stroke="#374151" stroke-width="1.5" marker-end="url(#arrlf)"/>

  <!-- LoRA -->
  <rect x="170" y="10" width="155" height="120" rx="6" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
  <text x="248" y="30" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle">LoRA</text>
  <text x="248" y="47" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">W → W₀ + BA</text>
  <text x="248" y="62" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">W₀ frozen (original)</text>
  <text x="248" y="77" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">B ∈ R^{d×r}, A ∈ R^{r×k}</text>
  <text x="248" y="92" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">r=8: 0.01% of params</text>
  <text x="248" y="107" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">merge at inference: 0 overhead</text>
  <text x="248" y="120" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Hu et al. 2021</text>

  <line x1="325" y1="65" x2="343" y2="65" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrlf)"/>

  <!-- QLoRA -->
  <rect x="345" y="10" width="155" height="120" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="2"/>
  <text x="423" y="30" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">QLoRA</text>
  <text x="423" y="47" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">4-bit NF4 base model</text>
  <text x="423" y="62" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">+ LoRA adapters (bf16)</text>
  <text x="423" y="77" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">double quantization</text>
  <text x="423" y="92" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">65B on 1×A100 (48GB)</text>
  <text x="423" y="107" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">paged AdamW optimizer</text>
  <text x="423" y="120" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Dettmers et al. 2023</text>

  <line x1="500" y1="65" x2="518" y2="65" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrlf)"/>

  <!-- Other PEFT Methods -->
  <rect x="520" y="10" width="190" height="120" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="615" y="30" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Other PEFT Methods</text>
  <text x="615" y="48" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Prefix Tuning</text>
  <text x="615" y="61" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">prepend trainable tokens</text>
  <text x="615" y="76" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Adapters</text>
  <text x="615" y="89" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">bottleneck MLP in each layer</text>
  <text x="615" y="104" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">DoRA</text>
  <text x="615" y="117" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">decompose magnitude+direction</text>

  <!-- Instruction tuning vs RLHF row -->
  <rect x="10" y="145" width="215" height="55" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="118" y="163" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">Instruction Tuning (SFT)</text>
  <text x="118" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">{"[INST] {prompt} [/INST] {response}"}</text>
  <text x="118" y="191" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">FLAN, Alpaca, OpenHermes</text>

  <rect x="238" y="145" width="215" height="55" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="345" y="163" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">DPO (Direct Pref. Opt.)</text>
  <text x="345" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">bypasses reward model entirely</text>
  <text x="345" y="191" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">preference pairs → single loss</text>

  <rect x="466" y="145" width="244" height="55" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="588" y="163" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Merge (SLERP / TIES / DARE)</text>
  <text x="588" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">combine multiple fine-tuned models</text>
  <text x="588" y="191" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">no extra training needed</text>
</svg>
