<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .curve { fill: none; stroke: #0ea5e9; stroke-width: 3; }
    .axis { stroke: #4b5563; stroke-width: 2; }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
    .zero { stroke: #10b981; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Advanced Training: LR Schedules &amp; ZeRO</text>

  <!-- Learning Rate Schedule -->
  <text x="160" y="50" class="label">LR Schedule (Warmup + Cosine Decay)</text>
  <line x1="40" y1="160" x2="280" y2="160" class="axis"/>
  <line x1="40" y1="160" x2="40" y2="60" class="axis"/>
  
  <text x="30" y="60">LR</text>
  <text x="280" y="170">Steps</text>

  <!-- Warmup -->
  <path d="M 40 160 L 80 70" class="curve"/>
  <!-- Cosine Annealing -->
  <path d="M 80 70 C 140 70, 200 160, 260 160" class="curve"/>

  <text x="70" y="140" class="label">Warmup</text>
  <text x="180" y="100" class="label">Cosine Annealing</text>

  <!-- Vertical Divider -->
  <line x1="320" y1="40" x2="320" y2="180" stroke="#4b5563" stroke-dasharray="4"/>

  <!-- ZeRO Optimizer States -->
  <text x="520" y="50" class="label">ZeRO (Zero Redundancy Optimizer)</text>

  <rect x="360" y="70" width="100" height="30" class="box" fill="#1a1d24"/>
  <text x="410" y="85">Data Par.</text>

  <rect x="360" y="110" width="100" height="30" class="box zero"/>
  <text x="410" y="125">ZeRO-1</text>
  
  <rect x="360" y="150" width="100" height="30" class="box zero"/>
  <text x="410" y="165">ZeRO-3</text>

  <rect x="480" y="70" width="200" height="30" class="box" stroke="#ef4444" fill="#ef4444" fill-opacity="0.1"/>
  <text x="580" y="85" fill="#ef4444">All GPUs hold all Optimizer States</text>

  <rect x="480" y="110" width="200" height="30" class="box" stroke="#f59e0b" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="580" y="125" fill="#f59e0b">Partitions Optimizer States</text>

  <rect x="480" y="150" width="200" height="30" class="box" stroke="#10b981" fill="#10b981" fill-opacity="0.1"/>
  <text x="580" y="165" fill="#10b981">Partitions Opt, Grads, and Weights</text>

</svg>
