<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="220" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arru" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Rider -->
  <rect x="10" y="90" width="90" height="40" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="55" y="107" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Rider</text>
  <text x="55" y="121" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">requests ride</text>

  <!-- Supply Service -->
  <rect x="130" y="60" width="110" height="50" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="185" y="80" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Supply Service</text>
  <text x="185" y="95" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Redis + H3 cells</text>
  <text x="185" y="107" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">driver locations</text>

  <!-- Matching Service -->
  <rect x="270" y="60" width="110" height="50" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="325" y="80" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Matching</text>
  <text x="325" y="95" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">rank by ETA</text>
  <text x="325" y="107" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">+ rating + type</text>

  <!-- ETA Service -->
  <rect x="270" y="140" width="110" height="40" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="325" y="157" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">ETA Service</text>
  <text x="325" y="171" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">road graph + traffic</text>

  <!-- Offer Service -->
  <rect x="410" y="60" width="110" height="50" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="465" y="80" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Offer Service</text>
  <text x="465" y="95" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">push to driver</text>
  <text x="465" y="107" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">accept / decline</text>

  <!-- Driver -->
  <rect x="560" y="90" width="100" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="610" y="107" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Driver</text>
  <text x="610" y="121" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">accepts</text>

  <!-- Driver GPS update -->
  <rect x="130" y="150" width="110" height="40" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="185" y="167" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">GPS every 4s</text>
  <text x="185" y="181" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">Kafka → Redis</text>

  <!-- Arrows -->
  <line x1="100" y1="110" x2="128" y2="90" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arru)"/>
  <line x1="240" y1="85" x2="268" y2="85" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arru)"/>
  <line x1="325" y1="110" x2="325" y2="138" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arru)"/>
  <line x1="380" y1="85" x2="408" y2="85" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arru)"/>
  <line x1="520" y1="85" x2="558" y2="108" stroke="#10b981" stroke-width="1.5" marker-end="url(#arru)"/>
  <line x1="185" y1="190" x2="185" y2="112" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arru)"/>
</svg>
