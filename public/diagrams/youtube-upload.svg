<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arry" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Upload path (top row) -->
  <text x="10" y="30" font-family="monospace" font-size="10" fill="#9ca3af">UPLOAD PATH</text>

  <rect x="10" y="40" width="90" height="40" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="55" y="57" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Creator</text>
  <text x="55" y="70" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Upload</text>

  <rect x="130" y="40" width="90" height="40" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="175" y="57" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Ingestion</text>
  <text x="175" y="70" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">raw file</text>

  <rect x="250" y="40" width="110" height="40" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="305" y="57" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Transcoding</text>
  <text x="305" y="70" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">360/480/720/1080/4K</text>

  <rect x="390" y="40" width="90" height="40" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="435" y="57" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Colossus</text>
  <text x="435" y="70" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Storage</text>

  <rect x="510" y="40" width="90" height="40" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="555" y="57" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">CDN Edge</text>
  <text x="555" y="70" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">PoPs</text>

  <rect x="630" y="40" width="80" height="40" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="670" y="57" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Viewer</text>
  <text x="670" y="70" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Streams</text>

  <line x1="100" y1="60" x2="128" y2="60" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arry)"/>
  <line x1="220" y1="60" x2="248" y2="60" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arry)"/>
  <line x1="360" y1="60" x2="388" y2="60" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arry)"/>
  <line x1="480" y1="60" x2="508" y2="60" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arry)"/>
  <line x1="600" y1="60" x2="628" y2="60" stroke="#10b981" stroke-width="1.5" marker-end="url(#arry)"/>

  <!-- Recommendation path (bottom row) -->
  <text x="10" y="125" font-family="monospace" font-size="10" fill="#9ca3af">RECOMMENDATION FUNNEL</text>

  <rect x="10" y="135" width="120" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="152" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">800M videos</text>
  <text x="70" y="166" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">collab filter → 1K</text>

  <rect x="160" y="135" width="120" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="220" y="152" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">DNN Ranking</text>
  <text x="220" y="166" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">top-1K → top-50</text>

  <rect x="310" y="135" width="120" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="370" y="152" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Diversity Filter</text>
  <text x="370" y="166" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">top-50 → top-20</text>

  <rect x="460" y="135" width="100" height="40" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="510" y="152" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Home Feed</text>
  <text x="510" y="166" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">20 videos</text>

  <line x1="130" y1="155" x2="158" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arry)"/>
  <line x1="280" y1="155" x2="308" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arry)"/>
  <line x1="430" y1="155" x2="458" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arry)"/>
</svg>
