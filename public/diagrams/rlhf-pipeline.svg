<svg viewBox="0 0 660 230" xmlns="http://www.w3.org/2000/svg">
  <rect width="660" height="230" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Stage 1: Pretraining -->
  <rect x="10" y="90" width="120" height="50" rx="6" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="70" y="110" font-family="monospace" font-size="10" fill="#9ca3af" text-anchor="middle">Stage 1</text>
  <text x="70" y="125" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">GPT-4 Base</text>
  <text x="70" y="138" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">pretraining</text>

  <!-- Arrow -->
  <line x1="130" y1="115" x2="158" y2="115" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrr)"/>

  <!-- Stage 2: SFT -->
  <rect x="160" y="90" width="130" height="50" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="225" y="110" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Stage 2</text>
  <text x="225" y="125" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">SFT Fine-tune</text>
  <text x="225" y="138" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">human demos</text>

  <!-- Arrow -->
  <line x1="290" y1="115" x2="318" y2="115" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrr)"/>

  <!-- Stage 3: Reward Model -->
  <rect x="320" y="60" width="130" height="50" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="385" y="80" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">Stage 3a</text>
  <text x="385" y="95" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Reward Model</text>
  <text x="385" y="108" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">human rankings</text>

  <rect x="320" y="130" width="130" height="50" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="385" y="150" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">Stage 3b</text>
  <text x="385" y="165" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">PPO Training</text>
  <text x="385" y="178" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">optimize reward</text>

  <line x1="325" y1="115" x2="325" y2="128" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrr)"/>
  <line x1="450" y1="85" x2="460" y2="115" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="450" y1="155" x2="488" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrr)"/>

  <!-- ChatGPT output -->
  <rect x="490" y="90" width="120" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="550" y="110" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">ChatGPT</text>
  <text x="550" y="125" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Aligned LLM</text>
  <text x="550" y="138" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">helpful + safe</text>

  <line x1="450" y1="115" x2="488" y2="115" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrr)"/>

  <!-- Title -->
  <text x="330" y="210" font-family="monospace" font-size="10" fill="#6b7280" text-anchor="middle">The RLHF training pipeline: Base → SFT → Reward Model → PPO → ChatGPT</text>
</svg>
