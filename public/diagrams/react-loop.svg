<svg viewBox="0 0 580 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="240" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- Task input -->
  <rect x="10" y="100" width="80" height="40" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="50" y="116" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">User</text>
  <text x="50" y="129" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Task</text>

  <!-- Reason box -->
  <rect x="130" y="80" width="80" height="40" rx="6" fill="#312e81" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="170" y="96" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">REASON</text>
  <text x="170" y="110" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">LLM thinks</text>

  <!-- Act box -->
  <rect x="250" y="80" width="80" height="40" rx="6" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="290" y="96" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">ACT</text>
  <text x="290" y="110" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">tool call</text>

  <!-- Tool execution -->
  <rect x="250" y="160" width="80" height="40" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="290" y="176" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">TOOL</text>
  <text x="290" y="190" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">executes</text>

  <!-- Observe box -->
  <rect x="370" y="80" width="80" height="40" rx="6" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="410" y="96" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">OBSERVE</text>
  <text x="410" y="110" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">result</text>

  <!-- Final answer -->
  <rect x="490" y="100" width="80" height="40" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="530" y="116" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">ANSWER</text>
  <text x="530" y="129" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">final</text>

  <!-- Arrows -->
  <line x1="90" y1="120" x2="128" y2="105" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="210" y1="100" x2="248" y2="100" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="290" y1="120" x2="290" y2="158" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="330" y1="180" x2="410" y2="125" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="450" y1="100" x2="488" y2="112" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr3)"/>
  <!-- Loop back arrow -->
  <path d="M 410,80 Q 290,20 170,78" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr2)"/>
  <text x="290" y="30" font-family="monospace" font-size="9" fill="#7c3aed" text-anchor="middle">loop until done</text>
</svg>
