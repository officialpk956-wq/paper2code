<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-wide { stroke: #0ea5e9; }
    .box-deep { stroke: #7c3aed; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Wide &amp; Deep Architecture</text>

  <!-- Input Layer -->
  <rect x="40" y="80" width="80" height="40" class="box" />
  <text x="80" y="100">Features</text>
  <text x="80" y="135" class="label">User/Item</text>

  <path d="M 120 100 L 160 60 L 180 60" fill="none" class="arrow"/>
  <path d="M 120 100 L 160 140 L 180 140" fill="none" class="arrow"/>

  <!-- Wide Component -->
  <rect x="180" y="40" width="120" height="40" class="box box-wide" />
  <text x="240" y="60">Cross-Product</text>
  <text x="240" y="90" class="label" fill="#0ea5e9">Memorization</text>
  
  <line x1="300" y1="60" x2="480" y2="80" class="arrow"/>

  <!-- Deep Component -->
  <rect x="180" y="120" width="100" height="40" class="box box-deep" />
  <text x="230" y="140">Embeddings</text>
  <line x1="280" y1="140" x2="320" y2="140" class="arrow"/>

  <rect x="320" y="120" width="100" height="40" class="box box-deep" />
  <text x="370" y="140">Hidden MLPs</text>
  <text x="370" y="170" class="label" fill="#7c3aed">Generalization</text>

  <line x1="420" y1="140" x2="480" y2="100" class="arrow"/>

  <!-- Output / Fusion -->
  <circle cx="500" cy="90" r="20" class="box" stroke="#f59e0b" />
  <text x="500" y="90" font-size="16px">+</text>

  <line x1="520" y1="90" x2="560" y2="90" class="arrow"/>

  <rect x="560" y="70" width="80" height="40" class="box" />
  <text x="600" y="90">Sigmoid</text>
  <text x="600" y="125" class="label">CTR Predict</text>

</svg>
