<svg viewBox="0 0 760 240" xmlns="http://www.w3.org/2000/svg">
  <rect width="760" height="240" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-ingest { stroke: #7c3aed; }
    .box-query { stroke: #10b981; }
    .arrow-ingest { stroke: #7c3aed; stroke-width: 2; marker-end: url(#arrow-ingest); }
    .arrow-query { stroke: #10b981; stroke-width: 2; marker-end: url(#arrow-query); }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrow-ingest" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" />
    </marker>
    <marker id="arrow-query" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
  </defs>

  <text x="380" y="20" class="label">INGEST PIPELINE</text>
  <rect x="20" y="40" width="100" height="40" class="box box-ingest" />
  <text x="70" y="60">PDF/Docs</text>
  <line x1="120" y1="60" x2="150" y2="60" class="arrow-ingest"/>
  
  <rect x="150" y="40" width="100" height="40" class="box box-ingest" />
  <text x="200" y="60">Chunker</text>
  <line x1="250" y1="60" x2="280" y2="60" class="arrow-ingest"/>
  
  <rect x="280" y="40" width="140" height="40" class="box box-ingest" />
  <text x="350" y="60">Embedding Model</text>
  <line x1="420" y1="60" x2="450" y2="60" class="arrow-ingest"/>
  
  <rect x="450" y="40" width="120" height="40" class="box box-ingest" fill="#7c3aed" fill-opacity="0.2"/>
  <text x="510" y="60">Vector Store</text>

  <text x="380" y="130" class="label">QUERY PIPELINE</text>
  <rect x="20" y="150" width="100" height="40" class="box box-query" />
  <text x="70" y="170">User Query</text>
  <line x1="120" y1="170" x2="150" y2="170" class="arrow-query"/>
  
  <rect x="150" y="150" width="120" height="40" class="box box-query" />
  <text x="210" y="170">Embed Query</text>
  <line x1="270" y1="170" x2="300" y2="170" class="arrow-query"/>
  
  <rect x="300" y="150" width="120" height="40" class="box box-query" />
  <text x="360" y="170">Retrieve Top-K</text>
  <line x1="420" y1="170" x2="450" y2="170" class="arrow-query"/>
  
  <rect x="450" y="150" width="140" height="40" class="box box-query" />
  <text x="520" y="170">Prompt + Context</text>
  <line x1="590" y1="170" x2="620" y2="170" class="arrow-query"/>

  <rect x="620" y="150" width="60" height="40" class="box box-query" />
  <text x="650" y="170">LLM</text>
  <line x1="680" y1="170" x2="710" y2="170" class="arrow-query"/>

  <rect x="710" y="150" width="30" height="40" fill="none"/>
  <text x="725" y="170" fill="#10b981">Ans.</text>

  <path d="M 510 80 L 510 110 L 360 110 L 360 150" fill="none" class="arrow-query" stroke-dasharray="4"/>
</svg>
