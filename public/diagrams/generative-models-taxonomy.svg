<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-enc { stroke: #0ea5e9; }
    .box-dec { stroke: #7c3aed; }
    .box-latent { stroke: #f59e0b; fill: #f59e0b; fill-opacity: 0.1; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Variational Autoencoder (VAE) Architecture</text>

  <!-- Input -->
  <rect x="20" y="80" width="60" height="40" class="box" />
  <text x="50" y="100">Input X</text>
  <line x1="80" y1="100" x2="120" y2="100" class="arrow"/>

  <!-- Encoder -->
  <polygon points="120,60 220,80 220,120 120,140" class="box box-enc" />
  <text x="160" y="100">Encoder</text>

  <line x1="220" y1="100" x2="260" y2="100" class="arrow"/>

  <!-- Distribution Parameters -->
  <rect x="260" y="60" width="60" height="30" class="box" />
  <text x="290" y="75">$\mu$</text>

  <rect x="260" y="110" width="60" height="30" class="box" />
  <text x="290" y="125">$\sigma$</text>

  <!-- Sampling / Latent Space -->
  <line x1="320" y1="75" x2="350" y2="100" class="arrow"/>
  <line x1="320" y1="125" x2="350" y2="100" class="arrow"/>

  <circle cx="400" cy="100" r="40" class="box box-latent" />
  <text x="400" y="90" font-weight="bold">Latent</text>
  <text x="400" y="110" font-weight="bold">Space Z</text>
  <text x="400" y="155" class="label">Reparameterization Trick</text>

  <!-- Decoder -->
  <line x1="440" y1="100" x2="480" y2="100" class="arrow"/>

  <polygon points="480,80 580,60 580,140 480,120" class="box box-dec" />
  <text x="540" y="100">Decoder</text>

  <!-- Output -->
  <line x1="580" y1="100" x2="620" y2="100" class="arrow"/>
  
  <rect x="620" y="80" width="80" height="40" class="box" />
  <text x="660" y="100">Output $X'$</text>

</svg>
