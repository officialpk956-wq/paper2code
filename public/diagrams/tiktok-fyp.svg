<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="220" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrt" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="350" y="20" font-family="monospace" font-size="11" fill="#9ca3af" text-anchor="middle">TikTok FYP: From 1B Videos to Your Next 20</text>

  <!-- Stage 1 -->
  <rect x="10" y="40" width="110" height="55" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="65" y="60" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">1B+ Videos</text>
  <text x="65" y="75" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">content signals</text>
  <text x="65" y="88" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">audio/hashtag/text</text>

  <!-- Stage 2 -->
  <rect x="150" y="40" width="130" height="55" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="215" y="60" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Multi-channel</text>
  <text x="215" y="75" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Retrieval</text>
  <text x="215" y="90" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">collab + content + trend</text>

  <!-- Stage 3 -->
  <rect x="310" y="40" width="120" height="55" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="370" y="60" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Deep Ranker</text>
  <text x="370" y="75" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">completion 50%</text>
  <text x="370" y="88" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">like 20% share 20%</text>

  <!-- Stage 4 -->
  <rect x="460" y="40" width="110" height="55" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="515" y="60" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Policy Filter</text>
  <text x="515" y="75" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">diversity</text>
  <text x="515" y="88" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">safety · dedup</text>

  <!-- Stage 5 -->
  <rect x="600" y="40" width="90" height="55" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="645" y="60" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Your FYP</text>
  <text x="645" y="75" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">15–20</text>
  <text x="645" y="90" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">videos</text>

  <line x1="120" y1="67" x2="148" y2="67" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="280" y1="67" x2="308" y2="67" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="430" y1="67" x2="458" y2="67" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="570" y1="67" x2="598" y2="67" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrt)"/>

  <!-- Real-time feature update pipeline -->
  <text x="10" y="125" font-family="monospace" font-size="10" fill="#9ca3af">REAL-TIME FEATURE UPDATE (sub-1 second)</text>
  <rect x="10" y="135" width="120" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="70" y="153" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">User Watches</text>
  <text x="70" y="167" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">completion event</text>

  <rect x="160" y="135" width="100" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="210" y="153" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Kafka</text>
  <text x="210" y="167" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">event bus</text>

  <rect x="290" y="135" width="110" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="345" y="153" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Flink Stream</text>
  <text x="345" y="167" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">processing</text>

  <rect x="430" y="135" width="100" height="40" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="153" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Redis</text>
  <text x="480" y="167" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">feature update</text>

  <rect x="560" y="135" width="110" height="40" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="615" y="153" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Ranker reads</text>
  <text x="615" y="167" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">fresh features</text>

  <line x1="130" y1="155" x2="158" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="260" y1="155" x2="288" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="400" y1="155" x2="428" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrt)"/>
  <line x1="530" y1="155" x2="558" y2="155" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrt)"/>
</svg>
