<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="220" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-ingest { stroke: #7c3aed; }
    .box-query { stroke: #06b6d4; }
    .arrow-ingest { stroke: #7c3aed; stroke-width: 2; marker-end: url(#arrow-ingest); }
    .arrow-query { stroke: #06b6d4; stroke-width: 2; marker-end: url(#arrow-query); }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrow-ingest" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" />
    </marker>
    <marker id="arrow-query" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#06b6d4" />
    </marker>
  </defs>

  <text x="340" y="20" class="label">INGEST PIPELINE</text>
  <rect x="20" y="40" width="80" height="40" class="box box-ingest" />
  <text x="60" y="60">Text</text>
  <line x1="100" y1="60" x2="130" y2="60" class="arrow-ingest"/>
  
  <rect x="130" y="40" width="100" height="40" class="box box-ingest" />
  <text x="180" y="60">Tokenizer</text>
  <line x1="230" y1="60" x2="260" y2="60" class="arrow-ingest"/>
  
  <rect x="260" y="40" width="160" height="40" class="box box-ingest" />
  <text x="340" y="60">Transformer Encoder</text>
  <line x1="420" y1="60" x2="450" y2="60" class="arrow-ingest"/>
  
  <rect x="450" y="40" width="80" height="40" class="box box-ingest" />
  <text x="490" y="60">Pooling</text>
  <line x1="530" y1="60" x2="560" y2="60" class="arrow-ingest"/>
  
  <rect x="560" y="40" width="100" height="40" class="box box-ingest" fill="#7c3aed" fill-opacity="0.2"/>
  <text x="610" y="60">Vector</text>

  <text x="340" y="130" class="label">QUERY PIPELINE</text>
  <rect x="20" y="150" width="120" height="40" class="box box-query" />
  <text x="80" y="170">Query Vector</text>
  <line x1="140" y1="170" x2="180" y2="170" class="arrow-query"/>
  
  <rect x="180" y="150" width="120" height="40" class="box box-query" />
  <text x="240" y="170">HNSW Index</text>
  <line x1="300" y1="170" x2="340" y2="170" class="arrow-query"/>
  
  <rect x="340" y="150" width="160" height="40" class="box box-query" />
  <text x="420" y="170">Distance Comp.</text>
  <line x1="500" y1="170" x2="540" y2="170" class="arrow-query"/>
  
  <rect x="540" y="150" width="120" height="40" class="box box-query" fill="#06b6d4" fill-opacity="0.2"/>
  <text x="600" y="170">Top-K Results</text>

  <path d="M 610 80 L 610 110 L 240 110 L 240 150" fill="none" class="arrow-query" stroke-dasharray="4"/>
</svg>
