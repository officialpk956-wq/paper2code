<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-code { stroke: #0ea5e9; }
    .box-mask { stroke: #ef4444; stroke-dasharray: 4; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .code { font-family: monospace; font-size: 12px; fill: #fcd34d; text-anchor: start; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Fill-In-The-Middle (FIM) Objective</text>

  <!-- Input Sequence -->
  <rect x="40" y="60" width="140" height="60" class="box box-code" />
  <text x="50" y="80" class="code">def add(a, b):</text>
  <text x="110" y="110" class="label">PREFIX</text>

  <rect x="190" y="60" width="100" height="60" class="box box-mask" />
  <text x="240" y="90" fill="#ef4444">[MASK]</text>

  <rect x="300" y="60" width="120" height="60" class="box box-code" />
  <text x="310" y="80" class="code">print(add(2,3))</text>
  <text x="360" y="110" class="label">SUFFIX</text>

  <!-- LLM Processing -->
  <line x1="430" y1="90" x2="470" y2="90" class="arrow"/>
  
  <rect x="470" y="50" width="100" height="80" class="box" stroke="#7c3aed" fill="#7c3aed" fill-opacity="0.1"/>
  <text x="520" y="90">LLM Decoder</text>

  <!-- Output Generation -->
  <line x1="570" y1="90" x2="610" y2="90" class="arrow"/>

  <rect x="610" y="60" width="90" height="60" class="box box-code" stroke="#10b981"/>
  <text x="620" y="80" class="code">return a+b</text>
  <text x="655" y="110" class="label" fill="#10b981">MIDDLE</text>

  <path d="M 110 130 L 110 160 L 520 160 L 520 130" fill="none" stroke="#4b5563" marker-end="url(#arrowhead)"/>
  <path d="M 360 130 L 360 160" fill="none" stroke="#4b5563"/>
  <text x="315" y="175" class="label">Context passed to LLM</text>

</svg>
