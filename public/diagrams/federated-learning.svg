<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .server { stroke: #7c3aed; fill: #7c3aed; fill-opacity: 0.1; }
    .device { stroke: #06b6d4; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Federated Learning (FedAvg)</text>

  <!-- Central Server -->
  <rect x="260" y="50" width="200" height="60" class="box server" />
  <text x="360" y="70" font-weight="bold">Central Server</text>
  <text x="360" y="90">Global Model $W_{t}$</text>

  <!-- Devices -->
  <rect x="40" y="140" width="140" height="40" class="box device" />
  <text x="110" y="160">Device A (Data A)</text>

  <rect x="290" y="140" width="140" height="40" class="box device" />
  <text x="360" y="160">Device B (Data B)</text>

  <rect x="540" y="140" width="140" height="40" class="box device" />
  <text x="610" y="160">Device C (Data C)</text>

  <!-- Up/Down arrows -->
  <!-- Device A -->
  <path d="M 120 140 L 260 90" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="180" y="100" class="label" fill="#10b981">$\Delta W_A$</text>

  <!-- Device B -->
  <line x1="360" y1="140" x2="360" y2="120" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="380" y="130" class="label" fill="#10b981">$\Delta W_B$</text>

  <!-- Device C -->
  <path d="M 600 140 L 460 90" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="540" y="100" class="label" fill="#10b981">$\Delta W_C$</text>

  <!-- Text explaining -->
  <text x="360" y="190" class="label">1. Local SGD on Devices -> 2. Send Gradients -> 3. Server Averages -> 4. Broadcast New Model</text>

</svg>
