<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-frontend { stroke: #06b6d4; }
    .box-backend { stroke: #7c3aed; }
    .box-db { stroke: #10b981; fill: #10b981; fill-opacity: 0.1; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">AI Search System Architecture</text>

  <!-- Query Understanding -->
  <rect x="20" y="60" width="120" height="80" class="box box-frontend" />
  <text x="80" y="80" fill="#06b6d4">Query Underst.</text>
  <text x="80" y="105" class="label">Spellcheck</text>
  <text x="80" y="125" class="label">Intent Extract</text>

  <line x1="140" y1="100" x2="180" y2="100" class="arrow"/>

  <!-- Parallel Retrieval -->
  <rect x="180" y="40" width="120" height="50" class="box box-db" />
  <text x="240" y="60">BM25 / Keyword</text>
  <text x="240" y="80" class="label">(ElasticSearch)</text>

  <rect x="180" y="110" width="120" height="50" class="box box-db" />
  <text x="240" y="130">Semantic Vector</text>
  <text x="240" y="150" class="label">(Milvus / Pinecone)</text>

  <!-- Merge to Re-ranking -->
  <path d="M 300 65 L 340 100" fill="none" class="arrow"/>
  <path d="M 300 135 L 340 100" fill="none" class="arrow"/>

  <rect x="340" y="60" width="120" height="80" class="box box-backend" />
  <text x="400" y="80" fill="#7c3aed">Re-Ranking</text>
  <text x="400" y="105" class="label">Cross-Encoder</text>
  <text x="400" y="125" class="label">XGBoost LTR</text>

  <line x1="460" y1="100" x2="500" y2="100" class="arrow"/>

  <!-- Final Output -->
  <rect x="500" y="60" width="100" height="80" class="box" stroke="#f59e0b" />
  <text x="550" y="80">Results API</text>
  <text x="550" y="105" class="label">Cache &amp; Merge</text>
  <text x="550" y="125" class="label">&lt; 200ms</text>

</svg>
