<svg viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="220" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrn" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#e50914"/>
    </marker>
    <marker id="arrng" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- AWS Cloud (left) -->
  <rect x="10" y="60" width="150" height="100" rx="8" fill="#1a1d24" stroke="#e50914" stroke-width="1.5"/>
  <text x="85" y="85" font-family="monospace" font-size="10" fill="#e50914" text-anchor="middle">AWS</text>
  <text x="85" y="100" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">700+ Microservices</text>
  <text x="85" y="115" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Recommendation</text>
  <text x="85" y="128" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Billing · API</text>
  <text x="85" y="141" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Video metadata</text>

  <!-- Open Connect (center) -->
  <rect x="220" y="30" width="180" height="160" rx="8" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="55" font-family="monospace" font-size="10" fill="#f59e0b" text-anchor="middle">Open Connect CDN</text>
  <rect x="240" y="65" width="140" height="30" rx="4" fill="#312e10" stroke="#f59e0b" stroke-width="1"/>
  <text x="310" y="84" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">ISP-hosted appliances</text>
  <rect x="240" y="105" width="140" height="30" rx="4" fill="#312e10" stroke="#f59e0b" stroke-width="1"/>
  <text x="310" y="124" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Pre-loaded popular titles</text>
  <rect x="240" y="145" width="140" height="30" rx="4" fill="#312e10" stroke="#f59e0b" stroke-width="1"/>
  <text x="310" y="164" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">95% traffic served local</text>

  <!-- Viewers (right) -->
  <rect x="470" y="40" width="100" height="50" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="520" y="62" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">238M</text>
  <text x="520" y="78" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Subscribers</text>

  <rect x="470" y="120" width="100" height="50" rx="6" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="520" y="142" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">5% traffic</text>
  <text x="520" y="157" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">to AWS origin</text>

  <!-- Arrows -->
  <line x1="160" y1="90" x2="218" y2="90" stroke="#e50914" stroke-width="1.5" marker-end="url(#arrn)"/>
  <text x="188" y="83" font-family="monospace" font-size="8" fill="#e50914" text-anchor="middle">metadata</text>

  <line x1="400" y1="80" x2="468" y2="65" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrng)"/>
  <line x1="400" y1="155" x2="468" y2="145" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrn)"/>

  <!-- Chaos monkey label -->
  <rect x="580" y="80" width="90" height="60" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="625" y="102" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Chaos</text>
  <text x="625" y="116" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Monkey</text>
  <text x="625" y="130" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">kills services</text>
</svg>
