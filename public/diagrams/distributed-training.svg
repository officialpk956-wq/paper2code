<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrdt" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Data Parallelism -->
  <text x="10" y="16" font-family="monospace" font-size="9" fill="#9ca3af">DATA PARALLELISM (DDP)</text>
  <rect x="10" y="24" width="210" height="120" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- GPU0 -->
  <rect x="18" y="34" width="88" height="35" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1"/>
  <text x="62" y="50" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">GPU 0: full model</text>
  <text x="62" y="62" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">batch 1 of N</text>
  <!-- GPU1 -->
  <rect x="114" y="34" width="88" height="35" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1"/>
  <text x="158" y="50" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">GPU 1: full model</text>
  <text x="158" y="62" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">batch 2 of N</text>
  <!-- AllReduce arrow -->
  <line x1="106" y1="51" x2="112" y2="51" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrdt)"/>
  <text x="110" y="84" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">AllReduce gradients</text>
  <text x="110" y="96" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">sync after backward</text>
  <text x="110" y="112" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">Each GPU: same model</text>
  <text x="110" y="124" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">different data shard</text>
  <text x="110" y="137" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">PyTorch DDP standard</text>

  <!-- ZeRO -->
  <rect x="10" y="152" width="210" height="50" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="170" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">ZeRO-3 (DeepSpeed)</text>
  <text x="115" y="184" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">shard params+gradients+optimizer across GPUs</text>
  <text x="115" y="196" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">each GPU holds 1/N of everything</text>

  <!-- Divider -->
  <line x1="228" y1="10" x2="228" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Tensor Parallelism -->
  <text x="238" y="16" font-family="monospace" font-size="9" fill="#9ca3af">TENSOR PARALLELISM (Megatron)</text>
  <rect x="238" y="24" width="220" height="120" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Split weight matrix -->
  <text x="348" y="42" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">Weight matrix W ∈ R^{d×4d}</text>
  <!-- Left half -->
  <rect x="250" y="50" width="88" height="40" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="294" y="68" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">GPU 0: W[:, :2d]</text>
  <text x="294" y="82" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">col shard</text>
  <!-- Right half -->
  <rect x="345" y="50" width="88" height="40" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="389" y="68" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">GPU 1: W[:, 2d:]</text>
  <text x="389" y="82" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">col shard</text>
  <text x="348" y="106" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">AllReduce to combine partial outputs</text>
  <text x="348" y="119" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">2 AllReduces per transformer block</text>
  <text x="348" y="132" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Fast on NVLink (600 GB/s), slow on infiniband</text>

  <!-- Pipeline Parallelism -->
  <rect x="238" y="152" width="220" height="50" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="348" y="168" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Pipeline Parallelism</text>
  <text x="348" y="182" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">layers 0-20 on GPU0, 21-40 on GPU1</text>
  <text x="348" y="196" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">micro-batching hides pipeline bubble</text>

  <!-- Divider -->
  <line x1="466" y1="10" x2="466" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 3D Parallelism -->
  <text x="476" y="16" font-family="monospace" font-size="9" fill="#9ca3af">3D PARALLELISM (Megatron-DeepSpeed)</text>
  <rect x="476" y="24" width="234" height="90" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="593" y="44" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">DP × TP × PP = total GPUs</text>
  <text x="593" y="60" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Example: Llama-3-405B</text>
  <text x="593" y="74" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">TP=8 (within node, NVLink)</text>
  <text x="593" y="88" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">PP=4 (across nodes, IB)</text>
  <text x="593" y="102" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">DP=16 (data replicas)</text>
  <text x="593" y="108" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">= 512 GPUs total</text>

  <!-- Flash/FSDP -->
  <rect x="476" y="122" width="234" height="80" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="593" y="140" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">FSDP (PyTorch ZeRO-3)</text>
  <text x="593" y="155" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">each GPU: shard of params</text>
  <text x="593" y="167" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">AllGather before each layer forward</text>
  <text x="593" y="179" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">ReduceScatter after backward</text>
  <text x="593" y="191" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Meta's FSDP trained Llama 2/3</text>
</svg>
