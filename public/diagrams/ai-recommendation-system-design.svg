<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-feature { stroke: #10b981; }
    .box-gen { stroke: #0ea5e9; }
    .box-score { stroke: #7c3aed; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">AI Recommendation System Pipeline</text>

  <!-- Feature Store -->
  <rect x="20" y="60" width="100" height="80" class="box box-feature" fill="#10b981" fill-opacity="0.1"/>
  <text x="70" y="80" fill="#10b981">Feature Store</text>
  <text x="70" y="105" class="label">User Profile</text>
  <text x="70" y="125" class="label">Real-time Clicks</text>

  <line x1="120" y1="100" x2="160" y2="100" class="arrow"/>

  <!-- Candidate Generation -->
  <rect x="160" y="60" width="140" height="80" class="box box-gen" />
  <text x="230" y="80" fill="#0ea5e9">Candidate Gen</text>
  <text x="230" y="105" class="label">Two-Tower Model</text>
  <text x="230" y="125" class="label">1,000s of Items</text>

  <line x1="300" y1="100" x2="340" y2="100" class="arrow"/>

  <!-- Scoring & Ranking -->
  <rect x="340" y="60" width="140" height="80" class="box box-score" />
  <text x="410" y="80" fill="#7c3aed">Real-time Scoring</text>
  <text x="410" y="105" class="label">Wide &amp; Deep / DLRM</text>
  <text x="410" y="125" class="label">Heavy Compute</text>

  <line x1="480" y1="100" x2="520" y2="100" class="arrow"/>

  <!-- Filtering & A/B -->
  <rect x="520" y="60" width="120" height="80" class="box" stroke="#f59e0b" />
  <text x="580" y="80">Filter &amp; Output</text>
  <text x="580" y="105" class="label">A/B Testing Gates</text>
  <text x="580" y="125" class="label">Top 10 Results</text>

</svg>
