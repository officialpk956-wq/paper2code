<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-sys { stroke: #7c3aed; }
    .box-user { stroke: #06b6d4; }
    .box-llm { stroke: #10b981; fill: #10b981; fill-opacity: 0.1; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; text-anchor: start; }
    .code { font-family: monospace; font-size: 11px; fill: #fcd34d; text-anchor: start; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Prompt Engineering: From Zero-Shot to CoT</text>

  <!-- Zero-Shot -->
  <rect x="20" y="40" width="200" height="140" class="box box-user" />
  <text x="30" y="60" class="label">Zero-Shot</text>
  <text x="30" y="90" class="code">Q: The sky is blue.</text>
  <text x="30" y="110" class="code">Translate to French.</text>
  <text x="30" y="140" class="code">A: [LLM output]</text>

  <!-- Few-Shot -->
  <rect x="240" y="40" width="220" height="140" class="box box-sys" />
  <text x="250" y="60" class="label">Few-Shot (In-Context)</text>
  <text x="250" y="90" class="code">Q: Apple -> Fruit</text>
  <text x="250" y="110" class="code">Q: Dog -> Animal</text>
  <text x="250" y="130" class="code">Q: Car -> ?</text>
  <text x="250" y="150" class="code">A: [LLM outputs Vehicle]</text>

  <!-- Chain of Thought -->
  <rect x="480" y="40" width="220" height="140" class="box box-llm" />
  <text x="490" y="60" class="label">Chain of Thought (CoT)</text>
  <text x="490" y="90" class="code">Q: Roger has 5 tennis balls.</text>
  <text x="490" y="110" class="code">He buys 2 more cans of 3.</text>
  <text x="490" y="140" class="code">A: Let's think step by step.</text>
  <text x="490" y="160" class="code">5 + (2 * 3) = 11.</text>

</svg>
