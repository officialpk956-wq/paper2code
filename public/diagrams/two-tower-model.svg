<svg viewBox="0 0 640 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="320" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-user { stroke: #0ea5e9; }
    .box-item { stroke: #7c3aed; }
    .box-gold { stroke: #f59e0b; fill: #f59e0b; fill-opacity: 0.1;}
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <!-- User Tower (Left) -->
  <text x="160" y="30" class="title" fill="#0ea5e9">User Tower</text>
  
  <rect x="80" y="50" width="160" height="40" class="box box-user" />
  <text x="160" y="70">User History + Demog.</text>
  <line x1="160" y1="90" x2="160" y2="110" class="arrow"/>
  
  <rect x="80" y="110" width="160" height="40" class="box box-user" />
  <text x="160" y="130">Embedding Layer</text>
  <line x1="160" y1="150" x2="160" y2="170" class="arrow"/>
  
  <rect x="80" y="170" width="160" height="40" class="box box-user" />
  <text x="160" y="190">Hidden Layer</text>
  <line x1="160" y1="210" x2="160" y2="230" class="arrow"/>
  
  <rect x="80" y="230" width="160" height="40" class="box box-user" fill="#0ea5e9" fill-opacity="0.2"/>
  <text x="160" y="250">User Embedding 128d</text>

  <!-- Item Tower (Right) -->
  <text x="480" y="30" class="title" fill="#7c3aed">Item Tower</text>
  
  <rect x="400" y="50" width="160" height="40" class="box box-item" />
  <text x="480" y="70">Item Features + Cat.</text>
  <line x1="480" y1="90" x2="480" y2="110" class="arrow"/>
  
  <rect x="400" y="110" width="160" height="40" class="box box-item" />
  <text x="480" y="130">Embedding Layer</text>
  <line x1="480" y1="150" x2="480" y2="170" class="arrow"/>
  
  <rect x="400" y="170" width="160" height="40" class="box box-item" />
  <text x="480" y="190">Hidden Layer</text>
  <line x1="480" y1="210" x2="480" y2="230" class="arrow"/>
  
  <rect x="400" y="230" width="160" height="40" class="box box-item" fill="#7c3aed" fill-opacity="0.2"/>
  <text x="480" y="250">Item Embedding 128d</text>

  <!-- Interaction (Center) -->
  <line x1="240" y1="250" x2="280" y2="250" class="arrow"/>
  <line x1="400" y1="250" x2="360" y2="250" class="arrow"/>
  
  <rect x="280" y="230" width="80" height="40" class="box box-gold" />
  <text x="320" y="250" fill="#f59e0b">Dot Product</text>
  
  <line x1="320" y1="270" x2="320" y2="290" class="arrow"/>
  <rect x="260" y="290" width="120" height="20" class="box box-gold" stroke="none" fill="none"/>
  <text x="320" y="300" fill="#f59e0b">Similarity Score</text>

  <!-- Retrieval text floating -->
  <rect x="260" y="140" width="120" height="30" class="box" fill="#1a1d24" stroke="#4b5563" stroke-dasharray="4"/>
  <text x="320" y="155">ANN Index</text>
  <line x1="320" y1="170" x2="320" y2="230" stroke="#4b5563" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
</svg>
