<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrgnn" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Graph input -->
  <text x="10" y="18" font-family="monospace" font-size="9" fill="#9ca3af">INPUT GRAPH: nodes have features, edges define relationships</text>

  <!-- Nodes -->
  <circle cx="55" cy="75" r="20" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
  <text x="55" y="72" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">v₁</text>
  <text x="55" y="84" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">feat</text>

  <circle cx="55" cy="145" r="20" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
  <text x="55" y="142" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">v₂</text>
  <text x="55" y="154" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">feat</text>

  <circle cx="130" cy="110" r="20" fill="#1e3a5f" stroke="#06b6d4" stroke-width="2"/>
  <text x="130" y="107" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">v₃</text>
  <text x="130" y="119" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">feat</text>

  <!-- Edges -->
  <line x1="67" y1="87" x2="118" y2="100" stroke="#374151" stroke-width="1.5"/>
  <line x1="67" y1="133" x2="118" y2="120" stroke="#374151" stroke-width="1.5"/>
  <line x1="55" y1="95" x2="55" y2="125" stroke="#374151" stroke-width="1.5"/>

  <!-- Message passing arrow -->
  <line x1="155" y1="110" x2="195" y2="110" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrgnn)"/>
  <text x="175" y="103" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">message</text>
  <text x="175" y="115" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">passing</text>

  <!-- Message passing box -->
  <rect x="198" y="60" width="190" height="100" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="293" y="80" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Message Passing Layer</text>
  <text x="293" y="97" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">1. Aggregate neighbors:</text>
  <text x="293" y="111" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">m_v = AGG({h_u: u∈N(v)})</text>
  <text x="293" y="127" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">2. Update node:</text>
  <text x="293" y="141" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">h_v' = UPDATE(h_v, m_v)</text>
  <text x="293" y="153" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">repeat K times → K-hop receptive field</text>

  <line x1="388" y1="110" x2="408" y2="110" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrgnn)"/>

  <!-- Variants -->
  <rect x="412" y="20" width="148" height="65" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="486" y="40" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">GCN</text>
  <text x="486" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">mean aggregation</text>
  <text x="486" y="68" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">spectral convolution</text>
  <text x="486" y="78" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Kipf & Welling 2017</text>

  <rect x="412" y="95" width="148" height="65" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="486" y="115" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">GAT</text>
  <text x="486" y="130" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">attention weights</text>
  <text x="486" y="143" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">α_ij = softmax(a^T[Wh_i||Wh_j])</text>
  <text x="486" y="153" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Velickovic 2018</text>

  <rect x="412" y="170" width="148" height="35" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="486" y="185" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">GraphSAGE</text>
  <text x="486" y="198" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">sample neighbors, inductive</text>

  <!-- Applications -->
  <rect x="572" y="20" width="140" height="175" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1"/>
  <text x="642" y="40" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Applications</text>
  <text x="642" y="58" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Molecule property</text>
  <text x="642" y="70" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">drug discovery</text>
  <text x="642" y="88" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Social networks</text>
  <text x="642" y="100" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">fraud detection</text>
  <text x="642" y="118" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Recommender</text>
  <text x="642" y="130" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Pinterest PinSage</text>
  <text x="642" y="148" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Knowledge Graphs</text>
  <text x="642" y="160" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">entity reasoning</text>
  <text x="642" y="178" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Protein folding</text>
  <text x="642" y="190" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">AlphaFold contacts</text>
</svg>
