<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrsm" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Timeline axis -->
  <line x1="15" y1="160" x2="710" y2="160" stroke="#374151" stroke-width="1"/>
  <text x="15" y="178" font-family="monospace" font-size="8" fill="#6b7280">1986</text>
  <text x="110" y="178" font-family="monospace" font-size="8" fill="#6b7280">1997</text>
  <text x="210" y="178" font-family="monospace" font-size="8" fill="#6b7280">2014</text>
  <text x="310" y="178" font-family="monospace" font-size="8" fill="#6b7280">2015</text>
  <text x="415" y="178" font-family="monospace" font-size="8" fill="#6b7280">2017</text>
  <text x="530" y="178" font-family="monospace" font-size="8" fill="#6b7280">2020</text>
  <text x="630" y="178" font-family="monospace" font-size="8" fill="#6b7280">2023</text>

  <!-- RNN -->
  <rect x="15" y="70" width="90" height="80" rx="5" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="60" y="90" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">RNN</text>
  <text x="60" y="105" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">hidden state</text>
  <text x="60" y="118" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">sequential only</text>
  <text x="60" y="131" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">vanishing grads</text>
  <text x="60" y="143" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">Rumelhart 1986</text>
  <line x1="60" y1="150" x2="60" y2="160" stroke="#374151" stroke-width="1"/>

  <!-- LSTM -->
  <rect x="115" y="55" width="90" height="95" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="160" y="75" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">LSTM</text>
  <text x="160" y="90" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">forget/input/</text>
  <text x="160" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">output gates</text>
  <text x="160" y="116" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">cell state path</text>
  <text x="160" y="129" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">long range ok</text>
  <text x="160" y="142" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">Hochreiter 1997</text>
  <line x1="160" y1="150" x2="160" y2="160" stroke="#374151" stroke-width="1"/>

  <!-- GRU -->
  <rect x="215" y="70" width="90" height="80" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="260" y="90" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">GRU</text>
  <text x="260" y="105" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">reset+update</text>
  <text x="260" y="118" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">gates only</text>
  <text x="260" y="131" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">simpler than LSTM</text>
  <text x="260" y="143" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">Cho et al. 2014</text>
  <line x1="260" y1="150" x2="260" y2="160" stroke="#374151" stroke-width="1"/>

  <!-- Seq2Seq+Attention -->
  <rect x="315" y="40" width="95" height="110" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="363" y="58" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Seq2Seq</text>
  <text x="363" y="71" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">+Attention</text>
  <text x="363" y="85" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">encoder → decoder</text>
  <text x="363" y="98" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Bahdanau attn</text>
  <text x="363" y="111" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">aligns src/tgt</text>
  <text x="363" y="124" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">MT breakthrough</text>
  <text x="363" y="137" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">2015</text>
  <line x1="363" y1="150" x2="363" y2="160" stroke="#374151" stroke-width="1"/>

  <!-- Transformer -->
  <rect x="420" y="25" width="100" height="125" rx="5" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="45" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Transformer</text>
  <text x="470" y="60" font-family="monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">self-attention</text>
  <text x="470" y="73" font-family="monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">parallel training</text>
  <text x="470" y="86" font-family="monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">O(n²) attention</text>
  <text x="470" y="99" font-family="monospace" font-size="7" fill="#818cf8" text-anchor="middle">ends RNN era</text>
  <text x="470" y="112" font-family="monospace" font-size="7" fill="#818cf8" text-anchor="middle">→ BERT, GPT</text>
  <text x="470" y="125" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Vaswani 2017</text>
  <line x1="470" y1="150" x2="470" y2="160" stroke="#374151" stroke-width="1"/>

  <!-- Longformer/BigBird -->
  <rect x="532" y="55" width="90" height="95" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="577" y="73" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Efficient</text>
  <text x="577" y="86" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Transformers</text>
  <text x="577" y="100" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Longformer/BigBird</text>
  <text x="577" y="113" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">sparse attention</text>
  <text x="577" y="126" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">O(n) or O(n log n)</text>
  <text x="577" y="139" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">2020</text>
  <line x1="577" y1="150" x2="577" y2="160" stroke="#374151" stroke-width="1"/>

  <!-- Mamba SSM -->
  <rect x="633" y="40" width="82" height="110" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="2"/>
  <text x="675" y="60" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Mamba</text>
  <text x="675" y="75" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">SSM + select</text>
  <text x="675" y="88" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">O(n) inference</text>
  <text x="675" y="101" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">recurrent at</text>
  <text x="675" y="114" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">inference time</text>
  <text x="675" y="127" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">parallel training</text>
  <text x="675" y="140" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">Gu et al. 2023</text>
  <line x1="675" y1="150" x2="675" y2="160" stroke="#374151" stroke-width="1"/>
</svg>
