<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrsl" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="10" y="18" font-family="monospace" font-size="10" fill="#9ca3af">NEURAL SCALING LAWS: loss ∝ N^{-α_N} · D^{-α_D} · C^{-α_C}</text>

  <!-- Loss vs Params (log-log) -->
  <rect x="10" y="28" width="220" height="150" rx="5" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="120" y="46" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Loss vs Parameters (fixed data)</text>
  <!-- Axes -->
  <line x1="30" y1="155" x2="220" y2="155" stroke="#374151" stroke-width="1"/>
  <line x1="30" y1="55" x2="30" y2="155" stroke="#374151" stroke-width="1"/>
  <text x="125" y="168" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">log(Parameters)</text>
  <text x="18" y="110" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle" transform="rotate(-90,18,110)">log(Loss)</text>
  <!-- Power law line -->
  <polyline points="40,140 70,128 100,118 130,110 160,104 190,99 215,95" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <!-- Data points -->
  <circle cx="60" cy="133" r="3" fill="#c4b5fd"/>
  <circle cx="90" cy="122" r="3" fill="#c4b5fd"/>
  <circle cx="120" cy="113" r="3" fill="#c4b5fd"/>
  <circle cx="150" cy="107" r="3" fill="#c4b5fd"/>
  <circle cx="180" cy="101" r="3" fill="#c4b5fd"/>
  <text x="170" y="93" font-family="monospace" font-size="7" fill="#a5b4fc">slope: -0.076</text>

  <!-- Arrows and labels -->
  <text x="46" y="143" font-family="monospace" font-size="7" fill="#9ca3af">125M</text>
  <text x="166" y="107" font-family="monospace" font-size="7" fill="#9ca3af">6.7B</text>

  <!-- Chinchilla compute-optimal -->
  <rect x="242" y="28" width="240" height="150" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="362" y="46" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">Chinchilla Compute-Optimal</text>
  <text x="362" y="60" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Hoffmann et al. 2022</text>
  <!-- Key equation -->
  <text x="362" y="82" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">N_opt ∝ √C</text>
  <text x="362" y="97" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">D_opt ∝ √C</text>
  <text x="362" y="112" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">~20 tokens per parameter</text>
  <text x="362" y="128" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">(for compute-optimal training)</text>
  <!-- Model comparison -->
  <rect x="255" y="140" width="218" height="30" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="364" y="153" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">GPT-3: 175B params, 300B tokens (under-trained)</text>
  <text x="364" y="164" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">Chinchilla: 70B params, 1.4T tokens (same FLOPs, better)</text>

  <!-- Emergent abilities -->
  <rect x="496" y="28" width="218" height="150" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="605" y="46" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Emergent Abilities</text>
  <text x="605" y="62" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Wei et al. 2022</text>

  <!-- Emergence diagram -->
  <!-- flat then jump -->
  <text x="510" y="80" font-family="monospace" font-size="7" fill="#6b7280">Accuracy</text>
  <line x1="510" y1="130" x2="700" y2="130" stroke="#374151" stroke-width="1"/>
  <line x1="510" y1="80" x2="510" y2="130" stroke="#374151" stroke-width="1"/>
  <!-- Flat line then sharp rise -->
  <polyline points="515,127 555,126 575,125 590,124 605,120 615,108 625,88 635,82 650,80" stroke="#f59e0b" stroke-width="2" fill="none"/>
  <text x="517" y="143" font-family="monospace" font-size="6" fill="#6b7280">1B</text>
  <text x="618" y="143" font-family="monospace" font-size="6" fill="#6b7280">10B</text>
  <text x="668" y="143" font-family="monospace" font-size="6" fill="#6b7280">100B</text>
  <line x1="605" y1="80" x2="605" y2="130" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="607" y="90" font-family="monospace" font-size="7" fill="#fcd34d">emergence</text>
  <text x="607" y="100" font-family="monospace" font-size="7" fill="#fcd34d">threshold</text>

  <text x="605" y="158" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Chain-of-thought at 100B+</text>
  <text x="605" y="170" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">BIG-Bench hard tasks</text>

  <!-- Bottom summary -->
  <rect x="10" y="186" width="700" height="20" rx="3" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="360" y="200" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">Kaplan 2020: loss scales predictably with compute/params/data  ·  Chinchilla: most models are under-trained, not under-sized  ·  GPT-4 class models: ~10²³–10²⁵ FLOPs</text>
</svg>
