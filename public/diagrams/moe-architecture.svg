<svg viewBox="0 0 680 230" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="230" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrm" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Dense side -->
  <text x="145" y="20" font-family="monospace" font-size="10" fill="#9ca3af" text-anchor="middle">Dense Transformer</text>
  <rect x="60" y="30" width="170" height="35" rx="5" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="145" y="45" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Token Input</text>
  <text x="145" y="58" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">100% neurons active</text>

  <rect x="60" y="85" width="170" height="70" rx="5" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="145" y="105" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">FFN Layer</text>
  <text x="145" y="120" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">ALL neurons fire</text>
  <text x="145" y="135" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">37B params active</text>
  <text x="145" y="148" font-family="monospace" font-size="8" fill="#dc2626" text-anchor="middle">expensive</text>

  <line x1="145" y1="65" x2="145" y2="83" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrm)"/>

  <!-- MoE side -->
  <text x="490" y="20" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">MoE Transformer (DeepSeek)</text>
  <rect x="390" y="30" width="180" height="35" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="45" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Token Input</text>
  <text x="480" y="58" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">671B total, 37B active</text>

  <!-- Router -->
  <rect x="420" y="85" width="120" height="30" rx="5" fill="#312e81" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="105" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Router (top-8 of 256)</text>

  <!-- Expert boxes -->
  <rect x="370" y="135" width="55" height="30" rx="4" fill="#1a1d24" stroke="#7c3aed" stroke-width="1"/>
  <text x="397" y="154" font-family="monospace" font-size="8" fill="#7c3aed" text-anchor="middle">Expert 1</text>
  <rect x="435" y="135" width="55" height="30" rx="4" fill="#1a1d24" stroke="#7c3aed" stroke-width="1"/>
  <text x="462" y="154" font-family="monospace" font-size="8" fill="#7c3aed" text-anchor="middle">Expert 2</text>
  <rect x="500" y="135" width="55" height="30" rx="4" fill="#312e81" stroke="#10b981" stroke-width="1.5"/>
  <text x="527" y="154" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">Expert 5 ✓</text>
  <rect x="565" y="135" width="55" height="30" rx="4" fill="#312e81" stroke="#10b981" stroke-width="1.5"/>
  <text x="592" y="154" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">Expert 8 ✓</text>

  <line x1="480" y1="65" x2="480" y2="83" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrm)"/>
  <line x1="453" y1="115" x2="420" y2="133" stroke="#7c3aed" stroke-width="1" marker-end="url(#arrm)"/>
  <line x1="462" y1="115" x2="462" y2="133" stroke="#7c3aed" stroke-width="1" marker-end="url(#arrm)"/>
  <line x1="490" y1="115" x2="527" y2="133" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrm)"/>
  <line x1="510" y1="115" x2="592" y2="133" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrm)"/>

  <text x="480" y="200" font-family="monospace" font-size="8" fill="#10b981" text-anchor="middle">Only activated experts compute — 37B active / 671B total</text>
  <text x="480" y="215" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Same FLOPs as 37B dense, but 671B total capacity</text>
