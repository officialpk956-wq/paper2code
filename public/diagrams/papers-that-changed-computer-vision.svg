<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; stroke: #10b981; }
    .line { stroke: #4b5563; stroke-width: 4; }
    .dot { fill: #10b981; }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .year { font-size: 11px; fill: #fcd34d; font-weight: bold; }
    .desc { font-size: 10px; fill: #9ca3af; }
  </style>

  <text x="360" y="20" class="title">Papers That Changed Computer Vision (2012 - 2021)</text>

  <!-- Timeline Line -->
  <line x1="40" y1="100" x2="680" y2="100" class="line"/>

  <!-- 2012 AlexNet -->
  <circle cx="90" cy="100" r="6" class="dot"/>
  <text x="90" y="75" class="year">2012</text>
  <rect x="40" y="115" width="100" height="30" class="box" />
  <text x="90" y="130">AlexNet</text>
  <text x="90" y="160" class="desc">Deep CNNs win</text>

  <!-- 2014 VGG/GoogLeNet -->
  <circle cx="210" cy="100" r="6" class="dot"/>
  <text x="210" y="75" class="year">2014</text>
  <rect x="160" y="25" width="100" height="30" class="box" />
  <text x="210" y="40">VGG/Inception</text>
  <text x="210" y="120" class="desc">Going Deeper</text>

  <!-- 2015 ResNet -->
  <circle cx="330" cy="100" r="6" class="dot"/>
  <text x="330" y="75" class="year">2015</text>
  <rect x="280" y="115" width="100" height="30" class="box" fill="#7c3aed" stroke="#7c3aed" fill-opacity="0.2"/>
  <text x="330" y="130" font-weight="bold">ResNet</text>
  <text x="330" y="160" class="desc">Skip Connections</text>

  <!-- 2017 FPN/MaskRCNN -->
  <circle cx="450" cy="100" r="6" class="dot"/>
  <text x="450" y="75" class="year">2017</text>
  <rect x="400" y="25" width="100" height="30" class="box" />
  <text x="450" y="40">FPN / Mask R-CNN</text>
  <text x="450" y="120" class="desc">Segmentation</text>

  <!-- 2020/21 ViT & Swin -->
  <circle cx="570" cy="100" r="6" class="dot"/>
  <text x="570" y="75" class="year">2020-21</text>
  <rect x="520" y="115" width="100" height="30" class="box" stroke="#f59e0b"/>
  <text x="570" y="130">ViT &amp; Swin</text>
  <text x="570" y="160" class="desc">Transformers in CV</text>

</svg>
