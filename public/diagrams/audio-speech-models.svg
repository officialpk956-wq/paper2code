<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arraudio" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arraudiog" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>
  <text x="10" y="15" font-family="monospace" font-size="9" fill="#9ca3af">AUDIO / SPEECH ARCHITECTURES</text>

  <!-- Waveform to spectrogram -->
  <rect x="10" y="22" width="130" height="50" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="75" y="38" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">Raw Waveform</text>
  <text x="75" y="52" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">PCM 16kHz mono</text>
  <text x="75" y="64" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">30s = 480,000 samples</text>

  <line x1="140" y1="47" x2="155" y2="47" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arraudio)"/>

  <rect x="157" y="22" width="130" height="50" rx="3" fill="#1a1d24" stroke="#06b6d4" stroke-width="1"/>
  <text x="222" y="38" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">Log-Mel Spectrogram</text>
  <text x="222" y="52" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">80 mel bins × T frames</text>
  <text x="222" y="64" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">STFT → mel filterbank → log</text>

  <line x1="287" y1="47" x2="302" y2="47" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arraudio)"/>

  <!-- Whisper -->
  <rect x="304" y="22" width="160" height="50" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="384" y="36" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Whisper (OpenAI, 2022)</text>
  <text x="384" y="48" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">CNN patch embed → Transformer enc</text>
  <text x="384" y="60" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">→ Transformer dec → text</text>

  <!-- Whisper sizes -->
  <rect x="474" y="22" width="236" height="50" rx="3" fill="#1a1d24" stroke="#7c3aed" stroke-width="1"/>
  <text x="592" y="36" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">Whisper model sizes</text>
  <text x="592" y="48" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">tiny(39M) small(244M) medium(769M)</text>
  <text x="592" y="60" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">large-v3: 1.5B params, 99 languages</text>

  <!-- wav2vec 2.0 -->
  <rect x="10" y="85" width="340" height="65" rx="3" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="180" y="100" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">wav2vec 2.0 (Facebook, 2020) — Self-Supervised ASR</text>
  <text x="180" y="114" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">CNN encoder: raw waveform → latent features (every 20ms)</text>
  <text x="180" y="126" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Quantization: discretize latents into codebook entries (320 codes)</text>
  <text x="180" y="138" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">Contrastive loss: identify true quantized at masked step vs 100 distractors</text>
  <text x="180" y="144" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">Result: 10 min labeled → SOTA ASR (vs 960h supervised)</text>

  <!-- HuBERT -->
  <rect x="360" y="85" width="350" height="65" rx="3" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="535" y="100" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">HuBERT (Facebook, 2021)</text>
  <text x="535" y="114" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">k-means cluster audio features offline → pseudo-labels</text>
  <text x="535" y="126" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">BERT-style masked prediction on pseudo-labels</text>
  <text x="535" y="138" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Iterate: HuBERT labels → recluster → relabel → retrain</text>
  <text x="535" y="150" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">HuBERT-L: 94.5% WER on Librispeech with 10min labels</text>

  <!-- CTC vs Attention vs RNN-T -->
  <rect x="10" y="162" width="700" height="40" rx="3" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="360" y="177" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">DECODER TYPES</text>
  <text x="120" y="190" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">CTC: greedy/beam decode</text>
  <text x="120" y="197" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">no autoregression, fast</text>
  <text x="360" y="190" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">Attention seq2seq: slower, flexible</text>
  <text x="360" y="197" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Whisper uses this</text>
  <text x="595" y="190" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">RNN-T: streaming, production ASR</text>
  <text x="595" y="197" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Google Assistant, Pixel, Siri</text>
</svg>
