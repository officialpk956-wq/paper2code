<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrune" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arruneg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- U-Net encoder -->
  <text x="10" y="15" font-family="monospace" font-size="9" fill="#9ca3af">U-NET (encoder-decoder with skip connections)</text>

  <!-- Encoder path (left, going down) -->
  <rect x="10" y="22" width="85" height="30" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="52" y="37" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">Input 572×572</text>
  <text x="52" y="48" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">64 channels</text>

  <line x1="52" y1="52" x2="52" y2="66" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrune)"/>

  <rect x="10" y="68" width="85" height="28" rx="3" fill="#1a1d24" stroke="#06b6d4" stroke-width="1"/>
  <text x="52" y="82" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">MaxPool 2×2</text>
  <text x="52" y="92" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">128 ch · 284×284</text>

  <line x1="52" y1="96" x2="52" y2="110" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrune)"/>

  <rect x="10" y="112" width="85" height="28" rx="3" fill="#1a1d24" stroke="#06b6d4" stroke-width="1"/>
  <text x="52" y="126" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">MaxPool 2×2</text>
  <text x="52" y="136" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">256 ch · 140×140</text>

  <line x1="52" y1="140" x2="52" y2="154" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrune)"/>

  <!-- Bottleneck -->
  <rect x="10" y="156" width="85" height="30" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="52" y="171" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">Bottleneck</text>
  <text x="52" y="181" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">1024 ch · 28×28</text>

  <!-- Skip connections (horizontal dashed arrows) -->
  <line x1="95" y1="37" x2="580" y2="37" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="337" y="33" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">skip connections (copy and crop)</text>
  <line x1="95" y1="82" x2="580" y2="82" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="95" y1="126" x2="580" y2="126" stroke="#10b981" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Decoder path (right, going up) -->
  <rect x="582" y="112" width="85" height="28" rx="3" fill="#1a1d24" stroke="#10b981" stroke-width="1"/>
  <text x="625" y="126" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">UpConv 2×2</text>
  <text x="625" y="136" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">256 ch · 104×104</text>

  <line x1="625" y1="112" x2="625" y2="98" stroke="#10b981" stroke-width="1.5" marker-end="url(#arruneg)"/>

  <rect x="582" y="68" width="85" height="28" rx="3" fill="#1a1d24" stroke="#10b981" stroke-width="1"/>
  <text x="625" y="82" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">UpConv 2×2</text>
  <text x="625" y="92" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">128 ch · 200×200</text>

  <line x1="625" y1="68" x2="625" y2="54" stroke="#10b981" stroke-width="1.5" marker-end="url(#arruneg)"/>

  <rect x="582" y="22" width="85" height="30" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="625" y="37" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">Output conv 1×1</text>
  <text x="625" y="48" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">N classes · 388×388</text>

  <!-- Bottleneck to decoder -->
  <line x1="95" y1="171" x2="280" y2="171" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="280" y1="171" x2="280" y2="126" stroke="#7c3aed" stroke-width="1.5"/>
  <line x1="280" y1="126" x2="580" y2="126" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrune)"/>

  <!-- Variants (right column) -->
  <text x="350" y="58" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Modern Variants</text>
  <rect x="250" y="65" width="320" height="130" rx="5" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="410" y="84" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">Attention U-Net</text>
  <text x="410" y="96" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">gate which skip connection features matter</text>
  <text x="410" y="112" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">TransUNet / Swin-UNet</text>
  <text x="410" y="124" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Transformer encoder replaces CNN encoder</text>
  <text x="410" y="140" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">SegFormer</text>
  <text x="410" y="152" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">MiT encoder + lightweight MLP decoder</text>
  <text x="410" y="163" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">no upsampling needed from MiT features</text>
  <text x="410" y="178" font-family="monospace" font-size="8" fill="#f97316" text-anchor="middle">SAM (Segment Anything)</text>
  <text x="410" y="190" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">ViT-H encoder + transformer mask decoder + prompts</text>
</svg>
