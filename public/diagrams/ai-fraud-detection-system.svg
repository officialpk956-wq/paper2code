<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-stream { stroke: #0ea5e9; }
    .box-graph { stroke: #10b981; }
    .box-fraud { stroke: #ef4444; fill: #ef4444; fill-opacity: 0.1; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
    
    /* Graph Nodes */
    .node { fill: #10b981; }
    .node-bad { fill: #ef4444; }
    .edge { stroke: #4b5563; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">AI Fraud Detection: Streaming &amp; Graphs</text>

  <!-- Streaming Pipeline -->
  <rect x="20" y="50" width="100" height="40" class="box" />
  <text x="70" y="70">Transaction</text>

  <line x1="120" y1="70" x2="160" y2="70" class="arrow"/>

  <rect x="160" y="40" width="120" height="60" class="box box-stream" />
  <text x="220" y="60" fill="#0ea5e9">Streaming Feat.</text>
  <text x="220" y="80" class="label">Kafka → Flink</text>

  <!-- Graph Neural Network -->
  <rect x="340" y="40" width="160" height="130" class="box box-graph" />
  <text x="420" y="60" fill="#10b981">Graph Detection</text>
  
  <line x1="280" y1="70" x2="320" y2="70" class="arrow"/>
  
  <!-- Mini Graph -->
  <line x1="380" y1="90" x2="420" y2="120" class="edge"/>
  <line x1="380" y1="90" x2="400" y2="150" class="edge"/>
  <line x1="420" y1="120" x2="400" y2="150" class="edge"/>
  <line x1="420" y1="120" x2="460" y2="100" class="edge"/>
  <line x1="460" y1="100" x2="460" y2="140" class="edge"/>
  <line x1="420" y1="120" x2="460" y2="140" class="edge"/>

  <circle cx="380" cy="90" r="8" class="node"/>
  <circle cx="420" cy="120" r="8" class="node-bad"/>
  <circle cx="400" cy="150" r="8" class="node"/>
  <circle cx="460" cy="100" r="8" class="node"/>
  <circle cx="460" cy="140" r="8" class="node-bad"/>
  <text x="440" y="160" class="label" fill="#ef4444">Fraud Ring</text>

  <!-- Output -->
  <line x1="500" y1="105" x2="540" y2="105" class="arrow"/>

  <rect x="540" y="85" width="100" height="40" class="box box-fraud" />
  <text x="590" y="105" fill="#ef4444">Block Tx</text>

  <!-- Model Refresh Loop -->
  <path d="M 590 125 L 590 170 L 220 170 L 220 100" fill="none" stroke="#7c3aed" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="400" y="180" class="label" fill="#7c3aed">Daily Model Refresh (Combat Concept Drift)</text>

</svg>
