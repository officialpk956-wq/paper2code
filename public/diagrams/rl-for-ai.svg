<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrrl" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrrg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Q-Learning / DQN (left) -->
  <text x="10" y="16" font-family="monospace" font-size="9" fill="#6b7280">VALUE-BASED</text>
  <rect x="10" y="22" width="105" height="75" rx="5" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="63" y="42" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Q-Learning</text>
  <text x="63" y="57" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Q(s,a) table</text>
  <text x="63" y="70" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Bellman equation</text>
  <text x="63" y="83" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">discrete actions only</text>

  <line x1="115" y1="58" x2="133" y2="58" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrrl)"/>

  <rect x="135" y="22" width="105" height="75" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="188" y="42" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">DQN</text>
  <text x="188" y="57" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">CNN approximates Q</text>
  <text x="188" y="70" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">replay buffer</text>
  <text x="188" y="83" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Atari · DeepMind 2013</text>

  <!-- Policy-based / Actor-Critic -->
  <text x="10" y="112" font-family="monospace" font-size="9" fill="#6b7280">POLICY-BASED</text>
  <rect x="10" y="118" width="105" height="75" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="63" y="138" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">REINFORCE</text>
  <text x="63" y="153" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">policy gradient</text>
  <text x="63" y="166" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">∇J = E[∇log π · R]</text>
  <text x="63" y="179" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">high variance</text>

  <line x1="115" y1="155" x2="133" y2="155" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrrl)"/>

  <rect x="135" y="118" width="105" height="75" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="188" y="138" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">PPO</text>
  <text x="188" y="153" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">clipped surrogate</text>
  <text x="188" y="166" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">stable policy update</text>
  <text x="188" y="179" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">OpenAI 2017 · gold std</text>

  <!-- Divider -->
  <line x1="252" y1="10" x2="252" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="360" y="16" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">RLHF / GRPO (LLM ALIGNMENT)</text>

  <!-- RLHF flow -->
  <rect x="262" y="25" width="130" height="55" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="327" y="44" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">SFT Model</text>
  <text x="327" y="59" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">pretrained + fine-tuned</text>
  <text x="327" y="71" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">on human demos</text>

  <line x1="392" y1="52" x2="410" y2="52" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrrl)"/>

  <rect x="412" y="25" width="130" height="55" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="477" y="44" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Reward Model</text>
  <text x="477" y="59" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">trained on human rankings</text>
  <text x="477" y="71" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">predicts human preference</text>

  <line x1="542" y1="52" x2="560" y2="52" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrrl)"/>

  <rect x="562" y="25" width="148" height="55" rx="5" fill="#312e81" stroke="#10b981" stroke-width="2"/>
  <text x="636" y="44" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">PPO Fine-tuning</text>
  <text x="636" y="59" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">maximize reward model</text>
  <text x="636" y="71" font-family="monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">+ KL divergence penalty</text>

  <!-- GRPO (DeepSeek R1) -->
  <rect x="262" y="100" width="280" height="90" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="402" y="120" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">GRPO (DeepSeek-R1)</text>
  <text x="402" y="136" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Group Relative Policy Optimization</text>
  <text x="402" y="150" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">sample G completions → normalize rewards</text>
  <text x="402" y="163" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">no separate reward model needed</text>
  <text x="402" y="176" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">rule-based reward (math correct = +1, wrong = -1)</text>

  <!-- AlphaGo -->
  <rect x="555" y="100" width="155" height="90" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="633" y="120" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">AlphaGo / AlphaZero</text>
  <text x="633" y="136" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">MCTS + policy network</text>
  <text x="633" y="150" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">AlphaZero: self-play only</text>
  <text x="633" y="164" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">no human data needed</text>
  <text x="633" y="177" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">beat Lee Sedol 2016</text>
</svg>
