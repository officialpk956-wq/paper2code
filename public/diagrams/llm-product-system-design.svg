<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-gateway { stroke: #0ea5e9; }
    .box-cache { stroke: #10b981; fill: #10b981; fill-opacity: 0.1; }
    .box-llm { stroke: #7c3aed; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">LLM Product System Architecture</text>

  <!-- User -->
  <rect x="20" y="70" width="80" height="40" class="box" />
  <text x="60" y="90">App UI</text>
  <line x1="100" y1="90" x2="140" y2="90" class="arrow"/>

  <!-- API Gateway -->
  <rect x="140" y="50" width="120" height="80" class="box box-gateway" />
  <text x="200" y="70" fill="#0ea5e9">API Gateway</text>
  <text x="200" y="95" class="label">Rate Limiter</text>
  <text x="200" y="115" class="label">Cost Tracker</text>

  <line x1="260" y1="90" x2="300" y2="90" class="arrow"/>

  <!-- Semantic Cache -->
  <rect x="300" y="60" width="100" height="60" class="box box-cache" />
  <text x="350" y="80" fill="#10b981">Sem. Cache</text>
  <text x="350" y="100" class="label">(Redis)</text>
  
  <path d="M 350 120 L 350 150 L 100 150 L 100 110" fill="none" stroke="#10b981" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="220" y="140" class="label" fill="#10b981">Cache Hit (Fast Return)</text>

  <line x1="400" y1="90" x2="440" y2="90" class="arrow"/>

  <!-- LLM Provider -->
  <rect x="440" y="50" width="120" height="80" class="box box-llm" />
  <text x="500" y="70" fill="#7c3aed">LLM Server</text>
  <text x="500" y="95" class="label">vLLM / TGI</text>
  <text x="500" y="115" class="label">Guardrails</text>

  <!-- Streaming Output -->
  <path d="M 560 70 C 620 70, 620 180, 60 180 L 60 110" fill="none" stroke="#f59e0b" stroke-dasharray="2" marker-end="url(#arrowhead)"/>
  <text x="360" y="170" class="label" fill="#f59e0b">Server-Sent Events (SSE) Token Streaming</text>

</svg>
