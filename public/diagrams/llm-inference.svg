<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrli" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- KV Cache -->
  <text x="10" y="16" font-family="monospace" font-size="9" fill="#9ca3af">KV CACHE: avoid recomputing past tokens</text>
  <rect x="10" y="22" width="210" height="120" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Token row -->
  <text x="115" y="42" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Prompt: "The quick brown fox"</text>
  <rect x="15" y="50" width="44" height="24" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="37" y="66" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">The</text>
  <rect x="62" y="50" width="44" height="24" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="84" y="66" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">quick</text>
  <rect x="109" y="50" width="44" height="24" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="131" y="66" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">brown</text>
  <rect x="156" y="50" width="44" height="24" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1"/>
  <text x="178" y="66" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">fox</text>

  <text x="115" y="92" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">KV cache stores K,V for past tokens</text>
  <text x="115" y="106" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">New token attends via cache lookup</text>
  <text x="115" y="119" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Avoid: O(n²) → O(n) recompute</text>
  <text x="115" y="133" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Cost: seq_len × n_layers × 2 × d_head</text>

  <!-- PagedAttention -->
  <rect x="10" y="152" width="210" height="50" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="115" y="170" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">PagedAttention (vLLM)</text>
  <text x="115" y="185" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">KV cache in non-contiguous pages</text>
  <text x="115" y="197" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">like OS virtual memory · 24× throughput</text>

  <!-- Divider -->
  <line x1="228" y1="10" x2="228" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Continuous Batching -->
  <text x="238" y="16" font-family="monospace" font-size="9" fill="#9ca3af">CONTINUOUS BATCHING</text>
  <rect x="238" y="22" width="175" height="180" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="326" y="42" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Static batching:</text>
  <text x="326" y="57" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">wait for all seqs to finish</text>
  <text x="326" y="70" font-family="monospace" font-size="7" fill="#4b5563" text-anchor="middle">GPU idle while short seqs done</text>
  <text x="326" y="90" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Continuous batching:</text>
  <text x="326" y="105" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">insert new request when slot opens</text>
  <text x="326" y="118" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">36.9× throughput improvement</text>
  <text x="326" y="131" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">(Yu et al. 2022, vLLM default)</text>
  <text x="326" y="150" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Speculative Decoding:</text>
  <text x="326" y="165" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">small draft model → 5 tokens</text>
  <text x="326" y="178" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">large model verifies in 1 pass</text>
  <text x="326" y="191" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">2-3× faster, same quality</text>

  <!-- Divider -->
  <line x1="420" y1="10" x2="420" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Quantization -->
  <text x="430" y="16" font-family="monospace" font-size="9" fill="#9ca3af">QUANTIZATION</text>
  <rect x="430" y="22" width="140" height="88" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="42" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Weight quantization</text>
  <text x="500" y="57" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">FP32 → INT8: 4× size</text>
  <text x="500" y="70" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">FP32 → NF4: 8× size</text>
  <text x="500" y="83" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">AWQ: per-channel scale</text>
  <text x="500" y="96" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">GPTQ: post-train hessian</text>
  <text x="500" y="108" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">≤1% quality loss at 4-bit</text>

  <!-- Tensor Parallelism -->
  <rect x="430" y="118" width="140" height="85" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="136" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Tensor Parallelism</text>
  <text x="500" y="151" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">split weight matrices</text>
  <text x="500" y="164" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">across GPU columns/rows</text>
  <text x="500" y="177" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Megatron-LM style</text>
  <text x="500" y="190" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2-way, 4-way, 8-way split</text>

  <!-- Divider -->
  <line x1="578" y1="10" x2="578" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Latency breakdown -->
  <text x="588" y="16" font-family="monospace" font-size="9" fill="#9ca3af">LATENCY ANATOMY</text>
  <rect x="588" y="22" width="124" height="180" rx="5" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="650" y="42" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">TTFT (first token)</text>
  <text x="650" y="56" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">prompt processing</text>
  <text x="650" y="68" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">compute-bound</text>
  <text x="650" y="88" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">TBT (per token)</text>
  <text x="650" y="102" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">KV cache read</text>
  <text x="650" y="114" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">memory-bound</text>
  <text x="650" y="130" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">roofline: BW/params</text>
  <text x="650" y="150" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Optimizations</text>
  <text x="650" y="164" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">FlashAttention</text>
  <text x="650" y="176" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">PagedAttention</text>
  <text x="650" y="188" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Speculative decode</text>
</svg>
