<svg viewBox="0 0 640 260" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="260" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 4; }
    .border-red { stroke: #ef4444; }
    .border-green { stroke: #10b981; }
    .label { font-size: 11px; fill: #9ca3af; text-anchor: middle; }
    .title { font-size: 14px; font-weight: bold; fill: #ffffff; }
    .cache-box { fill: #374151; stroke: #9ca3af; stroke-dasharray: 4; rx: 4; }
  </style>

  <line x1="320" y1="20" x2="320" y2="240" stroke="#374151" stroke-width="2" stroke-dasharray="4"/>

  <text x="160" y="30" class="title">Without KV Cache</text>
  
  <text x="50" y="70" class="label">Step 1</text>
  <rect x="90" y="55" width="30" height="30" class="box border-red"/>
  <text x="105" y="70" fill="#ef4444">x</text>
  
  <text x="50" y="110" class="label">Step 2</text>
  <rect x="90" y="95" width="30" height="30" class="box border-red"/>
  <text x="105" y="110" fill="#ef4444">x</text>
  <rect x="130" y="95" width="30" height="30" class="box border-red"/>
  <text x="145" y="110" fill="#ef4444">x</text>
  
  <text x="50" y="150" class="label">Step 3</text>
  <rect x="90" y="135" width="30" height="30" class="box border-red"/>
  <text x="105" y="150" fill="#ef4444">x</text>
  <rect x="130" y="135" width="30" height="30" class="box border-red"/>
  <text x="145" y="150" fill="#ef4444">x</text>
  <rect x="170" y="135" width="30" height="30" class="box border-red"/>
  <text x="185" y="150" fill="#ef4444">x</text>

  <text x="160" y="210" class="label" fill="#ef4444">Recompute all previous tokens</text>


  <text x="480" y="30" class="title">With KV Cache</text>

  <text x="360" y="70" class="label">Step 1</text>
  <rect x="400" y="55" width="30" height="30" class="box border-green"/>
  <text x="415" y="70" fill="#10b981">✓</text>
  <rect x="440" y="55" width="50" height="30" class="cache-box"/>
  <text x="465" y="70">K, V</text>
  
  <text x="360" y="110" class="label">Step 2</text>
  <rect x="400" y="95" width="30" height="30" class="cache-box"/>
  <text x="415" y="110">...</text>
  <rect x="440" y="95" width="30" height="30" class="box border-green"/>
  <text x="455" y="110" fill="#10b981">✓</text>
  <rect x="480" y="95" width="50" height="30" class="cache-box"/>
  <text x="505" y="110">K, V</text>

  <text x="360" y="150" class="label">Step 3</text>
  <rect x="400" y="135" width="30" height="30" class="cache-box"/>
  <text x="415" y="150">...</text>
  <rect x="440" y="135" width="30" height="30" class="cache-box"/>
  <text x="455" y="150">...</text>
  <rect x="480" y="135" width="30" height="30" class="box border-green"/>
  <text x="495" y="150" fill="#10b981">✓</text>
  <rect x="520" y="135" width="50" height="30" class="cache-box"/>
  <text x="545" y="150">K, V</text>

  <text x="480" y="210" class="label" fill="#10b981">Only compute the new token</text>
  
  <rect x="360" y="225" width="240" height="25" fill="#374151" rx="4"/>
  <text x="480" y="237.5" font-size="10">KV Cache: batch x heads x seq x dim x layers x 2</text>
</svg>
