<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrssl" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- SimCLR / Contrastive -->
  <text x="10" y="16" font-family="monospace" font-size="9" fill="#9ca3af">CONTRASTIVE LEARNING (SimCLR / MoCo)</text>
  <rect x="10" y="24" width="220" height="150" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Image with two augmentations -->
  <text x="115" y="42" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Same image, two augmentations</text>
  <rect x="20" y="50" width="70" height="50" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1"/>
  <text x="55" y="72" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">crop+blur</text>
  <text x="55" y="84" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">view 1</text>
  <rect x="130" y="50" width="70" height="50" rx="3" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1"/>
  <text x="165" y="72" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">jitter+flip</text>
  <text x="165" y="84" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">view 2</text>
  <!-- Encoder -->
  <rect x="45" y="108" width="40" height="24" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="65" y="124" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">f(·)</text>
  <rect x="145" y="108" width="40" height="24" rx="3" fill="#312e81" stroke="#7c3aed" stroke-width="1"/>
  <text x="165" y="124" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">f(·)</text>
  <!-- Loss -->
  <text x="115" y="150" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">NT-Xent loss: pull same-image</text>
  <text x="115" y="163" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">embeddings together, push</text>
  <text x="115" y="175" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">different-image embeddings apart</text>

  <!-- Divider -->
  <line x1="238" y1="10" x2="238" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- MAE / BYOL -->
  <text x="248" y="16" font-family="monospace" font-size="9" fill="#9ca3af">NON-CONTRASTIVE (BYOL / MAE)</text>
  <rect x="248" y="24" width="215" height="150" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="355" y="42" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">BYOL (Bootstrap Your Own Latent)</text>
  <text x="355" y="58" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">online network f_θ → predict target</text>
  <text x="355" y="71" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">target network f_ξ (EMA of online)</text>
  <text x="355" y="84" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">no negative samples needed!</text>

  <line x1="355" y1="90" x2="355" y2="100" stroke="#374151" stroke-width="1"/>

  <text x="355" y="115" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">MAE (Masked Autoencoder)</text>
  <text x="355" y="130" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">mask 75% of image patches</text>
  <text x="355" y="143" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">reconstruct masked patches</text>
  <text x="355" y="156" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">ViT encoder + lightweight decoder</text>
  <text x="355" y="169" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">He et al. 2022 (Meta AI)</text>

  <!-- Divider -->
  <line x1="470" y1="10" x2="470" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Results / Application -->
  <text x="480" y="16" font-family="monospace" font-size="9" fill="#9ca3af">WHAT SSL LEARNS</text>
  <rect x="480" y="24" width="230" height="75" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="595" y="43" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Linear probing on ImageNet</text>
  <text x="595" y="57" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">SimCLR-v2 (ResNet-152): 79.8%</text>
  <text x="595" y="70" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">BYOL: 74.3%</text>
  <text x="595" y="83" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">MAE + fine-tune: 87.8%</text>
  <text x="595" y="92" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Supervised ResNet-50: 76.1%</text>

  <rect x="480" y="108" width="230" height="65" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="595" y="126" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">Why it matters for LLMs</text>
  <text x="595" y="141" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">GPT's next-token prediction = SSL</text>
  <text x="595" y="154" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">BERT's masked LM = SSL</text>
  <text x="595" y="167" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Pretrain without labels → label</text>
  <text x="595" y="180" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">efficient downstream fine-tuning</text>

  <rect x="480" y="182" width="230" height="20" rx="3" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="595" y="196" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">Key: augmentation defines what "same" means</text>
</svg>
