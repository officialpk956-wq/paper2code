<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-data { stroke: #06b6d4; }
    .box-train { stroke: #7c3aed; }
    .box-serve { stroke: #10b981; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">MLOps Lifecycle Architecture</text>

  <!-- Data / Feature Store -->
  <rect x="20" y="50" width="120" height="60" class="box box-data" />
  <text x="80" y="70">Feature Store</text>
  <text x="80" y="90" class="label">(Hive / Redis)</text>
  <line x1="140" y1="80" x2="180" y2="80" class="arrow"/>
  
  <!-- Training / MLflow -->
  <rect x="180" y="50" width="140" height="60" class="box box-train" />
  <text x="250" y="70">Model Training</text>
  <text x="250" y="90" class="label">(Exp. Tracking)</text>
  <line x1="320" y1="80" x2="360" y2="80" class="arrow"/>
  
  <!-- Model Registry / CI-CD -->
  <rect x="360" y="50" width="140" height="60" class="box box-train" stroke="#f59e0b" fill="#f59e0b" fill-opacity="0.1"/>
  <text x="430" y="70" fill="#f59e0b">Model Registry</text>
  <text x="430" y="90" class="label" fill="#fcd34d">Staging → Prod</text>
  <line x1="500" y1="80" x2="540" y2="80" class="arrow"/>

  <!-- Serving & Monitoring -->
  <rect x="540" y="50" width="160" height="60" class="box box-serve" />
  <text x="620" y="70">Online Serving</text>
  <text x="620" y="90" class="label">(Low Latency API)</text>

  <!-- Feedback Loop -->
  <line x1="620" y1="110" x2="620" y2="150" class="arrow"/>
  <rect x="360" y="130" width="140" height="40" class="box" stroke="#ef4444"/>
  <text x="430" y="150">Monitoring</text>
  <line x1="360" y1="150" x2="250" y2="150" class="arrow"/>
  <line x1="250" y1="150" x2="250" y2="110" class="arrow"/>
  
  <text x="540" y="140" class="label">User Interactions</text>
  <text x="300" y="140" class="label">Drift Alerts</text>

</svg>
