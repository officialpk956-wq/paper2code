<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-discrete { stroke: #ef4444; }
    .box-ode { stroke: #10b981; fill: #10b981; fill-opacity: 0.1; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
    .math { font-family: serif; font-style: italic; font-size: 12px; fill: #fcd34d; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Discrete ResNet vs. Continuous Neural ODE</text>

  <!-- Discrete ResNet -->
  <text x="180" y="50" class="label" fill="#ef4444">Discrete Layers (ResNet)</text>
  
  <rect x="40" y="70" width="80" height="40" class="box box-discrete" />
  <text x="80" y="90">$h_t$</text>

  <line x1="120" y1="90" x2="160" y2="90" class="arrow"/>
  <path d="M 80 70 C 80 30, 200 30, 200 70" fill="none" stroke="#ef4444" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="140" y="45" class="label">Skip Conn.</text>

  <rect x="160" y="70" width="80" height="40" class="box box-discrete" />
  <text x="200" y="90">$h_{t+1}$</text>
  
  <text x="140" y="130" class="math">$h_{t+1} = h_t + f(h_t, \theta_t)$</text>

  <!-- Vertical Divider -->
  <line x1="360" y1="40" x2="360" y2="180" stroke="#4b5563" stroke-dasharray="4"/>

  <!-- Neural ODE -->
  <text x="540" y="50" class="label" fill="#10b981">Continuous Depth (Neural ODE)</text>

  <rect x="400" y="70" width="80" height="40" class="box" />
  <text x="440" y="90">$h(t_0)$</text>

  <line x1="480" y1="90" x2="520" y2="90" class="arrow"/>

  <rect x="520" y="60" width="100" height="60" class="box box-ode" />
  <text x="570" y="80">ODE Solver</text>
  <text x="570" y="100" class="label">(e.g. RK4)</text>

  <line x1="620" y1="90" x2="660" y2="90" class="arrow"/>

  <rect x="660" y="70" width="40" height="40" class="box" />
  <text x="680" y="90">$h(t_1)$</text>

  <text x="570" y="130" class="math">$\frac{dh(t)}{dt} = f(h(t), t, \theta)$</text>
  <text x="570" y="150" class="label">Evaluated at arbitrary continuous points</text>

</svg>
