<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrd" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrdg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Forward process (top row - left to right = adding noise) -->
  <text x="10" y="22" font-family="monospace" font-size="10" fill="#9ca3af">FORWARD PROCESS q(xₜ|xₜ₋₁): add noise step by step (T=1000 steps)</text>

  <!-- Clean image -->
  <rect x="10" y="32" width="70" height="60" rx="5" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="45" y="58" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">x₀</text>
  <text x="45" y="72" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">clean</text>
  <text x="45" y="84" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">image</text>

  <line x1="80" y1="62" x2="108" y2="62" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrd)"/>
  <text x="94" y="56" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">+noise</text>

  <rect x="110" y="32" width="70" height="60" rx="5" fill="#1a2a3f" stroke="#4b5563" stroke-width="1.5"/>
  <text x="145" y="62" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">x₁₀₀</text>
  <text x="145" y="76" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">slightly</text>
  <text x="145" y="86" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">noisy</text>

  <line x1="180" y1="62" x2="218" y2="62" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrd)"/>

  <rect x="220" y="32" width="70" height="60" rx="5" fill="#1a1a2e" stroke="#374151" stroke-width="1.5"/>
  <text x="255" y="62" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">x₅₀₀</text>
  <text x="255" y="76" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">half</text>
  <text x="255" y="86" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">noise</text>

  <line x1="290" y1="62" x2="328" y2="62" stroke="#374151" stroke-width="1.5" marker-end="url(#arrd)"/>

  <rect x="330" y="32" width="70" height="60" rx="5" fill="#111" stroke="#374151" stroke-width="1.5"/>
  <text x="365" y="62" font-family="monospace" font-size="8" fill="#4b5563" text-anchor="middle">x₁₀₀₀</text>
  <text x="365" y="76" font-family="monospace" font-size="8" fill="#4b5563" text-anchor="middle">pure</text>
  <text x="365" y="86" font-family="monospace" font-size="8" fill="#4b5563" text-anchor="middle">noise</text>

  <!-- Divider -->
  <line x1="420" y1="20" x2="420" y2="120" stroke="#374151" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="420" y="15" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">latent</text>

  <!-- LDM: encode to latent space first -->
  <rect x="430" y="32" width="100" height="60" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="52" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">VAE Encoder</text>
  <text x="480" y="66" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">512×512 image</text>
  <text x="480" y="80" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">→ 64×64 latent</text>

  <line x1="530" y1="62" x2="558" y2="62" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrd)"/>

  <rect x="560" y="32" width="100" height="60" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="610" y="52" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Diffuse in</text>
  <text x="610" y="66" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">latent space</text>
  <text x="610" y="80" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">LDM/Stable Diff</text>

  <!-- Reverse process (bottom row - right to left = removing noise) -->
  <text x="10" y="130" font-family="monospace" font-size="10" fill="#9ca3af">REVERSE PROCESS pθ(xₜ₋₁|xₜ): U-Net predicts noise to remove at each step</text>

  <rect x="10" y="142" width="160" height="45" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="90" y="162" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Generated image x₀</text>
  <text x="90" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">DDIM: 50 steps · DDPM: 1000</text>

  <line x1="172" y1="164" x2="240" y2="164" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrdg)"/>

  <rect x="242" y="142" width="200" height="45" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="342" y="162" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">U-Net (or DiT) predicts ε̂</text>
  <text x="342" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">text conditioning via cross-attention</text>

  <line x1="444" y1="164" x2="492" y2="164" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrdg)"/>

  <rect x="494" y="142" width="120" height="45" rx="5" fill="#111" stroke="#4b5563" stroke-width="1.5"/>
  <text x="554" y="162" font-family="monospace" font-size="9" fill="#4b5563" text-anchor="middle">Random noise</text>
  <text x="554" y="177" font-family="monospace" font-size="8" fill="#374151" text-anchor="middle">xₜ ~ N(0, I)</text>
</svg>
