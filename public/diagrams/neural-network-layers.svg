<svg viewBox="0 0 520 260" xmlns="http://www.w3.org/2000/svg" style="background:#0f1115">
  <!-- Connection lines: input → hidden -->
  <g stroke="#334155" stroke-width="1" opacity="0.6">
    <line x1="100" y1="55" x2="260" y2="42"/>
    <line x1="100" y1="55" x2="260" y2="95"/>
    <line x1="100" y1="55" x2="260" y2="148"/>
    <line x1="100" y1="55" x2="260" y2="200"/>
    <line x1="100" y1="115" x2="260" y2="42"/>
    <line x1="100" y1="115" x2="260" y2="95"/>
    <line x1="100" y1="115" x2="260" y2="148"/>
    <line x1="100" y1="115" x2="260" y2="200"/>
    <line x1="100" y1="175" x2="260" y2="42"/>
    <line x1="100" y1="175" x2="260" y2="95"/>
    <line x1="100" y1="175" x2="260" y2="148"/>
    <line x1="100" y1="175" x2="260" y2="200"/>
  </g>
  <!-- Connection lines: hidden → output -->
  <g stroke="#334155" stroke-width="1" opacity="0.6">
    <line x1="260" y1="42" x2="420" y2="95"/>
    <line x1="260" y1="42" x2="420" y2="165"/>
    <line x1="260" y1="95" x2="420" y2="95"/>
    <line x1="260" y1="95" x2="420" y2="165"/>
    <line x1="260" y1="148" x2="420" y2="95"/>
    <line x1="260" y1="148" x2="420" y2="165"/>
    <line x1="260" y1="200" x2="420" y2="95"/>
    <line x1="260" y1="200" x2="420" y2="165"/>
  </g>
  <!-- Input nodes -->
  <g fill="#7c3aed" stroke="#a855f7" stroke-width="1.5">
    <circle cx="100" cy="55" r="18"/>
    <circle cx="100" cy="115" r="18"/>
    <circle cx="100" cy="175" r="18"/>
  </g>
  <!-- Hidden nodes -->
  <g fill="#0e7490" stroke="#06b6d4" stroke-width="1.5">
    <circle cx="260" cy="42" r="18"/>
    <circle cx="260" cy="95" r="18"/>
    <circle cx="260" cy="148" r="18"/>
    <circle cx="260" cy="200" r="18"/>
  </g>
  <!-- Output nodes -->
  <g fill="#065f46" stroke="#10b981" stroke-width="1.5">
    <circle cx="420" cy="95" r="18"/>
    <circle cx="420" cy="165" r="18"/>
  </g>
  <!-- Labels -->
  <g fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">
    <text x="100" y="222">Input</text>
    <text x="100" y="234">Layer</text>
    <text x="260" y="232">Hidden</text>
    <text x="260" y="244">Layer</text>
    <text x="420" y="200">Output</text>
    <text x="420" y="212">Layer</text>
  </g>
  <!-- Node labels -->
  <g fill="white" font-family="monospace" font-size="9" text-anchor="middle" font-weight="bold">
    <text x="100" y="59">x₁</text>
    <text x="100" y="119">x₂</text>
    <text x="100" y="179">x₃</text>
    <text x="260" y="46">h₁</text>
    <text x="260" y="99">h₂</text>
    <text x="260" y="152">h₃</text>
    <text x="260" y="204">h₄</text>
    <text x="420" y="99">ŷ₁</text>
    <text x="420" y="169">ŷ₂</text>
  </g>
</svg>
