<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arremb" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="10" y="16" font-family="monospace" font-size="9" fill="#9ca3af">WORD EMBEDDING METHODS</text>

  <!-- Word2Vec CBOW -->
  <rect x="10" y="24" width="160" height="80" rx="4" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="40" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Word2Vec CBOW</text>
  <text x="90" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">context words → target word</text>
  <text x="90" y="67" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">[the, fox] → quick</text>
  <text x="90" y="79" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">window size k=2</text>
  <text x="90" y="91" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">skip-gram: reverse direction</text>
  <text x="90" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">target → context words</text>

  <!-- GloVe -->
  <rect x="185" y="24" width="160" height="80" rx="4" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="265" y="40" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">GloVe</text>
  <text x="265" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">global co-occurrence matrix X</text>
  <text x="265" y="67" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">loss: (wᵢ·w̃ⱼ+bᵢ+b̃ⱼ-log Xᵢⱼ)²</text>
  <text x="265" y="79" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">king-man+woman ≈ queen</text>
  <text x="265" y="91" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">50/100/200/300-d vectors</text>
  <text x="265" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">trained on 840B token corpus</text>

  <!-- FastText -->
  <rect x="360" y="24" width="160" height="80" rx="4" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="440" y="40" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">FastText</text>
  <text x="440" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">char n-gram subwords</text>
  <text x="440" y="67" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">eating → eat, ati, tin, ing</text>
  <text x="440" y="79" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">word = sum of subword vectors</text>
  <text x="440" y="91" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">OOV: sum character n-grams</text>
  <text x="440" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">great for morphology-rich langs</text>

  <!-- Contextual -->
  <rect x="535" y="24" width="175" height="80" rx="4" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="622" y="40" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Contextual Embeddings</text>
  <text x="622" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">ELMo: biLSTM hidden states</text>
  <text x="622" y="67" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">BERT: Transformer encoder</text>
  <text x="622" y="79" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">"bank" embedding differs by</text>
  <text x="622" y="91" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">context: money vs river</text>
  <text x="622" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">one vector per context, not word</text>

  <!-- Analogy space illustration -->
  <text x="10" y="124" font-family="monospace" font-size="9" fill="#9ca3af">EMBEDDING SPACE GEOMETRY</text>
  <rect x="10" y="130" width="700" height="60" rx="4" fill="#1a1d24" stroke="#374151" stroke-width="1"/>

  <!-- vector algebra visual -->
  <circle cx="80" cy="160" r="5" fill="#7c3aed"/>
  <text x="80" y="152" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">king</text>
  <circle cx="160" cy="145" r="5" fill="#7c3aed"/>
  <text x="160" y="137" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">queen</text>
  <circle cx="80" cy="175" r="5" fill="#06b6d4"/>
  <text x="80" y="192" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">man</text>
  <circle cx="160" cy="160" r="5" fill="#06b6d4"/>
  <text x="160" y="175" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">woman</text>
  <line x1="85" y1="160" x2="155" y2="148" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arremb)"/>
  <line x1="85" y1="175" x2="155" y2="162" stroke="#10b981" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arremb)"/>
  <line x1="80" y1="168" x2="80" y2="155" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="160" y1="153" x2="160" y2="140" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="250" y="150" font-family="monospace" font-size="8" fill="#6ee7b7">king − man + woman ≈ queen</text>
  <text x="250" y="164" font-family="monospace" font-size="7" fill="#9ca3af">Paris − France + Germany ≈ Berlin</text>
  <text x="250" y="178" font-family="monospace" font-size="7" fill="#9ca3af">similar words cluster in vector space</text>
  <text x="480" y="150" font-family="monospace" font-size="7" fill="#9ca3af">static embeddings: one vector/word</text>
  <text x="480" y="164" font-family="monospace" font-size="7" fill="#fcd34d">contextual: one vector/occurrence</text>
  <text x="480" y="178" font-family="monospace" font-size="7" fill="#9ca3af">BERT: 768-d per token per layer</text>
</svg>
