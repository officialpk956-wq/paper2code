<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="220" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrgo" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- GAN Core (leftmost) -->
  <rect x="10" y="80" width="100" height="60" rx="6" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="60" y="100" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">GAN</text>
  <text x="60" y="114" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Goodfellow</text>
  <text x="60" y="126" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">2014</text>

  <!-- DCGAN -->
  <rect x="135" y="60" width="100" height="55" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="185" y="80" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">DCGAN</text>
  <text x="185" y="95" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">convolutions</text>
  <text x="185" y="107" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">2015</text>

  <!-- cGAN -->
  <rect x="135" y="125" width="100" height="55" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="185" y="145" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">cGAN</text>
  <text x="185" y="160" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">class-conditioned</text>
  <text x="185" y="172" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">2014</text>

  <!-- CycleGAN -->
  <rect x="260" y="55" width="110" height="55" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="315" y="76" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">CycleGAN</text>
  <text x="315" y="91" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">unpaired domains</text>
  <text x="315" y="103" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">2017</text>

  <!-- ProGAN -->
  <rect x="260" y="120" width="110" height="55" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="315" y="141" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">ProGAN</text>
  <text x="315" y="156" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">progressive grow</text>
  <text x="315" y="168" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">4×4 → 1024px</text>

  <!-- StyleGAN -->
  <rect x="395" y="80" width="115" height="65" rx="6" fill="#312e81" stroke="#f59e0b" stroke-width="2"/>
  <text x="453" y="100" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">StyleGAN</text>
  <text x="453" y="115" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">W-space disentangle</text>
  <text x="453" y="129" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">AdaIN style inject</text>
  <text x="453" y="140" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">NVIDIA 2018</text>

  <!-- StyleGAN2 -->
  <rect x="535" y="50" width="115" height="60" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="593" y="70" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">StyleGAN2</text>
  <text x="593" y="85" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">weight demod</text>
  <text x="593" y="98" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">path length reg</text>
  <text x="593" y="108" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">2019</text>

  <!-- StyleGAN3 -->
  <rect x="535" y="130" width="115" height="60" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="593" y="150" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">StyleGAN3</text>
  <text x="593" y="165" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">alias-free</text>
  <text x="593" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">video coherent</text>
  <text x="593" y="188" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">2021</text>

  <!-- Arrows -->
  <line x1="110" y1="100" x2="133" y2="85" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="110" y1="110" x2="133" y2="150" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="235" y1="80" x2="258" y2="78" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="235" y1="140" x2="258" y2="145" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrg)"/>
  <line x1="370" y1="147" x2="393" y2="125" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrgo)"/>
  <line x1="510" y1="105" x2="533" y2="80" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrgo)"/>
  <line x1="510" y1="120" x2="533" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrgo)"/>

  <text x="360" y="208" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">GAN lineage: minimax game → style disentanglement → video coherence</text>
</svg>
