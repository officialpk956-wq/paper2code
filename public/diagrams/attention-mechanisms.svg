<svg viewBox="0 0 720 215" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="215" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arram" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- MHA diagram -->
  <text x="10" y="16" font-family="monospace" font-size="9" fill="#9ca3af">MULTI-HEAD ATTENTION (standard)</text>

  <!-- Input tokens -->
  <rect x="10" y="24" width="180" height="28" rx="4" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="100" y="43" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Input sequence x ∈ R^{seq×d_model}</text>

  <!-- Q K V projections -->
  <line x1="100" y1="52" x2="100" y2="62" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arram)"/>

  <rect x="10" y="64" width="55" height="28" rx="4" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="38" y="83" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">W_Q</text>

  <rect x="73" y="64" width="55" height="28" rx="4" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="100" y="83" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">W_K</text>

  <rect x="136" y="64" width="55" height="28" rx="4" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="163" y="83" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">W_V</text>

  <!-- Attention formula -->
  <rect x="10" y="102" width="180" height="50" rx="4" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="100" y="120" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">Attn = softmax(QKᵀ/√d_k)V</text>
  <text x="100" y="136" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">O(seq² · d_head) per head</text>
  <text x="100" y="148" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">H heads → concat → W_O</text>

  <!-- Dividers -->
  <line x1="200" y1="10" x2="200" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="10" x2="390" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="560" y1="10" x2="560" y2="205" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- GQA / MQA -->
  <text x="210" y="16" font-family="monospace" font-size="9" fill="#9ca3af">GROUPED QUERY ATTENTION</text>
  <rect x="210" y="24" width="170" height="90" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="295" y="45" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">MHA: H Q heads, H K/V heads</text>
  <text x="295" y="62" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">MQA: H Q heads, 1 K/V head</text>
  <text x="295" y="79" font-family="monospace" font-size="9" fill="#a5b4fc" text-anchor="middle">GQA: H Q heads, G K/V groups</text>
  <text x="295" y="96" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">GQA used in Llama 2/3, Mistral</text>
  <text x="295" y="108" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">KV cache: G/H × original size</text>

  <!-- RoPE -->
  <rect x="210" y="125" width="170" height="75" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="295" y="143" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">RoPE</text>
  <text x="295" y="158" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">rotate Q,K by position</text>
  <text x="295" y="172" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">relative position baked in</text>
  <text x="295" y="185" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">extrapolates beyond train len</text>
  <text x="295" y="196" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Llama, PaLM, GPT-NeoX</text>

  <!-- Flash Attention -->
  <text x="400" y="16" font-family="monospace" font-size="9" fill="#9ca3af">FLASH ATTENTION (IO-aware)</text>
  <rect x="400" y="24" width="150" height="110" rx="5" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="475" y="44" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">Standard attention:</text>
  <text x="475" y="58" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Q,K,V → HBM → S=QKᵀ → HBM</text>
  <text x="475" y="71" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">→ P=softmax(S) → HBM → O=PV</text>
  <text x="475" y="84" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">5 HBM reads/writes per step</text>
  <text x="475" y="100" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">FlashAttention:</text>
  <text x="475" y="114" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">tile in SRAM, fuse all ops</text>
  <text x="475" y="126" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">2-4× faster, O(1) memory</text>

  <!-- MLA (DeepSeek) -->
  <rect x="400" y="145" width="150" height="55" rx="5" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="475" y="163" font-family="monospace" font-size="9" fill="#fcd34d" text-anchor="middle">MLA (DeepSeek)</text>
  <text x="475" y="178" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">K+V → low-rank latent c_KV</text>
  <text x="475" y="191" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">6× KV cache reduction</text>

  <!-- Causal vs full mask -->
  <rect x="572" y="24" width="140" height="175" rx="5" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="642" y="42" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Attention Patterns</text>
  <text x="642" y="60" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">Full (BERT encoder)</text>
  <text x="642" y="72" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">every token attends to all</text>
  <text x="642" y="92" font-family="monospace" font-size="8" fill="#fcd34d" text-anchor="middle">Causal (GPT decoder)</text>
  <text x="642" y="104" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">attend to past tokens only</text>
  <text x="642" y="122" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">Sliding Window</text>
  <text x="642" y="134" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">nearest W tokens only</text>
  <text x="642" y="146" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">Mistral, Longformer</text>
  <text x="642" y="164" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">Cross-attention</text>
  <text x="642" y="176" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Q from decoder</text>
  <text x="642" y="188" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">K,V from encoder</text>
</svg>
