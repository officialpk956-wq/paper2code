<svg viewBox="0 0 720 220" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="220" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrtf" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Original Transformer (center) -->
  <rect x="290" y="80" width="140" height="55" rx="6" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="360" y="100" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">Transformer</text>
  <text x="360" y="115" font-family="monospace" font-size="9" fill="#a5b4fc" text-anchor="middle">Vaswani 2017</text>
  <text x="360" y="128" font-family="monospace" font-size="8" fill="#818cf8" text-anchor="middle">encoder + decoder</text>

  <!-- Encoder-only family (BERT) -->
  <rect x="30" y="30" width="130" height="60" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="95" y="50" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">BERT family</text>
  <text x="95" y="64" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">encoder-only</text>
  <text x="95" y="78" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">masked LM</text>
  <text x="95" y="88" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">BERT/RoBERTa/ALBERT</text>

  <!-- Decoder-only family (GPT) -->
  <rect x="30" y="130" width="130" height="60" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="95" y="150" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">GPT family</text>
  <text x="95" y="164" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">decoder-only</text>
  <text x="95" y="178" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">causal LM</text>
  <text x="95" y="188" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">GPT-2/3/4 · LLaMA</text>

  <!-- Encoder-decoder family (T5) -->
  <rect x="30" y="80" width="130" height="45" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="95" y="98" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">T5 / BART</text>
  <text x="95" y="112" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">enc-dec · text-to-text</text>

  <!-- Vision family -->
  <rect x="560" y="30" width="150" height="60" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="635" y="50" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">ViT family</text>
  <text x="635" y="64" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">image patches</text>
  <text x="635" y="78" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">ViT / Swin / DeiT</text>
  <text x="635" y="88" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">detection · seg</text>

  <!-- MoE family -->
  <rect x="560" y="100" width="150" height="50" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="635" y="120" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">MoE / Efficient</text>
  <text x="635" y="134" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Mixtral · DeepSeek</text>
  <text x="635" y="144" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">256 experts, top-K</text>

  <!-- Multimodal family -->
  <rect x="560" y="160" width="150" height="45" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="635" y="178" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">Multimodal</text>
  <text x="635" y="194" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">GPT-4o · Gemini · LLaVA</text>

  <!-- Arrows from Transformer -->
  <line x1="290" y1="95" x2="162" y2="60" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrtf)"/>
  <line x1="290" y1="107" x2="162" y2="102" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrtf)"/>
  <line x1="290" y1="120" x2="162" y2="155" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrtf)"/>
  <line x1="430" y1="95" x2="558" y2="58" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrtf)"/>
  <line x1="430" y1="107" x2="558" y2="120" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrtf)"/>
  <line x1="430" y1="120" x2="558" y2="175" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrtf)"/>

  <text x="360" y="205" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">All modern AI families descend from the 2017 Transformer paper</text>
</svg>
