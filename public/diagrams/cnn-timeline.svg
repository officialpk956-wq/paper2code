<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <!-- Timeline line -->
  <line x1="20" y1="100" x2="700" y2="100" stroke="#374151" stroke-width="2"/>
  <!-- Year markers -->
  <g font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">
    <text x="40" y="170">1998</text>
    <text x="130" y="170">2012</text>
    <text x="205" y="170">2014</text>
    <text x="285" y="170">2015</text>
    <text x="380" y="170">2017</text>
    <text x="460" y="170">2019</text>
    <text x="560" y="170">2022</text>
    <text x="660" y="170">2024</text>
  </g>
  <!-- Architecture nodes -->
  <!-- LeNet -->
  <circle cx="40" cy="100" r="6" fill="#374151" stroke="#6b7280" stroke-width="1.5"/>
  <text x="40" y="90" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">LeNet</text>
  <text x="40" y="80" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">conv+pool</text>

  <!-- AlexNet -->
  <circle cx="130" cy="100" r="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="130" y="85" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">AlexNet</text>
  <text x="130" y="75" font-family="monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">GPU+ReLU+Drop</text>
  <text x="130" y="65" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">ImageNet −10%</text>

  <!-- VGG + ResNet same year approx -->
  <circle cx="205" cy="100" r="7" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="205" y="87" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">VGG</text>
  <text x="205" y="77" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">3×3 depth</text>

  <!-- ResNet -->
  <circle cx="285" cy="100" r="10" fill="#7c3aed" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="285" y="115" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">ResNet</text>
  <text x="285" y="125" font-family="monospace" font-size="7" fill="#a5b4fc" text-anchor="middle">skip connections</text>
  <text x="285" y="135" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">152 layers!</text>

  <!-- SENet / MobileNet area -->
  <circle cx="380" cy="100" r="7" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="380" y="87" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">MobileNet</text>
  <text x="380" y="77" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">depthwise sep</text>

  <!-- EfficientNet -->
  <circle cx="460" cy="100" r="9" fill="#1e3a5f" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="460" y="115" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">EfficientNet</text>
  <text x="460" y="125" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">compound scale</text>

  <!-- ConvNeXt -->
  <circle cx="560" cy="100" r="9" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="560" y="87" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">ConvNeXt</text>
  <text x="560" y="77" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">modernized ResNet</text>
  <text x="560" y="67" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">matches Swin</text>

  <!-- ViT era marker -->
  <line x1="600" y1="40" x2="600" y2="160" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="650" y="55" font-family="monospace" font-size="8" fill="#7c3aed" text-anchor="middle">ViT era: CNN</text>
  <text x="650" y="67" font-family="monospace" font-size="8" fill="#7c3aed" text-anchor="middle">must compete</text>
  <text x="650" y="79" font-family="monospace" font-size="8" fill="#7c3aed" text-anchor="middle">with Transformers</text>

  <text x="360" y="195" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Node size ∝ architectural significance | Yellow = landmark results | Green = modern era</text>
</svg>
