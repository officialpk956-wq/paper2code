<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-enc { stroke: #0ea5e9; }
    .box-proj { stroke: #7c3aed; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Contrastive Learning (SimCLR Framework)</text>

  <!-- Base Image -->
  <rect x="40" y="80" width="80" height="60" class="box" />
  <text x="80" y="110">Image $x$</text>

  <!-- Augmentations -->
  <path d="M 120 110 L 160 70 L 180 70" fill="none" class="arrow"/>
  <path d="M 120 110 L 160 150 L 180 150" fill="none" class="arrow"/>

  <rect x="180" y="50" width="80" height="40" class="box" />
  <text x="220" y="70">Crop+Color</text>
  <text x="220" y="100" class="label">$x_i$</text>

  <rect x="180" y="130" width="80" height="40" class="box" />
  <text x="220" y="150">Crop+Blur</text>
  <text x="220" y="180" class="label">$x_j$</text>

  <!-- Encoders -->
  <line x1="260" y1="70" x2="300" y2="70" class="arrow"/>
  <line x1="260" y1="150" x2="300" y2="150" class="arrow"/>

  <rect x="300" y="50" width="100" height="40" class="box box-enc" />
  <text x="350" y="70">Encoder $f$</text>

  <rect x="300" y="130" width="100" height="40" class="box box-enc" />
  <text x="350" y="150">Encoder $f$</text>
  
  <text x="350" y="110" class="label">(Shared Weights)</text>

  <!-- Projection Heads -->
  <line x1="400" y1="70" x2="440" y2="70" class="arrow"/>
  <line x1="400" y1="150" x2="440" y2="150" class="arrow"/>

  <rect x="440" y="50" width="100" height="40" class="box box-proj" />
  <text x="490" y="70">Proj. Head $g$</text>

  <rect x="440" y="130" width="100" height="40" class="box box-proj" />
  <text x="490" y="150">Proj. Head $g$</text>

  <!-- Contrastive Loss -->
  <line x1="540" y1="70" x2="600" y2="110" class="arrow"/>
  <line x1="540" y1="150" x2="600" y2="110" class="arrow"/>

  <rect x="600" y="90" width="100" height="40" fill="none" stroke="#10b981" rx="6" stroke-width="2"/>
  <text x="650" y="110" fill="#10b981">Maximize Sim.</text>
  <text x="650" y="140" class="label">Pull positive pairs</text>
  <text x="650" y="155" class="label">Push negative pairs</text>

</svg>
