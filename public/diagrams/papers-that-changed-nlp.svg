<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; stroke: #0ea5e9; }
    .line { stroke: #4b5563; stroke-width: 4; }
    .dot { fill: #0ea5e9; }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .year { font-size: 11px; fill: #fcd34d; font-weight: bold; }
    .desc { font-size: 10px; fill: #9ca3af; }
  </style>

  <text x="360" y="20" class="title">Papers That Changed NLP (2013 - 2020)</text>

  <!-- Timeline Line -->
  <line x1="40" y1="100" x2="680" y2="100" class="line"/>

  <!-- 2013 Word2Vec -->
  <circle cx="80" cy="100" r="6" class="dot"/>
  <text x="80" y="75" class="year">2013</text>
  <rect x="30" y="115" width="100" height="30" class="box" />
  <text x="80" y="130">Word2Vec</text>
  <text x="80" y="160" class="desc">Dense embeddings</text>

  <!-- 2014 Seq2Seq -->
  <circle cx="180" cy="100" r="6" class="dot"/>
  <text x="180" y="75" class="year">2014</text>
  <rect x="130" y="25" width="100" height="30" class="box" />
  <text x="180" y="40">Seq2Seq</text>
  <text x="180" y="120" class="desc">Enc-Dec RNN</text>

  <!-- 2015 Attention -->
  <circle cx="280" cy="100" r="6" class="dot"/>
  <text x="280" y="75" class="year">2015</text>
  <rect x="230" y="115" width="100" height="30" class="box" />
  <text x="280" y="130">Attention</text>
  <text x="280" y="160" class="desc">Align &amp; Translate</text>

  <!-- 2017 Transformer -->
  <circle cx="380" cy="100" r="6" class="dot"/>
  <text x="380" y="75" class="year">2017</text>
  <rect x="330" y="25" width="100" height="30" class="box" fill="#7c3aed" stroke="#7c3aed" fill-opacity="0.2"/>
  <text x="380" y="40" font-weight="bold">Transformer</text>
  <text x="380" y="120" class="desc">All You Need</text>

  <!-- 2018 BERT -->
  <circle cx="480" cy="100" r="6" class="dot"/>
  <text x="480" y="75" class="year">2018</text>
  <rect x="430" y="115" width="100" height="30" class="box" />
  <text x="480" y="130">BERT</text>
  <text x="480" y="160" class="desc">Masked LM</text>

  <!-- 2019/20 GPT-2/3 -->
  <circle cx="580" cy="100" r="6" class="dot"/>
  <text x="580" y="75" class="year">2019/20</text>
  <rect x="530" y="25" width="100" height="30" class="box" />
  <text x="580" y="40">GPT-2 &amp; 3</text>
  <text x="580" y="120" class="desc">Few-shot Learners</text>

</svg>
