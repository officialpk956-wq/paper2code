<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrnas" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <text x="10" y="15" font-family="monospace" font-size="9" fill="#9ca3af">NEURAL ARCHITECTURE SEARCH (NAS)</text>

  <!-- Three NAS strategies -->
  <!-- RL-based NAS -->
  <rect x="10" y="24" width="215" height="100" rx="4" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="117" y="40" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">RL-based NAS (2017)</text>
  <text x="117" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Controller RNN samples architectures</text>
  <text x="117" y="67" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Train child network → get validation acc</text>
  <text x="117" y="79" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">Reward = acc → update controller</text>
  <text x="117" y="91" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">800 GPUs × 28 days = NASNet</text>
  <text x="117" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">matched SOTA but prohibitively</text>
  <text x="117" y="115" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">expensive to search</text>

  <!-- DARTS -->
  <rect x="240" y="24" width="215" height="100" rx="4" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="347" y="40" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">DARTS (2019)</text>
  <text x="347" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Differentiable search via weights α</text>
  <text x="347" y="67" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">ōᵢⱼ = Σ exp(αᵒ)/Σexp(α) · o(x)</text>
  <text x="347" y="79" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">all ops weighted, gradient through</text>
  <text x="347" y="91" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">Prune: keep highest-α ops</text>
  <text x="347" y="103" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">4 GPU-days to search a cell</text>
  <text x="347" y="115" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">transfer search cell to final arch</text>

  <!-- EfficientNet / Once-for-All -->
  <rect x="470" y="24" width="240" height="100" rx="4" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="590" y="40" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">EfficientNet / OFA (2019–2020)</text>
  <text x="590" y="55" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">EfficientNet: compound scaling NAS</text>
  <text x="590" y="67" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">depth × width × resolution jointly</text>
  <text x="590" y="79" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">Once-for-All: train one supernet</text>
  <text x="590" y="91" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">any subnet inherits weights</text>
  <text x="590" y="103" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">deploy on any device without retraining</text>
  <text x="590" y="115" font-family="monospace" font-size="7" fill="#9ca3af" text-anchor="middle">1000× search cost reduction</text>

  <!-- Timeline and costs -->
  <rect x="10" y="140" width="700" height="52" rx="4" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="360" y="155" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">NAS COMPUTE COST REDUCTION</text>
  <text x="90" y="170" font-family="monospace" font-size="7" fill="#c4b5fd" text-anchor="middle">NASNet (2017)</text>
  <text x="90" y="182" font-family="monospace" font-size="7" fill="#f87171" text-anchor="middle">~22,400 GPU-hrs</text>
  <text x="250" y="170" font-family="monospace" font-size="7" fill="#67e8f9" text-anchor="middle">AmoebaNet (2018)</text>
  <text x="250" y="182" font-family="monospace" font-size="7" fill="#f87171" text-anchor="middle">~75,600 GPU-hrs</text>
  <text x="420" y="170" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">DARTS (2019)</text>
  <text x="420" y="182" font-family="monospace" font-size="7" fill="#fcd34d" text-anchor="middle">~96 GPU-hrs</text>
  <text x="580" y="170" font-family="monospace" font-size="7" fill="#f59e0b" text-anchor="middle">OFA / SPOS (2020)</text>
  <text x="580" y="182" font-family="monospace" font-size="7" fill="#6ee7b7" text-anchor="middle">~0 GPU-hrs (zero-cost proxies)</text>
</svg>
