<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-classifier { stroke: #0ea5e9; }
    .box-decision { stroke: #7c3aed; }
    .box-human { stroke: #f59e0b; fill: #f59e0b; fill-opacity: 0.1; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Content Moderation Pipeline</text>

  <!-- Input -->
  <rect x="20" y="80" width="80" height="40" class="box" />
  <text x="60" y="100">User Post</text>

  <line x1="100" y1="100" x2="140" y2="100" class="arrow"/>

  <!-- Classifiers -->
  <rect x="140" y="40" width="140" height="120" class="box box-classifier" />
  <text x="210" y="60" fill="#0ea5e9">Classifiers</text>
  <text x="210" y="85" class="label">Text NLP (Toxic)</text>
  <text x="210" y="105" class="label">Vision (NSFW)</text>
  <text x="210" y="125" class="label">Audio (Hate Speech)</text>
  <text x="210" y="145" class="label">Hash Match (CSAM)</text>

  <line x1="280" y1="100" x2="320" y2="100" class="arrow"/>

  <!-- Decision Engine -->
  <rect x="320" y="70" width="120" height="60" class="box box-decision" />
  <text x="380" y="90" fill="#7c3aed">Decision Engine</text>
  <text x="380" y="110" class="label">Risk Score &amp; Rules</text>

  <!-- Outcomes -->
  <path d="M 440 100 L 480 60 L 500 60" fill="none" class="arrow"/>
  <path d="M 440 100 L 480 140 L 500 140" fill="none" class="arrow"/>
  <line x1="440" y1="100" x2="500" y2="100" class="arrow"/>

  <rect x="500" y="40" width="100" height="35" class="box" stroke="#10b981"/>
  <text x="550" y="58" fill="#10b981">Auto-Approve</text>

  <rect x="500" y="82" width="100" height="35" class="box" stroke="#ef4444"/>
  <text x="550" y="100" fill="#ef4444">Auto-Reject</text>

  <rect x="500" y="125" width="100" height="45" class="box box-human"/>
  <text x="550" y="140" fill="#f59e0b">Human Review</text>
  <text x="550" y="160" class="label">Edge Cases</text>

</svg>
