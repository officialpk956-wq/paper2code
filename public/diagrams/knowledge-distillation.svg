<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrkd" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrkdg" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Teacher model -->
  <rect x="10" y="40" width="160" height="110" rx="6" fill="#312e81" stroke="#7c3aed" stroke-width="2"/>
  <text x="90" y="62" font-family="monospace" font-size="12" fill="#c4b5fd" text-anchor="middle">Teacher</text>
  <text x="90" y="80" font-family="monospace" font-size="9" fill="#a5b4fc" text-anchor="middle">GPT-4 · 1.8T params</text>
  <text x="90" y="95" font-family="monospace" font-size="9" fill="#a5b4fc" text-anchor="middle">large, accurate</text>
  <text x="90" y="110" font-family="monospace" font-size="9" fill="#818cf8" text-anchor="middle">slow to serve</text>
  <text x="90" y="125" font-family="monospace" font-size="9" fill="#818cf8" text-anchor="middle">expensive</text>
  <text x="90" y="140" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">produces soft labels</text>

  <!-- Soft labels arrow -->
  <line x1="170" y1="95" x2="228" y2="95" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrkd)"/>
  <text x="199" y="88" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">soft</text>
  <text x="199" y="100" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">labels</text>

  <!-- Soft labels explanation -->
  <rect x="230" y="55" width="180" height="80" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1"/>
  <text x="320" y="73" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Temperature T softmax:</text>
  <text x="320" y="88" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">p_i = exp(z_i/T) / Σ exp(z_j/T)</text>
  <text x="320" y="103" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">T=1: [0.97, 0.02, 0.01]</text>
  <text x="320" y="117" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">T=4: [0.55, 0.30, 0.15]</text>
  <text x="320" y="128" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">"cat-like" info preserved</text>

  <!-- Student model -->
  <rect x="540" y="40" width="170" height="110" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="625" y="62" font-family="monospace" font-size="12" fill="#6ee7b7" text-anchor="middle">Student</text>
  <text x="625" y="80" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">DistilBERT · 66M</text>
  <text x="625" y="95" font-family="monospace" font-size="9" fill="#9ca3af" text-anchor="middle">Qwen-7B distilled</text>
  <text x="625" y="110" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">fast to serve</text>
  <text x="625" y="125" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">cheap</text>
  <text x="625" y="140" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">97% of teacher quality</text>

  <line x1="415" y1="95" x2="538" y2="95" stroke="#10b981" stroke-width="2" marker-end="url(#arrkdg)"/>
  <text x="477" y="88" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">distillation</text>
  <text x="477" y="100" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">loss</text>

  <!-- Loss equation -->
  <rect x="10" y="165" width="700" height="35" rx="5" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="360" y="180" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Loss = α · KL(p_teacher || p_student) + (1-α) · CE(hard_labels, p_student)    α typically 0.9 — soft labels dominate</text>
  <text x="360" y="194" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">DeepSeek-R1 → Qwen-7B distillation beat o1-mini with this approach on AIME 2024</text>
</svg>
