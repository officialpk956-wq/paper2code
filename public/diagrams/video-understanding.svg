<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .box-spatial { stroke: #06b6d4; }
    .box-temporal { stroke: #10b981; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Two-Stream &amp; SlowFast Architectures</text>

  <!-- Spatial / Slow Stream -->
  <text x="80" y="60" class="label" fill="#06b6d4">Spatial (RGB) / Slow</text>
  <rect x="20" y="70" width="120" height="40" class="box box-spatial" />
  <text x="80" y="90">High Res, 30fps</text>
  <line x1="140" y1="90" x2="180" y2="90" class="arrow"/>
  
  <rect x="180" y="70" width="160" height="40" class="box box-spatial" />
  <text x="260" y="90">2D/3D ResNet Blocks</text>
  <line x1="340" y1="90" x2="380" y2="90" class="arrow"/>
  
  <rect x="380" y="70" width="120" height="40" class="box box-spatial" fill="#06b6d4" fill-opacity="0.1"/>
  <text x="440" y="90">Appearance Feat.</text>

  <!-- Temporal / Fast Stream -->
  <text x="80" y="140" class="label" fill="#10b981">Temporal (Flow) / Fast</text>
  <rect x="20" y="150" width="120" height="40" class="box box-temporal" />
  <text x="80" y="170">Low Res, 8fps</text>
  <line x1="140" y1="170" x2="180" y2="170" class="arrow"/>
  
  <rect x="180" y="150" width="160" height="40" class="box box-temporal" />
  <text x="260" y="170">Lightweight Conv</text>
  <line x1="340" y1="170" x2="380" y2="170" class="arrow"/>
  
  <rect x="380" y="150" width="120" height="40" class="box box-temporal" fill="#10b981" fill-opacity="0.1"/>
  <text x="440" y="170">Motion Feat.</text>

  <!-- Fusion -->
  <line x1="500" y1="90" x2="540" y2="120" class="arrow"/>
  <line x1="500" y1="170" x2="540" y2="140" class="arrow"/>

  <rect x="540" y="110" width="140" height="40" class="box" stroke="#7c3aed" fill="#7c3aed" fill-opacity="0.2"/>
  <text x="610" y="130" fill="#ffffff">Late Fusion / Action</text>

  <!-- Lateral connection (SlowFast specific) -->
  <path d="M 260 150 L 260 110" fill="none" stroke="#10b981" stroke-dasharray="4" marker-end="url(#arrowhead)"/>
  <text x="280" y="130" class="label">Lateral Conn.</text>
</svg>
