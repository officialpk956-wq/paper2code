<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <!-- Stage boxes -->
  <rect x="10" y="75" width="90" height="50" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="55" y="97" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">User</text>
  <text x="55" y="112" font-family="monospace" font-size="10" fill="#fff" text-anchor="middle">Query</text>

  <rect x="130" y="75" width="90" height="50" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="175" y="97" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Query</text>
  <text x="175" y="112" font-family="monospace" font-size="9" fill="#fff" text-anchor="middle">Parser</text>

  <rect x="250" y="75" width="100" height="50" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="300" y="97" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Inverted</text>
  <text x="300" y="112" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">Index + BM25</text>

  <rect x="380" y="75" width="100" height="50" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="430" y="97" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">L2 Ranker</text>
  <text x="430" y="112" font-family="monospace" font-size="9" fill="#06b6d4" text-anchor="middle">(LambdaMART)</text>

  <rect x="510" y="75" width="100" height="50" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="560" y="97" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Neural</text>
  <text x="560" y="112" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Re-ranker</text>

  <rect x="640" y="75" width="70" height="50" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="675" y="97" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Top-10</text>
  <text x="675" y="112" font-family="monospace" font-size="9" fill="#10b981" text-anchor="middle">Results</text>

  <!-- Arrows -->
  <line x1="100" y1="100" x2="128" y2="100" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="220" y1="100" x2="248" y2="100" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="350" y1="100" x2="378" y2="100" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="480" y1="100" x2="508" y2="100" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="100" x2="638" y2="100" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage labels below -->
  <text x="55" y="145" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">input</text>
  <text x="300" y="145" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">L1: top-1000 recall</text>
  <text x="430" y="145" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">L2: top-50</text>
  <text x="560" y="145" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">L3: top-10</text>

  <!-- Latency bar -->
  <text x="360" y="175" font-family="monospace" font-size="10" fill="#9ca3af" text-anchor="middle">Latency budget: BM25 ~5ms · LTR ~20ms · Neural ~80ms · Total ≤150ms</text>
</svg>
