<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .gpu { stroke: #10b981; }
    .arrow { stroke: #10b981; stroke-width: 2; stroke-dasharray: 4; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Ring Attention (Sequence Parallelism for 1M+ Context)</text>

  <!-- GPUs -->
  <rect x="80" y="60" width="100" height="80" class="box gpu" />
  <text x="130" y="85">GPU 0</text>
  <text x="130" y="110" class="label">Tokens 0-250K</text>

  <rect x="240" y="60" width="100" height="80" class="box gpu" />
  <text x="290" y="85">GPU 1</text>
  <text x="290" y="110" class="label">Tokens 250K-500K</text>

  <rect x="400" y="60" width="100" height="80" class="box gpu" />
  <text x="450" y="85">GPU 2</text>
  <text x="450" y="110" class="label">Tokens 500K-750K</text>

  <rect x="560" y="60" width="100" height="80" class="box gpu" />
  <text x="610" y="85">GPU 3</text>
  <text x="610" y="110" class="label">Tokens 750K-1M</text>

  <!-- Arrows -->
  <line x1="180" y1="100" x2="240" y2="100" class="arrow"/>
  <line x1="340" y1="100" x2="400" y2="100" class="arrow"/>
  <line x1="500" y1="100" x2="560" y2="100" class="arrow"/>
  
  <path d="M 610 140 L 610 170 L 130 170 L 130 140" fill="none" class="arrow"/>
  
  <text x="370" y="160" class="label" fill="#10b981">Pass Key-Value (KV) blocks in a ring to compute full attention</text>

</svg>
