<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrann" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Exact search (naive) -->
  <rect x="10" y="20" width="150" height="90" rx="5" fill="#1a1d24" stroke="#6b7280" stroke-width="1.5"/>
  <text x="85" y="42" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">Brute Force</text>
  <text x="85" y="58" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">compare to all N vectors</text>
  <text x="85" y="72" font-family="monospace" font-size="8" fill="#4b5563" text-anchor="middle">O(N·d) per query</text>
  <text x="85" y="86" font-family="monospace" font-size="8" fill="#4b5563" text-anchor="middle">exact, but N=100M:</text>
  <text x="85" y="100" font-family="monospace" font-size="8" fill="#ef4444" text-anchor="middle">~100 seconds</text>

  <line x1="160" y1="65" x2="178" y2="65" stroke="#374151" stroke-width="1.5" marker-end="url(#arrann)"/>

  <!-- IVF-PQ -->
  <rect x="180" y="10" width="160" height="115" rx="5" fill="#1a1d24" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="260" y="30" font-family="monospace" font-size="10" fill="#67e8f9" text-anchor="middle">IVF-PQ</text>
  <text x="260" y="48" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">1. K-means cluster vectors</text>
  <text x="260" y="62" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">2. Search top nprobe clusters</text>
  <text x="260" y="76" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">3. PQ: compress 128d→8B</text>
  <text x="260" y="90" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">   (16 subvectors × 256 codes)</text>
  <text x="260" y="104" font-family="monospace" font-size="8" fill="#67e8f9" text-anchor="middle">10-100ms, 96% recall</text>
  <text x="260" y="118" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">FAISS (Meta AI)</text>

  <line x1="340" y1="65" x2="358" y2="65" stroke="#06b6d4" stroke-width="1.5" marker-end="url(#arrann)"/>

  <!-- HNSW -->
  <rect x="360" y="10" width="175" height="115" rx="5" fill="#1e3a5f" stroke="#7c3aed" stroke-width="2"/>
  <text x="448" y="30" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">HNSW</text>
  <text x="448" y="47" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Hierarchical Navigable</text>
  <text x="448" y="60" font-family="monospace" font-size="8" fill="#a5b4fc" text-anchor="middle">Small World graph</text>
  <text x="448" y="76" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">layer 0: dense local links</text>
  <text x="448" y="89" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">layer L: sparse long links</text>
  <text x="448" y="103" font-family="monospace" font-size="8" fill="#c4b5fd" text-anchor="middle">1-10ms, 99% recall</text>
  <text x="448" y="117" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">O(log N) search · Malkov 2016</text>

  <!-- HNSW diagram (simplified) -->
  <rect x="540" y="10" width="170" height="115" rx="5" fill="#1a1d24" stroke="#7c3aed" stroke-width="1"/>
  <text x="625" y="28" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">HNSW Layers</text>
  <!-- Layer 2 (coarse) -->
  <text x="545" y="44" font-family="monospace" font-size="7" fill="#7c3aed">L2</text>
  <circle cx="580" cy="42" r="5" fill="#7c3aed"/>
  <circle cx="650" cy="42" r="5" fill="#7c3aed"/>
  <circle cx="700" cy="42" r="5" fill="#7c3aed"/>
  <line x1="585" y1="42" x2="645" y2="42" stroke="#7c3aed" stroke-width="1"/>
  <line x1="655" y1="42" x2="695" y2="42" stroke="#7c3aed" stroke-width="1"/>
  <!-- Layer 1 -->
  <text x="545" y="74" font-family="monospace" font-size="7" fill="#9ca3af">L1</text>
  <circle cx="565" cy="72" r="4" fill="#4b5563"/>
  <circle cx="580" cy="72" r="4" fill="#7c3aed"/>
  <circle cx="615" cy="72" r="4" fill="#4b5563"/>
  <circle cx="650" cy="72" r="4" fill="#7c3aed"/>
  <circle cx="680" cy="72" r="4" fill="#4b5563"/>
  <circle cx="700" cy="72" r="4" fill="#7c3aed"/>
  <!-- Layer 0 (dense) -->
  <text x="545" y="105" font-family="monospace" font-size="7" fill="#9ca3af">L0</text>
  <circle cx="556" cy="100" r="3" fill="#374151"/>
  <circle cx="567" cy="100" r="3" fill="#374151"/>
  <circle cx="578" cy="100" r="3" fill="#7c3aed"/>
  <circle cx="590" cy="100" r="3" fill="#374151"/>
  <circle cx="602" cy="100" r="3" fill="#374151"/>
  <circle cx="615" cy="100" r="3" fill="#374151"/>
  <circle cx="628" cy="100" r="3" fill="#374151"/>
  <circle cx="641" cy="100" r="3" fill="#7c3aed"/>
  <circle cx="654" cy="100" r="3" fill="#374151"/>
  <circle cx="667" cy="100" r="3" fill="#374151"/>
  <circle cx="680" cy="100" r="3" fill="#374151"/>
  <circle cx="700" cy="100" r="3" fill="#7c3aed"/>

  <!-- Bottom: comparison table -->
  <rect x="10" y="140" width="700" height="60" rx="5" fill="#1a1d24" stroke="#374151" stroke-width="1"/>
  <text x="360" y="157" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Method          | Build time | Query time | Memory | Recall  | Best for</text>
  <text x="360" y="171" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">Brute force     | instant    | O(N·d)     | 1×     | 100%    | N&lt;1M, exact</text>
  <text x="360" y="183" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">IVF-PQ (FAISS)  | minutes    | 10-100ms   | 0.1×   | 90-96%  | N&gt;100M, low RAM</text>
  <text x="360" y="195" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">HNSW            | hours      | 1-10ms     | 2×     | 98-99%  | N&lt;100M, fast query</text>
</svg>
