<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="200" fill="#0f1115" rx="8"/>
  <style>
    text { font-family: monospace; font-size: 13px; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
    .box { fill: #1a1d24; stroke-width: 2; rx: 6; }
    .arrow { stroke: #4b5563; stroke-width: 2; marker-end: url(#arrowhead); }
    .title { font-size: 14px; font-weight: bold; fill: #9ca3af; }
    .label { font-size: 11px; fill: #9ca3af; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
  </defs>

  <text x="360" y="20" class="title">Model Compression: Pruning &amp; Quantization</text>

  <!-- Pruning Section -->
  <rect x="20" y="40" width="320" height="140" fill="none" stroke="#06b6d4" stroke-dasharray="4" rx="8"/>
  <text x="180" y="60" fill="#06b6d4">Network Pruning</text>
  
  <rect x="60" y="90" width="80" height="60" class="box" />
  <text x="100" y="110">Dense</text>
  <text x="100" y="130" class="label">100% Weights</text>

  <line x1="150" y1="120" x2="210" y2="120" class="arrow"/>
  
  <rect x="220" y="90" width="80" height="60" class="box" stroke="#10b981"/>
  <text x="260" y="110">Sparse</text>
  <text x="260" y="130" class="label">30% Weights</text>

  <text x="180" y="160" class="label">Remove connections near zero</text>

  <!-- Quantization Section -->
  <rect x="380" y="40" width="320" height="140" fill="none" stroke="#7c3aed" stroke-dasharray="4" rx="8"/>
  <text x="540" y="60" fill="#7c3aed">Weight Quantization</text>

  <rect x="420" y="90" width="80" height="60" class="box" />
  <text x="460" y="110">FP32</text>
  <text x="460" y="130" class="label">4 Bytes</text>

  <line x1="510" y1="120" x2="570" y2="120" class="arrow"/>
  
  <rect x="580" y="90" width="80" height="60" class="box" stroke="#f59e0b"/>
  <text x="620" y="110">INT8</text>
  <text x="620" y="130" class="label">1 Byte</text>

  <text x="540" y="160" class="label">Reduce numerical precision</text>

</svg>
