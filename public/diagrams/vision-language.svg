<svg viewBox="0 0 720 210" xmlns="http://www.w3.org/2000/svg">
  <rect width="720" height="210" fill="#0f1115" rx="8"/>
  <defs>
    <marker id="arrvl" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrvlc" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#06b6d4"/>
    </marker>
  </defs>

  <!-- CLIP (contrastive pretraining) -->
  <rect x="10" y="30" width="190" height="90" rx="6" fill="#1a1d24" stroke="#06b6d4" stroke-width="2"/>
  <text x="105" y="52" font-family="monospace" font-size="11" fill="#67e8f9" text-anchor="middle">CLIP Contrastive Training</text>
  <text x="105" y="68" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Image encoder (ViT)</text>
  <text x="105" y="82" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Text encoder (Transformer)</text>
  <text x="105" y="96" font-family="monospace" font-size="8" fill="#6ee7b7" text-anchor="middle">→ shared embedding space</text>
  <text x="105" y="110" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">400M image-text pairs | OpenAI 2021</text>

  <!-- CLIP outputs -->
  <rect x="10" y="140" width="190" height="55" rx="5" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="105" y="158" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">CLIP Applications</text>
  <text x="105" y="173" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">zero-shot classification</text>
  <text x="105" y="186" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">image-text retrieval · DALL-E prior</text>

  <line x1="105" y1="120" x2="105" y2="138" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrvl)"/>

  <!-- Divider -->
  <line x1="215" y1="15" x2="215" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- DALL-E / Text to Image -->
  <rect x="225" y="20" width="150" height="75" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="300" y="40" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">DALL-E 2</text>
  <text x="300" y="55" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">CLIP image prior</text>
  <text x="300" y="68" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">+ DDPM decoder</text>
  <text x="300" y="81" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">text → image | 2022</text>

  <rect x="225" y="110" width="150" height="75" rx="6" fill="#1a1d24" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="300" y="130" font-family="monospace" font-size="10" fill="#c4b5fd" text-anchor="middle">Stable Diffusion</text>
  <text x="300" y="145" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">CLIP text encoder</text>
  <text x="300" y="158" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">+ LDM (64×64 latent)</text>
  <text x="300" y="171" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">open weights | 2022</text>

  <!-- Divider -->
  <line x1="388" y1="15" x2="388" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- VQA / LLaVA -->
  <rect x="398" y="20" width="150" height="80" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="473" y="40" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">LLaVA / InstructBLIP</text>
  <text x="473" y="55" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">CLIP image encoder</text>
  <text x="473" y="68" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">→ projection layer</text>
  <text x="473" y="81" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">→ LLM decoder</text>
  <text x="473" y="92" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">visual question answering</text>

  <rect x="398" y="115" width="150" height="75" rx="6" fill="#1a1d24" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="473" y="135" font-family="monospace" font-size="10" fill="#fcd34d" text-anchor="middle">GPT-4V / Gemini</text>
  <text x="473" y="150" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">native multimodal</text>
  <text x="473" y="163" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">interleaved img+text</text>
  <text x="473" y="176" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">single joint model</text>

  <!-- Divider -->
  <line x1="562" y1="15" x2="562" y2="200" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- SAM -->
  <rect x="572" y="20" width="140" height="80" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="642" y="40" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">SAM</text>
  <text x="642" y="55" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">Segment Anything</text>
  <text x="642" y="68" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">image encoder (ViT)</text>
  <text x="642" y="81" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">+ prompt encoder</text>
  <text x="642" y="92" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">Meta AI 2023</text>

  <rect x="572" y="115" width="140" height="75" rx="6" fill="#1a1d24" stroke="#10b981" stroke-width="1.5"/>
  <text x="642" y="135" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">SAM Prompts</text>
  <text x="642" y="150" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">point click</text>
  <text x="642" y="163" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">bounding box</text>
  <text x="642" y="176" font-family="monospace" font-size="8" fill="#9ca3af" text-anchor="middle">free-form text</text>

  <text x="360" y="198" font-family="monospace" font-size="8" fill="#6b7280" text-anchor="middle">CLIP (2021) → contrastive shared embedding → powers DALL-E, Stable Diffusion, LLaVA, and zero-shot classification</text>
</svg>
