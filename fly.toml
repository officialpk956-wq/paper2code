app = "paper2code-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENVIRONMENT = "production"
  RATE_LIMIT_ENABLED = "true"

[processes]
  api    = "uvicorn backend.server:app --host 0.0.0.0 --port ${PORT:-8080}"
  worker = "celery -A backend.celery_app worker --loglevel=info --concurrency=1"
  beat   = "celery -A backend.celery_app beat --loglevel=info"

[http_service]
  processes = ["api"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  processes = ["api"]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["worker"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[[vm]]
  processes = ["beat"]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
