# Paper2Code — Local Development Stack
# Usage:
#   docker compose up -d          # start all services
#   docker compose up -d postgres redis   # db + cache only (run API manually)
#   docker compose logs -f worker          # watch celery worker

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       p2c
      POSTGRES_USER:     p2c
      POSTGRES_PASSWORD: p2cdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - api_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2c"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis 7 (Celery broker + result backend + rate-limit counters) ─────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - api_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # ── FastAPI Application ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://p2c:p2cdev@postgres:5432/p2c
      REDIS_URL:    redis://redis:6379/0
      ENVIRONMENT:  development
    networks:
      - api_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.server:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://p2c:p2cdev@postgres:5432/p2c
      REDIS_URL:    redis://redis:6379/0
    networks:
      - api_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2

  # ── Celery Beat (periodic task scheduler) ─────────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://p2c:p2cdev@postgres:5432/p2c
      REDIS_URL:    redis://redis:6379/0
    networks:
      - api_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  # ── Flower (Celery queue dashboard) ───────────────────────────────────────
  # Access at http://localhost:5555
  # SECURITY: Do not expose port 5555 publicly — internal monitoring only.
  flower:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:5555:5555"   # bind to localhost only
    networks:
      - api_network
    depends_on:
      - redis
    command: celery -A backend.celery_app flower --port=5555 --url-prefix=flower

  # ── Nginx (TLS termination, rate limiting, gzip) ──────────────────────────
  # Exposes port 80 (HTTP) and 443 (HTTPS — requires certs in ./nginx/certs/).
  # In dev: routes localhost:80 → api:8000 with rate limiting.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro          # TLS certs (optional)
      - ./nginx/certbot:/var/www/certbot:ro         # ACME challenge dir (optional)
    networks:
      - api_network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  api_network:

volumes:
  pgdata:
